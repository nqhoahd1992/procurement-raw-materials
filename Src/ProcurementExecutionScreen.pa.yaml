                                          Width: =Parent.Width - 20
                                          Wrap: =false
                        - rowReqInfoC_PE:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =60
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =60
                              PaddingBottom: =4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - colReqDeliveryLocation_PE:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =300
                                  Children:
                                    - lblReqDeliveryLocationLabel_PE:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(136, 135, 128, 1)
                                          Height: =20
                                          PaddingLeft: =0
                                          Size: =9
                                          Text: ="Delivery Location"
                                          Width: =300
                                    - lblReqDeliveryLocationValue_PE:
                                        Control: Label@2.5.1
                                        Properties:
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          PaddingLeft: =0
                                          Size: =11
                                          Text: =Coalesce(gSelectedRequest.DeliveryLocation.Value, "—")
                                          Width: =Parent.Width - 20
