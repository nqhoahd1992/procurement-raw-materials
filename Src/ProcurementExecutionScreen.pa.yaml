Screens:
  ProcurementExecutionScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(rdoDecision_PE);
        Reset(txtRejectReason_PE);
        Reset(chk1_PE);
        Reset(chk2_PE);
        Reset(chk3_PE);
        Reset(chk4_PE);
        Reset(chk5_PE);
        Reset(chk6_PE);
        Reset(txtSupplierSummary_PE);
        Reset(txtPurchaseOrder_PE);
        Reset(rdoInvoiceChoice_PE);
        Reset(rdoInvoiceCorrect_PE);
        Reset(txtInvDateValue_PE);
        Reset(txtSupplierNameValue_PE);
        Reset(txtBilledToValue_PE);
        Reset(txtInvNumValue_PE);
        Reset(txtABNValue_PE);
        Reset(txtAttentionValue_PE);
        Reset(txtDescriptionValue_PE);
        Reset(txtTotalAmountValue_PE);
        Reset(txtTaxAmountValue_PE);
        Reset(txtCurrencyValue_PE);
        ResetForm(formConfirmation);
        ResetForm(formRemittance);
        ResetForm(formOfficialInvoice_PE);
        Set(gHasInvoiceResult, false);
        Set(gInvoiceResult, Blank());
        Set(gParsingInvoice, false);
        Set(gPendingInvName_PE, "");
        Set(gPendingNewAttName, "");
        Set(gPendingPath, "");
        Set(locIsViaRequester, Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)));
        Set(locOfficialInvoiceURL_PE, "");
        ClearCollect(
            colRequirementFiles,
            ForAll(
                Filter(Split(Coalesce(gSelectedRequest.RequirementFiles, ""), "|"), Len(Value) > 0) As f,
                {
                    FileName: f.Value,
                    FileURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(f.Value)
                }
            )
        );
        ClearCollect(colLineItemsDetail, Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)))
    Children:
      - rectHeader_PE:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblUserInfo_PE:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - lblScreenTitle_PE:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: |-
              ="Procurement Execution - ID: " & gSelectedRequest.ID & " - " & gSelectedRequest.Title
            Width: =654
            X: =20
      - conScrollable_PE:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowRequestInfo_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: |-
                    =68 + 328 +
                        (92 + CountRows(colLineItemsDetail) * 48) +
                        If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                        If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), 56, 0) +
                        If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: |-
                    =68 + 328 +
                        (92 + CountRows(colLineItemsDetail) * 48) +
                        If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                        If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), 56, 0) +
                        If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
