                                    Text: =If(IsBlank(gSelectedRequest.RemittanceURL), "—", "Open remittance advice ↗")
                                    Tooltip: =gSelectedRequest.RemittanceURL
                                    Underline: =Not(IsBlank(gSelectedRequest.RemittanceURL))
                                    Width: =Parent.Width
                                    Wrap: =false
            - rowConditionsBanner_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =110
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =rdoDecision_PE.Selected.Value = "Proceed" &&
                    Not(IsBlank(LookUp('RM Procurement Approval Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 3).ApprovalConditions))
                  Width: =Parent.Width
                Children:
                  - lblConditionsTitle_PE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =9
                        Text: ="Executive Remark"
                        Width: =Parent.Width - 40
                  - lblConditionsText_PE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(68, 68, 65, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =50
                        Overflow: =Overflow.Scroll
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: =LookUp('RM Procurement Approval Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 3).ApprovalConditions
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 40
            - rowDecision_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =90
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblDecisionLabel_PE:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Procurement Decision *"
                        Width: =Parent.Width - 40
                  - rdoDecision_PE:
                      Control: Radio@0.0.25
                      Properties:
                        DefaultSelectedItems: =["Proceed"]
                        Height: =40
                        Items: =["Proceed", "Reject"]
                        Layout: ='RadioGroupCanvas.Layout'.Horizontal
                        Width: =300
            - rowRejectReason_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(252, 235, 235, 1)
                  FillPortions: =0
                  Height: =170
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =120
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =rdoDecision_PE.Selected.Value = "Reject"
                  Width: =Parent.Width
                Children:
                  - lblRejectReasonLabel_PE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(163, 45, 45, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Rejection Reason *"
                        Width: =Parent.Width - 40
                  - lblRejectReasonHint_PE:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =30
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =10
                        Text: ="Explain why this procurement request cannot be fulfilled"
                        Width: =Parent.Width - 40
                  - txtRejectReason_PE:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =80
                        Mode: ='TextInputCanvas.Mode'.Multiline
                        Placeholder: ="Enter rejection reason..."
                        Width: =Parent.Width - 40
            - rowSupplierSummary_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =100
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =rdoDecision_PE.Selected.Value = "Proceed"
                  Width: =Parent.Width
                Children:
                  - lblSupplierSummaryLabel_PE:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="SO/PO/INV *"
                        Width: =Parent.Width - 40
                  - txtSupplierSummary_PE:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =40
                        Placeholder: ="Enter SO/PO/INV number..."
                        Width: =Parent.Width - 40
            - rowPurchaseOrder_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =220
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =rdoDecision_PE.Selected.Value = "Proceed"
                  Width: =Parent.Width
                Children:
                  - lblPurchaseOrderLabel_PE:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="Purchase Order Link"
                        Width: =Parent.Width - 40
                  - txtPurchaseOrder_PE:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =40
                        Placeholder: ="Paste Purchase Order Link (optional)..."
                        Width: =Parent.Width - 40
            - rowFormConfirmation_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =150
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =rdoDecision_PE.Selected.Value = "Proceed"
                Children:
                  - lblFormConfirmationLabel_PE_1:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =34
                        PaddingBottom: =15
                        Size: =11
                        Text: ="Upload Confirmation *"
                        Width: =Parent.Width - 40
                  - formConfirmation:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='RM Procurement Requests'
                        Height: =100
                        Item: =gSelectedRequest
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        NumberOfColumns: =1
                        OnFailure: =Notify("Attachment upload failed. Please try again.", NotificationType.Error)
                        OnSuccess: |-
                          =With(
                              {
                                  wCode: Trim(txtSupplierSummary_PE.Value),
                                  wURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(gPendingNewAttName)
                              },
                              // Re-check uniqueness right before writing, so two people submitting at once
                              // cannot file the same SO/PO/INV on two different requests.
                              With(
                                  {wDup: LookUp(
                                      'RM Procurement Execution Log',
                                      StepNumber = 1 && SupplierSummary = wCode && RequestIDText <> Text(gSelectedRequest.ID)
                                  )},
                                  If(
                                      Not(IsBlank(wDup.ID)),
                                      Notify(
                                          "SO/PO/INV " & wCode & " is already used by request ID " & wDup.RequestIDText & ". Nothing was submitted - please enter a different number.",
                                          NotificationType.Error
                                      ),
                                      With(
                                          {wReq: Patch(
                                              'RM Procurement Requests',
                                              gSelectedRequest,
                                              {
                                                  Status: {Value: "In Delivery"},
                                                  OrderConfirmationURL: wURL,
                                                  ProcurementExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                  ProcurementExecutedAt: Now()
                                              }
                                          )},
                                          If(
                                              IsBlank(wReq.ID),
                                              Notify("Failed to submit. Please try again.", NotificationType.Error),
                                              Patch(
                                                  'RM Procurement Execution Log',
                                                  Defaults('RM Procurement Execution Log'),
                                                  {
                                                      Title: "Step 1 - Procurement Execution - " & gSelectedRequest.Title,
                                                      RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                      RequestIDText: Text(gSelectedRequest.ID),
                                                      StepNumber: 1,
                                                      StepName: {Value: "Procurement Execution"},
                                                      ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                      ExecutedAt: Now(),
                                                      SupplierSummary: wCode,
                                                      PurchaseOrderLink: txtPurchaseOrder_PE.Value
                                                  }
                                              );
                                              Patch(
                                                  'RM Procurement Requests',
                                                  {ID: wReq.ID},
                                                  {Title: wReq.Title & " - " & wCode}
                                              );
                                              Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                                              Notify("Request approved for sourcing. You can now create the first delivery.", NotificationType.Success);
                                              Navigate(RequestDetailScreen)
                                          )
                                      )
                                  )
                              )
                          )
                        Width: =Parent.Width
                        X: =40
                        Y: =40
                      Children:
                        - dcConfirmation:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicAttachmentsEdit
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =Blank()
                              DisplayMode: =DisplayMode.Edit
                              DisplayName: =""
                              Height: =100
                              Required: =false
                              Update: =attShadow_Confirmation.Attachments
                              Width: =1314
                              X: =0
                              Y: =0
                            Children:
                              - lblOrderConfirmationLabel_DC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Order Confirmation Document *"
                                    Width: =Parent.Width
                              - attShadow_Confirmation:
                                  Control: Attachments@2.3.0
                                  Properties:
                                    Height: =100
                                    Items: =Parent.Default
                                    MaxAttachments: =100
                                    Width: =Parent.Width
      - conActionBar_PE:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_PE:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
                  X: =40
                  Y: =40
            - conActionBarBtn_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnCancel_PE:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        Height: =36
                        OnSelect: =Navigate(HomeScreen)
                        Text: ="Cancel"
                        Width: =120
                        X: =40
                        Y: =40
                  - btnSubmit_PE:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        FontWeight: =""
                        Height: =36
                        OnSelect: |-
                          =If(
                              rdoDecision_PE.Selected.Value = "Reject",
                              // --- REJECT ---
                              If(
                                  IsBlank(txtRejectReason_PE.Value),
                                  Notify("Please enter a rejection reason", NotificationType.Error),
                                  With(
                                      {wReq: Patch(
                                          'RM Procurement Requests',
                                          gSelectedRequest,
                                          {
                                              Status: {Value: "Rejected"},
                                              ProcurementExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                              ProcurementExecutedAt: Now()
                                          }
                                      )},
                                      If(
                                          IsBlank(wReq.ID),
                                          Notify("Failed to submit. Please try again.", NotificationType.Error),
                                          Patch(
                                              'RM Procurement Execution Log',
                                              Defaults('RM Procurement Execution Log'),
                                              {
                                                  Title: "Step 1 - Procurement Rejected - " & gSelectedRequest.Title,
                                                  RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                  RequestIDText: Text(gSelectedRequest.ID),
                                                  StepNumber: 1,
                                                  StepName: {Value: "Procurement Execution"},
                                                  ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                  ExecutedAt: Now(),
                                                  Notes: txtRejectReason_PE.Value
                                              }
                                          );
                                          Notify("Request has been rejected.", NotificationType.Success);
                                          Navigate(HomeScreen)
                                      )
                                  )
                              ),
                              // --- PROCEED ---
                              If(
                                  IsBlank(Trim(txtSupplierSummary_PE.Value)),
                                  Notify("Please enter SO/PO/INV", NotificationType.Error),
                                  If(
                                      CountRows(attShadow_Confirmation.Attachments) = 0,
                                      Notify("Please attach an order confirmation document", NotificationType.Error),
                                      // SO/PO/INV must be unique across requests - it is stored on the
                                      // step 1 execution log row, so that is where the duplicate lives.
                                      With(
                                          {wDup: LookUp(
                                              'RM Procurement Execution Log',
                                              StepNumber = 1
                                                  && SupplierSummary = Trim(txtSupplierSummary_PE.Value)
                                                  && RequestIDText <> Text(gSelectedRequest.ID)
                                          )},
                                          If(
                                              Not(IsBlank(wDup.ID)),
                                              Notify(
                                                  "This SO/PO/INV is already used by request ID " & wDup.RequestIDText & ". Please enter a different number.",
                                                  NotificationType.Error
                                              ),
                                              Set(gPendingNewAttName, Last(attShadow_Confirmation.Attachments).Name);
                                              SubmitForm(formConfirmation)
                                          )
                                      )
                                  )
                              )
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Submit →"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =120
                        X: =40
                        Y: =40
