Screens:
  ProcurementExecutionScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(rdoDecision_PE);
        Reset(txtRejectReason_PE);
        Reset(txtSupplierSummary_PE);
        Reset(txtPurchaseOrder_PE);
        ResetForm(formConfirmation);
        Set(gPendingNewAttName, "");
        Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        ClearCollect(
            colRequirementFiles,
            ForAll(
                Filter(Split(Coalesce(gSelectedRequest.RequirementFiles, ""), "|"), Len(Value) > 0) As f,
                {
                    FileName: f.Value,
                    FileURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(f.Value)
                }
            )
        );
        ClearCollect(colLineItemsDetail, ForAll(Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)) As li, {ID: li.ID, MaterialID: li.MaterialID, MaterialName: li.MaterialName, Unit: li.Unit, Quantity: li.Quantity, ParentLineItemID: li.ParentLineItemID, RMPKCode: Coalesce(li.MaterialCode, "?")}))
    Children:
      - rectHeader_PE:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblUserInfo_PE:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - lblScreenTitle_PE:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Procurement Execution - " & gSelectedRequest.Title
            Width: =800
            X: =20
      - conScrollable_PE:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowRequestInfo_PE:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: |-
                    =68 + 276 +
                        (44 + Max(1, CountRows(colLineItemsDetail)) * 30) +
                        If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                        If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), 56, 0) +
                        If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: |-
                    =68 + 276 +
                        (44 + Max(1, CountRows(colLineItemsDetail)) * 30) +
                        If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                        If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), 56, 0) +
                        If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowRequestInfoHeader_PE:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblRequestInfoTitle_PE:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              PaddingLeft: =0
                              Text: ="Request Details"
                              Width: =Parent.Width - 260
                              Wrap: =false
                        - lblStatusBadge_PE:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: |-
                                =Switch(gSelectedRequest.Status.Value,
                                  "Pending Manager", RGBA(146, 84, 14, 1),
                                  "Pending Executive", RGBA(175, 74, 20, 1),
                                  "Pending Procurement", RGBA(122, 108, 10, 1),
                                  "In Delivery", RGBA(83, 74, 183, 1),
                                  "Delivered", RGBA(13, 108, 108, 1),
                                  "Rejected", RGBA(163, 45, 45, 1),
                                  "Goods Receipt", RGBA(37, 92, 178, 1),
                                  "Supplier Follow-up", RGBA(11, 105, 132, 1),
                                  "Pending Invoice", RGBA(124, 58, 173, 1),
                                  "Pending Accounting", RGBA(158, 44, 108, 1),
                                  "Completed", RGBA(15, 110, 86, 1),
                                  "Cancelled", RGBA(148, 87, 87, 1),
                                  RGBA(68, 68, 65, 1)
                                )
                              Fill: |-
                                =Switch(gSelectedRequest.Status.Value,
                                  "Pending Manager", RGBA(253, 242, 216, 1),
                                  "Pending Executive", RGBA(253, 234, 222, 1),
                                  "Pending Procurement", RGBA(247, 245, 210, 1),
                                  "In Delivery", RGBA(228, 225, 250, 1),
                                  "Delivered", RGBA(219, 243, 243, 1),
                                  "Rejected", RGBA(252, 233, 233, 1),
                                  "Goods Receipt", RGBA(223, 234, 252, 1),
                                  "Supplier Follow-up", RGBA(219, 241, 249, 1),
                                  "Pending Invoice", RGBA(240, 228, 252, 1),
                                  "Pending Accounting", RGBA(252, 230, 242, 1),
                                  "Completed", RGBA(222, 245, 236, 1),
                                  "Cancelled", RGBA(243, 235, 235, 1),
                                  RGBA(241, 239, 232, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =10
                              Text: =gSelectedRequest.Status.Value
                              Width: =220
                  - conRequestInfoFields_PE:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: |-
                          =276 +
                              (44 + Max(1, CountRows(colLineItemsDetail)) * 30) +
                              If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                              If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), 56, 0) +
                              If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: |-
                          =276 +
                              (44 + Max(1, CountRows(colLineItemsDetail)) * 30) +
                              If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                              If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), 56, 0) +
                              If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - rowReqInfoA_PE:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =60
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =60
                              PaddingBottom: =4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - colReqProcType_PE:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =300
                                  Children:
                                    - lblReqProcTypeLabel_PE:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(136, 135, 128, 1)
                                          Height: =20
                                          PaddingLeft: =0
                                          Size: =9
                                          Text: ="Procurement Type"
                                          Width: =300
                                    - lblReqProcTypeValue_PE:
                                        Control: Label@2.5.1
                                        Properties:
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          PaddingLeft: =0
                                          Size: =11
                                          Text: =Coalesce(gSelectedRequest.ProcurementType.Value, "—")
                                          Width: =Parent.Width - 20
