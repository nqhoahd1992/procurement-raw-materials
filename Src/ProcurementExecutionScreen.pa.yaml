                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(136, 135, 128, 1)
                                          Height: =20
                                          PaddingLeft: =0
                                          Size: =9
                                          Text: ="Cost Center"
                                          Width: =300
                                    - lblReqCostCenterValue_PE:
                                        Control: Label@2.5.1
                                        Properties:
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          PaddingLeft: =0
                                          Size: =11
                                          Text: =Coalesce(gSelectedRequest.CostCenter.Value, "—")
                                          Width: =Parent.Width - 20
                                          Wrap: =false
                        - rowReqDescription_PE:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =96
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =96
                              PaddingBottom: =4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - lblReqDescriptionLabel_PE:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Procurement Description"
                                    Width: =Parent.Width
