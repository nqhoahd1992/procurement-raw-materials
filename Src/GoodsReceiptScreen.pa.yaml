                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(83, 74, 183, 1)
                        Height: =36
                        OnSelect: |-
                          =With(
                              {
                                  wLines: Filter(
                                      ForAll(
                                          Split(
                                              Substitute(Substitute(txtBulkReceiptGR.Value, Char(13), ""), Char(9), " "),
                                              Char(10)
                                          ) As ln,
                                          {Line: Trim(ln.Value)}
                                      ),
                                      Not(IsBlank(Line))
                                  )
                              },
                              With(
                                  {
                                      wParsed: ForAll(
                                          wLines As l,
                                          With(
                                              {wTokens: Filter(Split(l.Line, " ") As tk, Not(IsBlank(Trim(tk.Value))))},
                                              With(
                                                  {
                                                      wCode: Trim(Index(wTokens, 1).Value),
                                                      wQtyRaw: If(CountRows(wTokens) >= 2, Trim(Index(wTokens, 2).Value), ""),
                                                      wBatchRaw: If(CountRows(wTokens) >= 3, Trim(Index(wTokens, 3).Value), ""),
                                                      wExpiryRaw: If(CountRows(wTokens) >= 4, Trim(Index(wTokens, 4).Value), ""),
                                                      wQCRaw: If(CountRows(wTokens) >= 5, Trim(Index(wTokens, 5).Value), "")
                                                  },
                                                  With(
                                                      {
                                                          wRow: LookUp(colRoundEntry, Lower(RMPKCode) = Lower(wCode)),
                                                          wDateTokens: Split(wExpiryRaw, "/")
                                                      },
                                                      {
                                                          Code: wCode,
                                                          LineItemID: Coalesce(wRow.LineItemID, 0),
                                                          FinalQty: If(IsNumeric(wQtyRaw) && Value(wQtyRaw) >= 0, Value(wQtyRaw), wRow.ReceivedQty),
                                                          FinalBatch: If(IsBlank(wBatchRaw), wRow.BatchNumber, wBatchRaw),
                                                          FinalExpiry: If(
                                                              CountRows(wDateTokens) = 3 && IsNumeric(Index(wDateTokens, 1).Value) && IsNumeric(Index(wDateTokens, 2).Value) && IsNumeric(Index(wDateTokens, 3).Value),
                                                              Date(Value(Index(wDateTokens, 3).Value), Value(Index(wDateTokens, 2).Value), Value(Index(wDateTokens, 1).Value)),
                                                              wRow.ExpiryDate
                                                          ),
                                                          FinalQC: If(IsBlank(wQCRaw), wRow.QCNumber, wQCRaw)
                                                      }
                                                  )
                                              )
                                          )
                                      )
                                  },
                                  With(
                                      {
                                          wMatched: Filter(wParsed, LineItemID > 0),
                                          wUnknown: Filter(wParsed, LineItemID = 0)
                                      },
                                      If(
                                          CountRows(wParsed) = 0,
                                          Notify("Please paste at least one line", NotificationType.Error),
                                          ForAll(
                                              wMatched As m,
                                              UpdateIf(
                                                  colRoundEntry,
                                                  LineItemID = m.LineItemID,
                                                  {ReceivedQty: m.FinalQty, BatchNumber: m.FinalBatch, ExpiryDate: m.FinalExpiry, QCNumber: m.FinalQC}
                                              )
                                          );
                                          If(
                                              CountRows(wUnknown) > 0,
                                              Notify(
                                                  Text(CountRows(wUnknown)) & " code(s) skipped — no matching material in this delivery: " & Concat(wUnknown, Code, ", "),
                                                  NotificationType.Warning
                                              )
                                          );
                                          If(
                                              CountRows(wMatched) = 0,
                                              Notify("No row was updated. Please check the codes and try again.", NotificationType.Error),
                                              Notify(Text(CountRows(wMatched)) & " row(s) updated.", NotificationType.Success);
                                              Reset(txtBulkReceiptGR);
                                              Set(gShowBulkReceiptGR, false)
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Apply"
                        Width: =120
