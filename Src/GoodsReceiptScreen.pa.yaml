                  Height: =80
                  LayoutMinHeight: =60
                  PaddingLeft: =0
                  Size: =9
                  Text: |-
                    ="Paste one line per material, in the same order as the list above: QC Number · Batch No · Expiry Date (dd/mm/yyyy) · Received Qty · Link to COA — separated by a space or a tab. The number of lines must match the number of materials, otherwise nothing is applied. Use - for a field to leave unchanged, or a line containing only - to skip that material entirely. The COA link must contain no spaces (a real URL encodes them as %20)."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 40
            - lblBulkReceiptOrder_GR:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  Fill: =RGBA(241, 239, 232, 1)
                  Height: =104
                  LayoutMinHeight: =104
                  Overflow: =Overflow.Scroll
                  PaddingLeft: =8
                  PaddingTop: =4
                  Size: =9
                  Text: |-
                    =Concat(
                        Sequence(CountRows(colRoundEntry)) As s,
                        Text(s.Value) & ". " & Index(colRoundEntry, s.Value).MaterialName,
                        Char(10)
                    )
                  Width: =Parent.Width - 40
            - txtBulkReceiptGR:
                Control: TextInput@0.0.54
                Properties:
                  FillPortions: =1
                  Height: =240
                  LayoutMinHeight: =240
                  Mode: ='TextInputCanvas.Mode'.Multiline
                  Placeholder: ="QC-100 B2026-01 31/12/2026 10 https://coa.example.com/COA-100.pdf" & Char(10) & "QC-101 B2026-02 30/06/2027 5 -"
                  Width: =Parent.Width - 40
            - rowBulkReceiptDialogActions_GR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                Children:
                  - btnBulkReceiptCancel_GR:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Set(gShowBulkReceiptGR, false)
                        Text: ="Cancel"
                        Width: =120
                  - btnBulkReceiptApply_GR:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(83, 74, 183, 1)
                        Height: =36
                        OnSelect: |-
                          =With(
                              {
                                  wLines: Filter(
                                      ForAll(
                                          Split(
                                              Substitute(Substitute(txtBulkReceiptGR.Value, Char(13), ""), Char(9), " "),
                                              Char(10)
                                          ) As ln,
                                          {Line: Trim(ln.Value)}
                                      ),
                                      Not(IsBlank(Line))
                                  )
                              },
                              If(
                                  CountRows(wLines) = 0,
                                  Notify("Please paste at least one line", NotificationType.Error),
                                  If(
                                      CountRows(wLines) <> CountRows(colRoundEntry),
                                      Notify(
                                          "Pasted " & CountRows(wLines) & " line(s) but this delivery has " & CountRows(colRoundEntry) & " material(s). Paste exactly one line per material, in the order listed in the dialog.",
                                          NotificationType.Error
                                      ),
                                      With(
                                          {
                                              wParsed: ForAll(
                                                  Sequence(CountRows(wLines)) As s,
                                                  With(
                                                      {
                                                          wRow: Index(colRoundEntry, s.Value),
                                                          wTokens: Filter(Split(Index(wLines, s.Value).Line, " ") As tk, Not(IsBlank(Trim(tk.Value))))
                                                      },
                                                      With(
                                                          {
                                                              wQCRaw: Trim(Index(wTokens, 1).Value),
                                                              wBatchRaw: If(CountRows(wTokens) >= 2, Trim(Index(wTokens, 2).Value), ""),
                                                              wExpiryRaw: If(CountRows(wTokens) >= 3, Trim(Index(wTokens, 3).Value), ""),
                                                              wQtyRaw: If(CountRows(wTokens) >= 4, Trim(Index(wTokens, 4).Value), ""),
                                                              wCOARaw: If(CountRows(wTokens) >= 5, Trim(Index(wTokens, 5).Value), "")
                                                          },
                                                          With(
                                                              {wDateTokens: Split(wExpiryRaw, "/")},
                                                              {
                                                                  LineItemID: wRow.LineItemID,
                                                                  FinalQC: If(IsBlank(wQCRaw) || wQCRaw = "-", wRow.QCNumber, wQCRaw),
                                                                  FinalBatch: If(IsBlank(wBatchRaw) || wBatchRaw = "-", wRow.BatchNumber, wBatchRaw),
                                                                  FinalExpiry: If(
                                                                      CountRows(wDateTokens) = 3 && IsNumeric(Index(wDateTokens, 1).Value) && IsNumeric(Index(wDateTokens, 2).Value) && IsNumeric(Index(wDateTokens, 3).Value),
                                                                      Date(Value(Index(wDateTokens, 3).Value), Value(Index(wDateTokens, 2).Value), Value(Index(wDateTokens, 1).Value)),
                                                                      wRow.ExpiryDate
                                                                  ),
                                                                  FinalQty: If(IsNumeric(wQtyRaw) && Value(wQtyRaw) >= 0, Value(wQtyRaw), wRow.ReceivedQty),
                                                                  FinalCOA: If(IsBlank(wCOARaw) || wCOARaw = "-", wRow.COALink, wCOARaw)
                                                              }
                                                          )
                                                      )
                                                  )
                                              )
                                          },
                                          ForAll(
                                              wParsed As m,
                                              UpdateIf(
                                                  colRoundEntry,
                                                  LineItemID = m.LineItemID,
                                                  {QCNumber: m.FinalQC, BatchNumber: m.FinalBatch, ExpiryDate: m.FinalExpiry, ReceivedQty: m.FinalQty, COALink: m.FinalCOA}
                                              )
                                          );
                                          Notify(Text(CountRows(wParsed)) & " row(s) updated.", NotificationType.Success);
                                          Reset(txtBulkReceiptGR);
                                          Set(gShowBulkReceiptGR, false)
                                      )
                                  )
                              )
                          )
                        Text: ="Apply"
                        Width: =120
