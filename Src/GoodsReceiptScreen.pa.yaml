Screens:
  GoodsReceiptScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gGRLogEntry, Blank());
        Set(gGRPendingAttachments, Blank());
        NewForm(frmGRLog_GR);
        Reset(chkGR1);
        Reset(chkGR2);
        Reset(chkGR3);
        Reset(chkGR4);
        Reset(chkGR5);
        Reset(dpReceiptDate_GR);
        Reset(ddReceiptStatus_GR);
        Reset(ddAcceptanceDecision_GR);
        Reset(txtRemarks_GR);
        Reset(ddAssignReceiver_GR);
        Set(gShowBulkReceiptGR, false);
        Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        ClearCollect(colLineItemsDetail, ForAll(Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)) As li, {ID: li.ID, MaterialID: li.MaterialID, MaterialName: li.MaterialName, Unit: li.Unit, Quantity: li.Quantity, ParentLineItemID: li.ParentLineItemID, RMPKCode: Coalesce(li.MaterialCode, "?")}));
        ClearCollect(
            colRoundEntry,
            ForAll(
                colLineItemsDetail As li,
                {
                    LineItemID: li.ID,
                    ParentLineItemID: Coalesce(li.ParentLineItemID, 0),
                    MaterialID: li.MaterialID.Id,
                    MaterialName: li.MaterialName,
                    Unit: li.Unit,
                    OrderedQty: li.Quantity,
                    PrevReceivedQty: 0,
                    ReceivedQty: 0,
                    BatchNumber: "",
                    ExpiryDate: Blank(),
                    QCNumber: "",
                    RMPKCode: li.RMPKCode,
                    COALink: ""
                }
            )
        );
        Set(gGRDelegationMode, If(IsBlank(gSelectedRequest.GRAssignedToID) || gSelectedRequest.GRAssignedToID.Id = 0 || gSelectedRequest.GRAssignedToID.Id = gCurrentEmployee.ID, "I will receive", "Assign to someone else"))
    Children:
      - rectHeader_GR:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_GR:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Goods Receipt"
            Width: =773
            X: =20
      - conScrollable_GR:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowInfoBlock_GR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 250, 1)
                  FillPortions: =0
                  Height: =110
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =212
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowInfoLine1_GR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =34
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =24
                        PaddingRight: =1
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblInfoTitle_GR:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =14
                              Text: =gSelectedRequest.Title
                              Width: =600
                        - lblStatusBadge_GR:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: |-
                                =Switch(gSelectedRequest.Status.Value,
                                  "Pending Manager", RGBA(146, 84, 14, 1),
                                  "Pending Executive", RGBA(175, 74, 20, 1),
                                  "Pending Procurement", RGBA(122, 108, 10, 1),
                                  "In Delivery", RGBA(83, 74, 183, 1),
                                  "Delivered", RGBA(13, 108, 108, 1),
                                  "Rejected", RGBA(163, 45, 45, 1),
                                  "Goods Receipt", RGBA(37, 92, 178, 1),
                                  "Supplier Follow-up", RGBA(11, 105, 132, 1),
                                  "Pending Invoice", RGBA(124, 58, 173, 1),
                                  "Pending Accounting", RGBA(158, 44, 108, 1),
                                  "Completed", RGBA(15, 110, 86, 1),
                                  "Cancelled", RGBA(148, 87, 87, 1),
                                  RGBA(68, 68, 65, 1)
                                )
                              Fill: |-
                                =Switch(gSelectedRequest.Status.Value,
                                  "Pending Manager", RGBA(253, 242, 216, 1),
                                  "Pending Executive", RGBA(253, 234, 222, 1),
                                  "Pending Procurement", RGBA(247, 245, 210, 1),
                                  "In Delivery", RGBA(228, 225, 250, 1),
                                  "Delivered", RGBA(219, 243, 243, 1),
                                  "Rejected", RGBA(252, 233, 233, 1),
                                  "Goods Receipt", RGBA(223, 234, 252, 1),
                                  "Supplier Follow-up", RGBA(219, 241, 249, 1),
                                  "Pending Invoice", RGBA(240, 228, 252, 1),
                                  "Pending Accounting", RGBA(252, 230, 242, 1),
                                  "Completed", RGBA(222, 245, 236, 1),
                                  "Cancelled", RGBA(243, 235, 235, 1),
                                  RGBA(241, 239, 232, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =10
                              Text: =gSelectedRequest.Status.Value
                              Width: =220
                  - rowInfoIdent_GR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colIdentProject_GR:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =260
                            Children:
                              - lblIdentProjectLabel_GR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Related Project"
                                    Width: =Parent.Width
                              - lblIdentProjectValue_GR:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gSelectedRequest.ProjectID),
                                          "—",
                                          Coalesce(LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID).Title, "—")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colIdentReqDate_GR:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =170
                            Children:
                              - lblIdentReqDateLabel_GR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Required Delivery Date"
                                    Width: =Parent.Width
                              - lblIdentReqDateValue_GR:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gSelectedRequest.RequiredDeliveryDate),
                                          "—",
                                          Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
            - rowDelegation_GR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =If(gGRDelegationMode = "Assign to someone else", 200, 100)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =gSelectedRequest.RequesterEmail = gCurrentEmployee.Email
                    && IsBlank(LookUp('RM Procurement Execution Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 3))
                  Width: =Parent.Width
                Children:
                  - lblDelegationHeader_GR:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Goods Receiver"
                        Width: =Parent.Width - 40
                  - rowReceiverToggle_GR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - btnIWillReceive_GR:
                            Control: Button@0.0.45
                            Properties:
                              BasePaletteColor: =If(gGRDelegationMode = "I will receive", RGBA(83, 74, 183, 1), RGBA(166, 166, 166, 1))
                              BorderColor: =If(gGRDelegationMode = "I will receive", RGBA(83, 74, 183, 1), RGBA(200, 200, 200, 1))
                              BorderThickness: =If(gGRDelegationMode = "I will receive", 2, 1)
                              Height: =40
                              OnSelect: |-
                                =If(
                                    Not(IsBlank(gSelectedRequest.GRAssignedToID)),
                                    ProcurementNotify.Run(
                                    LookUp('Employee List', ID = gSelectedRequest.GRAssignedToID.Id).email,
                                    gSelectedRequest.GRAssignedToID.Value,
                                    gSelectedRequest.Title,
                                    gSelectedRequest.ID,
                                    "Unassigned",
                                    Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy"),
                                    "",
                                    "Max Biocare · Raw Materials Procurement",
                                    Coalesce(gSelectedRequest.DisplayID, Text(gSelectedRequest.ID))
                                    )
                                );
                                Set(gGRDelegationMode, "I will receive");
                                Set(gSelectedRequest, Patch('RM Procurement Requests', LookUp('RM Procurement Requests', ID = gSelectedRequest.ID), {GRAssignedToID: Blank(), GRAssignedToNum: Blank()}))
                              Text: ="I will receive"
                              Width: =160
                        - btnAssignToOther_GR:
                            Control: Button@0.0.45
                            Properties:
                              BasePaletteColor: =If(gGRDelegationMode = "Assign to someone else", RGBA(83, 74, 183, 1), RGBA(166, 166, 166, 1))
                              BorderColor: =If(gGRDelegationMode = "Assign to someone else", RGBA(83, 74, 183, 1), RGBA(200, 200, 200, 1))
                              BorderThickness: =If(gGRDelegationMode = "Assign to someone else", 2, 1)
                              Height: =40
                              OnSelect: =Set(gGRDelegationMode, "Assign to someone else")
                              Text: ="Assign to someone else"
                              Width: =200
                  - rowAssignReceiver_GR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =100
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
