                              FontWeight: =FontWeight.Bold
                              Height: =24
                              Size: =11
                              Text: ="Assign to *"
                              Width: =Parent.Width
                        - ddAssignReceiver_GR:
                            Control: ModernCombobox@1.1.1
                            Properties:
                              AllowExternalSelectedItems: =false
                              FontWeight: =""
                              Height: =40
                              InputTextPlaceholder: ="Select an employee"
                              ItemDisplayText: =ThisItem.Title
                              Items: =Sort(Filter('Employee List', ID in ForAll(Filter('RM User', IsActive), EmployeeID.Id)), Title, SortOrder.Ascending)
                              SelectMultiple: =false
                              Size: =0
                              Width: =Parent.Width
                        - lblCurrentAssignee_GR:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(83, 74, 183, 1)
                              Height: =20
                              Size: =10
                              Text: |-
                                =If(IsBlank(gSelectedRequest.GRAssignedToID), "", "→ Assigned to: " & gSelectedRequest.GRAssignedToID.Value)
                              Width: =Parent.Width
            - rowChecklistHeader_GR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =70
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =gGRDelegationMode = "I will receive"
                  Width: =Parent.Width
                Children:
                  - lblChecklistHeader_GR:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Goods Receipt Checklist *"
                        Width: =Parent.Width - 40
                  - lblChecklistNote_GR:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(133, 79, 11, 1)
                        Height: =20
                        Size: =10
                        Text: ="All items must be checked before submitting"
                        Width: =Parent.Width - 40
            - rowCheckGR1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
