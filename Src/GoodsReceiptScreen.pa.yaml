      - conActionBar_GR:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_GR:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
                  X: =Parent.Width - 120
                  Y: =40
            - conActionBarBtn_GR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =36
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnCancel_GR:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(HomeScreen)
                        Text: ="Cancel"
                        Width: =120
                        X: =40
                        Y: =40
                  - btnSaveAssignment_GR:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =If(
                              IsBlank(ddAssignReceiver_GR.Selected.Title),
                              Notify("Please select a person to assign", NotificationType.Error),
                              If(
                                  Not(IsBlank(gSelectedRequest.GRAssignedToID)) &&
                                  gSelectedRequest.GRAssignedToID.Id <> ddAssignReceiver_GR.Selected.ID,
                                  ProcurementNotify.Run(
                                      LookUp('Employee List', ID = gSelectedRequest.GRAssignedToID.Id).email,
                                      gSelectedRequest.GRAssignedToID.Value,
                                      gSelectedRequest.Title,
                                      gSelectedRequest.ID,
                                      "Unassigned",
                                      Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy"),
                                      "",
                                      "Max Biocare · Raw Materials Procurement",
                                      Coalesce(gSelectedRequest.DisplayID, Text(gSelectedRequest.ID))
                                  )
                              );
                              With(
                                  {wPatched: Patch('RM Procurement Requests', LookUp('RM Procurement Requests', ID = gSelectedRequest.ID), {GRAssignedToID: {Id: ddAssignReceiver_GR.Selected.ID, Value: ddAssignReceiver_GR.Selected.Title}, GRAssignedToNum: ddAssignReceiver_GR.Selected.ID})},
                                  If(
                                      IsBlank(wPatched.ID),
                                      Notify("Failed to save assignment. Please try again.", NotificationType.Error),
                                      Set(gSelectedRequest, wPatched);
                                      ProcurementNotify.Run(
                                          ddAssignReceiver_GR.Selected.email,
                                          ddAssignReceiver_GR.Selected.Title,
                                          gSelectedRequest.Title,
                                          gSelectedRequest.ID,
                                          "GoodsReceipt",
                                          Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy"),
                                          "",
                                          "Max Biocare · Raw Materials Procurement",
                                          Coalesce(gSelectedRequest.DisplayID, Text(gSelectedRequest.ID))
                                      );
                                      Notify("Assignment saved to " & ddAssignReceiver_GR.Selected.Title, NotificationType.Success)
                                  )
                              )
                          )
                        Text: ="Save Assignment"
                        Visible: =gGRDelegationMode = "Assign to someone else"
                        Width: =160
                        X: =40
                        Y: =40
                  - btnSubmit_GR:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =With(
                              {wLatest: LookUp('RM Procurement Requests', ID = gSelectedRequest.ID)},
                              If(
                                  Not(
                                  wLatest.RequesterEmail = gCurrentEmployee.Email && IsBlank(wLatest.GRAssignedToID)
                                  || Not(IsBlank(wLatest.GRAssignedToID)) && wLatest.GRAssignedToID.Id = gCurrentEmployee.ID
                              ),
                                  Notify("This assignment has been reassigned to someone else. Your submission has been cancelled.", NotificationType.Warning);
                                  Navigate(HomeScreen),
                                  If(
                                      Not(chkGR1.Checked && chkGR2.Checked && chkGR3.Checked && chkGR4.Checked && chkGR5.Checked),
                                      Notify("Please complete all checklist items", NotificationType.Error),
                                      If(
                                          IsBlank(dpReceiptDate_GR.SelectedDate) ||
                                          IsBlank(ddReceiptStatus_GR.Selected.Value) ||
                                          IsBlank(ddAcceptanceDecision_GR.Selected.Value) ||
                                          IsBlank(txtRemarks_GR.Value) ||
                                          CountRows(attGRPhotos.Attachments) = 0,
                                          Notify("Please fill in all required fields", NotificationType.Error),
                                          If(
                                          CountRows(Filter(colRoundEntry, ReceivedQty > 0)) = 0,
                                          Notify("Please enter received quantity for at least one material", NotificationType.Error),
                                          If(
                                          CountRows(Filter(colRoundEntry, ReceivedQty > 0 && IsBlank(BatchNumber))) > 0,
                                          Notify("Please enter batch number for all received materials", NotificationType.Error),
                                          If(
                                          CountRows(Filter(colRoundEntry, ReceivedQty > 0 && IsBlank(ExpiryDate))) > 0,
                                          Notify("Please enter expiry date for all received materials", NotificationType.Error),
                                          If(
                                          CountRows(Filter(colRoundEntry, ReceivedQty > 0 && IsBlank(QCNumber))) > 0,
                                          Notify("Please enter QC number for all received materials", NotificationType.Error),
                                          If(
                                          CountRows(Filter(colRoundEntry, ReceivedQty > 0 && IsBlank(COALink))) > 0,
                                          Notify("Please enter Link to COA for all received materials", NotificationType.Error),
                                          With(
                                              {
                                                  wPatched: Patch(
                                                      'RM Procurement Requests',
                                                      gSelectedRequest,
                                                      {
                                                          Status: {Value: If(
                                                              ddAcceptanceDecision_GR.Selected.Value = "Requires Supplier Follow-up",
                                                              "Supplier Follow-up",
                                                              If(!wLatest.InvoiceSubmitted, "Pending Invoice", "Pending Accounting")
                                                          )},
                                                          ReceiptRoundCount: 1,
                                                          LatestReceiptDecision: ddAcceptanceDecision_GR.Selected.Value,
                                                          GRAssignedToID: Blank(),
                                                          GRAssignedToNum: Blank()
                                                      }
                                                  )
                                              },
                                              If(
                                                  IsBlank(wPatched.ID),
                                                  Notify("Failed to submit. Please try again.", NotificationType.Error),
                                                  If(
                                                      ddAcceptanceDecision_GR.Selected.Value = "Accepted",
                                                      Patch('RM Procurement Requests', {ID: gSelectedRequest.ID}, {Fulfillment: {Value: "Fulfilled"}})
                                                  );
                                                  With(
                                                      {wLog: Patch(
                                                          'RM Procurement Execution Log',
                                                          Defaults('RM Procurement Execution Log'),
                                                          {
                                                              Title: "Step 3 - Goods Receipt Round 1 - " & gSelectedRequest.Title,
                                                              RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                              RequestIDText: Text(gSelectedRequest.ID),
                                                              StepNumber: 3,
                                                              StepName: {Value: "Goods Receipt"},
                                                              RoundNumber: 1,
                                                              ReceivedBy: gCurrentEmployee.Title,
                                                              ReceiptDate: dpReceiptDate_GR.SelectedDate,
                                                              ReceiptStatus: ddReceiptStatus_GR.Selected.Value,
                                                              AcceptanceDecision: ddAcceptanceDecision_GR.Selected.Value,
                                                              ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                              ExecutedAt: Now(),
                                                              Notes: txtRemarks_GR.Value
                                                          }
                                                      )},
                                                      If(
                                                          IsBlank(wLog.ID),
                                                          Notify("Failed to save execution log. Please try again.", NotificationType.Error),
                                                          Set(gGRPendingAttachments, attGRPhotos.Attachments);
                                                          Set(gGRLogEntry, wLog);
                                                          EditForm(frmGRLog_GR);
                                                          SubmitForm(frmGRLog_GR);
                                                          ForAll(
                                                              Filter(colRoundEntry, ReceivedQty > 0) As re,
                                                              Patch(
                                                                  'RM Procurement Receipt Rounds',
                                                                  Defaults('RM Procurement Receipt Rounds'),
                                                                  {
                                                                      Title: "R1 - " & re.MaterialName,
                                                                      RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                                      RequestIDText: Text(gSelectedRequest.ID),
                                                                      LineItemID: re.LineItemID,
                                                                      ParentRequestID: Coalesce(gSelectedRequest.ParentRequestID, 0),
                                                                      ParentLineItemID: re.ParentLineItemID,
                                                                      RoundNumber: 1,
                                                                      MaterialName: re.MaterialName,
                                                                      Unit: re.Unit,
                                                                      ReceivedQty: re.ReceivedQty,
                                                                      BatchNumber: re.BatchNumber,
                                                                      ExpiryDate: re.ExpiryDate,
                                                                      QCNumber: re.QCNumber,
                                                                      RMPKCode: re.RMPKCode,
                                                                      COALink: re.COALink,
                                                                      COAMissing: IsBlank(re.COALink)
                                                                  }
                                                              )
                                                          );
                                                          Notify(
                                                              If(
                                                                  ddAcceptanceDecision_GR.Selected.Value = "Requires Supplier Follow-up",
                                                                  "Goods receipt submitted. Receipt round 2 is now open for supplier follow-up.",
                                                                  "Goods receipt submitted. Request is now " & If(!wLatest.InvoiceSubmitted, "Pending Invoice.", "Pending Accounting.")
                                                              ),
                                                              NotificationType.Success
                                                          );
                                                          Navigate(HomeScreen)
                                                      )
                                                  )
                                              )
                                          )
                                          )
                                          )
                                          )
                                          )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Submit →"
                        Visible: =gGRDelegationMode = "I will receive"
                        Width: =160
                        X: =40
                        Y: =40
