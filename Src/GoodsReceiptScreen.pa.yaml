                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =gGRDelegationMode = "I will receive"
                  Width: =Parent.Width
                Children:
                  - chkGR2:
                      Control: CheckBox@0.0.30
                      Properties:
