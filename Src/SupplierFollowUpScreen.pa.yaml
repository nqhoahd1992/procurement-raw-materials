Screens:
  SupplierFollowUpScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSFU1LogEntry, Blank());
        Set(gSFU1PendingAttachments, Blank());
        NewForm(frmSFU1Log_SFU);
        Reset(chkSFU1);
        Reset(chkSFU2);
        Reset(chkSFU3);
        Reset(chkSFU4);
        Reset(chkSFU5);
        Reset(dpReceiptDate2_SFU);
        Reset(ddReceiptStatus2_SFU);
        Reset(ddAcceptanceDecision2_SFU);
        Reset(txtRemarks2_SFU);
        Reset(ddAssignReceiver_SFU);
        Set(gShowBulkReceipt_SFU, false);
        Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        Set(gRoundsDone, Coalesce(gSelectedRequest.ReceiptRoundCount, 0));
        Set(gLatestDecision, gSelectedRequest.LatestReceiptDecision);
        Set(gCurrentRound, gRoundsDone + 1);
        Set(gSFURoundOpen, gSelectedRequest.Status.Value = "Supplier Follow-up" && gLatestDecision = "Requires Supplier Follow-up");
        ClearCollect(colLineItemsDetail, ForAll(Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)) As li, {ID: li.ID, MaterialID: li.MaterialID, MaterialName: li.MaterialName, Unit: li.Unit, Quantity: li.Quantity, ParentLineItemID: li.ParentLineItemID, RMPKCode: Coalesce(li.MaterialCode, "?")}));
        ClearCollect(colReceiptRounds, Filter('RM Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(
            colRoundHistory,
            ForAll(
                Sort(
                    Filter('RM Procurement Execution Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber >= 3 && StepNumber <= 5),
                    ID,
                    SortOrder.Ascending
                ) As lg,
                {
                    ID: lg.ID,
                    StepNumber: lg.StepNumber,
                    StepLabel: If(lg.StepNumber = 5, "Procurement close-out", "Goods receipt"),
                    RoundNumber: lg.RoundNumber,
                    ActorName: Coalesce(lg.ReceivedBy, lg.ExecutedBy.Value),
                    ActionDate: Coalesce(lg.ReceiptDate, lg.ExecutedAt),
                    ReceiptStatus: lg.ReceiptStatus,
                    AcceptanceDecision: lg.AcceptanceDecision,
                    Notes: lg.Notes
                }
            )
        );
        ClearCollect(
            colRoundEntry,
            ForAll(
                colLineItemsDetail As li,
                {
                    LineItemID: li.ID,
                    ParentLineItemID: Coalesce(li.ParentLineItemID, 0),
                    MaterialID: li.MaterialID.Id,
                    MaterialName: li.MaterialName,
                    Unit: li.Unit,
                    OrderedQty: li.Quantity,
                    PrevReceivedQty: Coalesce(Sum(Filter(colReceiptRounds, LineItemID = li.ID), ReceivedQty), 0),
                    ReceivedQty: 0,
                    BatchNumber: "",
                    ExpiryDate: Blank(),
                    QCNumber: "",
                    RMPKCode: li.RMPKCode,
                    COALink: ""
                }
            )
        );
        Set(gSFU1DelegationMode, If(IsBlank(gSelectedRequest.SFU1AssignedToID) || gSelectedRequest.SFU1AssignedToID.Id = 0 || gSelectedRequest.SFU1AssignedToID.Id = gCurrentEmployee.ID, "I will receive", "Assign to someone else"));
        Set(gShowReceiptPhotos, false);
        Set(gShowRoundDetails, false)
    Children:
      - rectHeader_SFU:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_SFU:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Goods Receipt Round " & gCurrentRound
            Width: =600
            X: =20
      - conScrollable_SFU:
