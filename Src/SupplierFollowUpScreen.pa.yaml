                  PaddingLeft: =0
                  Size: =9
                  Text: |-
                    ="Paste one line per material, in the same order as the list above: QC Number · Batch No · Expiry Date (dd/mm/yyyy) · Received Qty · Link to COA — separated by a space or a tab. The number of lines must match the number of materials, otherwise nothing is applied. Use - for a field to leave unchanged, or a line containing only - to skip that material entirely. The COA link must contain no spaces (a real URL encodes them as %20)."
                  Width: =Parent.Width - 40
            - lblBulkReceiptOrder_SFU:
