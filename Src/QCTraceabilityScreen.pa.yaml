Screens:
  QCTraceabilityScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gQCSearched, false);
        Set(gQCFound, false);
        Clear(colQCResults);
        Reset(txtQCSearch_QC);
        ClearCollect(colQCAllRounds, FirstN(Sort('RM Procurement Receipt Rounds', ID, SortOrder.Descending), 1000));
        ClearCollect(colQCRequestsIndex, Filter('RM Procurement Requests', RequestType.Value = "Request"));
        ClearCollect(colQCStep1Index, Filter('RM Procurement Execution Log', StepNumber = 1));
        With(
            {wFlatRounds: FirstN(colQCAllRounds, 50)},
            With(
                {wAnchors: ForAll(
                    wFlatRounds As r,
                    {
                        OriginID: r.ParentRequestID,
                        IsAnchor: r.ID = Min(Filter(wFlatRounds, ParentRequestID = r.ParentRequestID), ID)
                    }
                )},
                ClearCollect(
                    colQCResults,
                    ForAll(
                        Filter(wAnchors, IsAnchor) As a,
                        {
                            OriginID: a.OriginID,
                            DisplayID: Coalesce(LookUp(colQCRequestsIndex, ID = a.OriginID).DisplayID, "Request #" & a.OriginID),
                            SupplierSummary: Coalesce(LookUp(colQCStep1Index, RequestIDText = Text(a.OriginID)).SupplierSummary, "—"),
                            QCNumbers: Concat(Filter(wFlatRounds, ParentRequestID = a.OriginID), Coalesce(QCNumber, "—"), ", ")
                        }
                    )
                )
            )
        );
        Set(gQCFound, CountRows(colQCResults) > 0);
        Set(gQCSearched, true)
    Children:
      - rectHeader_QC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_QC:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - QC Traceability"
            Width: =700
            X: =20
      - lblNotAuthorized_QC:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(163, 45, 45, 1)
            Fill: =RGBA(252, 235, 235, 1)
            Height: =Parent.Height - 60
            Size: =12
            Text: ="You do not have access to this page."
            Visible: =IsBlank(gCurrentEmployee.ID) || IsBlank(gCurrentUser.ID)
            Width: =Parent.Width
            Y: =60
      - conScrollable_QC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =60
          Children:
            - rowSearch_QC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(238, 236, 250, 1)
                  FillPortions: =0
                  Height: =120
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblSearchTitle_QC:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        Size: =12
                        Text: ="Find the SO/PO/INV by QC Number"
                        Width: =400
                  - rowSearchInput_QC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =430
                      Children:
                        - txtQCSearch_QC:
                            Control: TextInput@0.0.54
                            Properties:
                              Height: =40
                              OnChange: |-
                                =With(
                                    {wSearch: Trim(Self.Value)},
                                    With(
                                        {wFlatRounds: If(
                                            IsBlank(wSearch),
                                            FirstN(colQCAllRounds, 50),
                                            FirstN(Filter(colQCAllRounds, Not(IsBlank(Find(Lower(wSearch), Lower(QCNumber))))), 50)
                                        )},
                                        With(
                                            {wAnchors: ForAll(
                                                wFlatRounds As r,
                                                {
                                                    OriginID: r.ParentRequestID,
                                                    IsAnchor: r.ID = Min(Filter(wFlatRounds, ParentRequestID = r.ParentRequestID), ID)
                                                }
                                            )},
                                            ClearCollect(
                                                colQCResults,
                                                ForAll(
                                                    Filter(wAnchors, IsAnchor) As a,
                                                    {
                                                        OriginID: a.OriginID,
                                                        DisplayID: Coalesce(LookUp(colQCRequestsIndex, ID = a.OriginID).DisplayID, "Request #" & a.OriginID),
                                                        SupplierSummary: Coalesce(LookUp(colQCStep1Index, RequestIDText = Text(a.OriginID)).SupplierSummary, "—"),
                                                        QCNumbers: Concat(Filter(wFlatRounds, ParentRequestID = a.OriginID), Coalesce(QCNumber, "—"), ", ")
                                                    }
                                                )
                                            )
                                        )
                                    )
                                );
                                Set(gQCFound, CountRows(colQCResults) > 0);
                                Set(gQCSearched, true)
                              Placeholder: ="Enter QC Number..."
                        - btnQCSearch_QC:
                            Control: Button@0.0.45
                            Properties:
                              Height: =40
                              OnSelect: |-
                                =With(
                                    {wSearch: Trim(txtQCSearch_QC.Value)},
                                    With(
                                        {wFlatRounds: If(
                                            IsBlank(wSearch),
                                            FirstN(colQCAllRounds, 50),
                                            FirstN(Filter(colQCAllRounds, Not(IsBlank(Find(Lower(wSearch), Lower(QCNumber))))), 50)
                                        )},
                                        With(
                                            {wAnchors: ForAll(
                                                wFlatRounds As r,
                                                {
                                                    OriginID: r.ParentRequestID,
                                                    IsAnchor: r.ID = Min(Filter(wFlatRounds, ParentRequestID = r.ParentRequestID), ID)
                                                }
                                            )},
                                            ClearCollect(
                                                colQCResults,
                                                ForAll(
                                                    Filter(wAnchors, IsAnchor) As a,
                                                    {
                                                        OriginID: a.OriginID,
                                                        DisplayID: Coalesce(LookUp(colQCRequestsIndex, ID = a.OriginID).DisplayID, "Request #" & a.OriginID),
                                                        SupplierSummary: Coalesce(LookUp(colQCStep1Index, RequestIDText = Text(a.OriginID)).SupplierSummary, "—"),
                                                        QCNumbers: Concat(Filter(wFlatRounds, ParentRequestID = a.OriginID), Coalesce(QCNumber, "—"), ", ")
                                                    }
                                                )
                                            )
                                        )
                                    )
                                );
                                Set(gQCFound, CountRows(colQCResults) > 0);
                                Set(gQCSearched, true)
                              Text: ="Search"
                              Width: =100
            - rowResultsSection_QC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: |-
                    =32 +
                        If(gQCSearched && Not(gQCFound), 56, 0) +
                        If(gQCSearched && gQCFound, 32 + CountRows(colQCResults) * 32, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowNotFound_QC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(252, 235, 235, 1)
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =20
                        PaddingRight: =20
                        Visible: =gQCSearched && Not(gQCFound)
                        Width: =Parent.Width - 40
                      Children:
                        - lblNotFound_QC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(163, 45, 45, 1)
                              Height: =32
                              Size: =11
                              Text: ="No receipt round was found for this QC Number."
                              Width: =Parent.Width - 40
                  - rowQCResultHeader_QC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =gQCSearched && gQCFound
                        Width: =Parent.Width - 40
                      Children:
                        - lblQCColOrigin_QC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Origin Request"
                              Wrap: =false
                        - lblQCColSOPO_QC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="SO/PO/INV"
                              Wrap: =false
                        - lblQCColNumbers_QC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="QC Numbers"
                              Wrap: =false
                  - galQCResults_QC:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =CountRows(colQCResults) * 32
                        Items: =colQCResults
                        ShowScrollbar: =false
                        TemplateSize: =32
                        Visible: =gQCSearched && gQCFound
                        Width: =Parent.Width - 40
                      Children:
                        - rowQCResultItem_QC:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =20
                              PaddingLeft: =20
                              PaddingRight: =20
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - lblQCItemOrigin_QC:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(56, 96, 178, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    OnSelect: =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = ThisItem.OriginID)); Navigate(RequestDetailScreen)
                                    Size: =10
                                    Text: =ThisItem.DisplayID
                                    Underline: =true
                                    Wrap: =false
                              - lblQCItemSOPO_QC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =10
                                    Text: =ThisItem.SupplierSummary
                                    Wrap: =false
                              - lblQCItemNumbers_QC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Height: =24
                                    Size: =10
                                    Text: =ThisItem.QCNumbers
                                    Width: =Parent.Width
                                    Wrap: =false
      - rowFooter_QC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingLeft: =20
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_QC:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Navigate(HomeScreen)
                  Text: ="Back to Home Screen"
                  Width: =200
