App:
  Properties:
    OnStart: |-
      =Set(gAppReady, false);
      Set(gCurrentEmployee, LookUp('Employee List', Email = User().Email));
      Set(gCurrentUser, LookUp('RM User', EmployeeID.Id = gCurrentEmployee.ID));
      Set(gUserRole, gCurrentUser.Role.Value);
      Set(gShowRejectReason, false);
      Set(gParsingInvoice, false);
      Set(gHasInvoiceResult, false);
      Set(gSelectedRequest, Blank());
      Set(gIsSpecialRole,
          gCurrentUser.Role.Value = "Manager" ||
          gCurrentUser.Role.Value = "Executive" ||
          gCurrentUser.Role.Value = "Procurement" ||
          gCurrentUser.Role.Value = "Accounting" ||
          gCurrentUser.Role.Value = "Admin"
      );
      Set(gGRLogEntry, Blank());
      Set(gGRPendingAttachments, Blank());
      Set(gSFU1LogEntry, Blank());
      Set(gSFU1PendingAttachments, Blank());
      Set(gGRDelegationMode, "I will receive");
      Set(gSFU1DelegationMode, "I will receive");
      Set(gInvoiceFromPFU, false);
      Set(gPFUInvoiceMissing, false);
      Set(gSharePointAttachmentBase, "https://maxbiocare.sharepoint.com/sites/Powerapps/Lists/Raw_Material_Procurement_Requests/Attachments/");
      ClearCollect(colRawMaterials, FirstN('Raw Materials', 1));
      ClearCollect(colProjects, FirstN(Project_List, 1));
      ClearCollect(colLineItems, {RowID: 0, MaterialID: 0, MaterialName: "", Unit: "", Quantity: 1});
      Clear(colLineItems);
      ClearCollect(colLineItemsDetail, {ID: 0, MaterialName: "", Unit: "", Quantity: 0});
      Clear(colLineItemsDetail);
      ClearCollect(colRequirementFiles, {FileName: "", FileURL: ""});
      Clear(colRequirementFiles);
      ClearCollect(colQuickViewItems, {ID: 0, MaterialName: "", Unit: "", Quantity: 0});
      Clear(colQuickViewItems);
      ClearCollect(colReceiptAmend, {ID: 0, MaterialName: "", RARound: 1, RMPKCode: "", ReceivedQty: 0, NewReceivedQty: "", BatchNumber: "", NewBatchNumber: "", ExpiryDate: Today(), NewExpiryDate: Today(), QCNumber: "", NewQCNumber: "", COALink: "", NewCOALink: ""});
      Clear(colReceiptAmend);
      ClearCollect(colReceiptRounds, {ID: 0, LineItemID: 0, ParentLineItemID: 0, RoundNumber: 0, MaterialName: "", Unit: "", ReceivedQty: 0, BatchNumber: "", ExpiryDate: Today(), QCNumber: "", RMPKCode: "", COALink: "", COAMissing: false});
      Clear(colReceiptRounds);
      ClearCollect(colLineItemsSummary, {ID: 0, MaterialID: 0, MaterialName: "", Unit: "", Quantity: 0, TotalReceivedQty: 0});
      Clear(colLineItemsSummary);
      ClearCollect(colRoundEntry, {LineItemID: 0, ParentLineItemID: 0, MaterialID: 0, MaterialName: "", Unit: "", OrderedQty: 0, PrevReceivedQty: 0, ReceivedQty: 0, BatchNumber: "", ExpiryDate: Today(), QCNumber: "", RMPKCode: "", COALink: ""});
      Clear(colRoundEntry);
      ClearCollect(colRoundHistory, {ID: 0, RoundNumber: 0, StepNumber: 0, StepLabel: "", ActorName: "", ActionDate: Today(), ReceiptStatus: "", AcceptanceDecision: "", Notes: ""});
      Clear(colRoundHistory);
      ClearCollect(colRoundDetails, {LineItemID: 0, MaterialName: "", Unit: "", OrderedQty: 0, ReceivedQty: 0, BatchNumber: "", ExpiryDate: Today(), QCNumber: "", RMPKCode: "", COALink: ""});
      Clear(colRoundDetails);
      Set(gShowRoundDetails, false);
      Set(gDetailRoundLabel, "");
      Set(gShowReceiptPhotos, false);
      Set(gPhotoRoundLabel, "");
      Set(gShowQuickView, false);
      Set(gQuickViewRequest, Blank());
      Set(gShowLogDetail, false);
      Set(gLogDetailTitle, "");
      Set(gInvoiceFileURL, "");
      Set(gIsViaRequesterBatch, false);
      Set(gShowBulkCodes, false);
      ClearCollect(colBulkCodes, {Code: "", MaterialID: 0, MaterialName: "", Unit: "", Quantity: 0});
      Clear(colBulkCodes);
      ClearCollect(colLogDetail, {FieldLabel: "", FieldValue: "", FieldURL: ""});
      Clear(colLogDetail);
      ClearCollect(colReceiptPhotos, First('RM Procurement Execution Log').Attachments);
      Clear(colReceiptPhotos);
      Set(gIsDelivery, false);
      Set(gDeliveryNumber, 1);
      Set(gShowCloseRequest, false);
      ClearCollect(colDeliveryBatches, FirstN('RM Procurement Requests', 1));
      Clear(colDeliveryBatches);
      ClearCollect(colSiblingBatches, FirstN('RM Procurement Requests', 1));
      Clear(colSiblingBatches);
      ClearCollect(colParentLineItems, FirstN('RM Procurement Line Items', 1));
      Clear(colParentLineItems);
      ClearCollect(colParentReceived, FirstN('RM Procurement Receipt Rounds', 1));
      Clear(colParentReceived);
      ClearCollect(colBatchEntry, {ParentLineItemID: 0, MaterialID: 0, MaterialName: "", Unit: "", OrderedQty: 0, DeliveredQty: 0, RemainingQty: 0, BatchQty: 0});
      Clear(colBatchEntry);
      Set(gPendingDeliveryBatch, Blank());
      Set(gAppReady, true)
    Theme: =PowerAppsTheme
