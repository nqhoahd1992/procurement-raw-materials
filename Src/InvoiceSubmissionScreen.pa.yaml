Screens:
  InvoiceSubmissionScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ResetForm(formOfficialInvoice_ISS);
        Reset(txtInvDateValue_ISS);
        Reset(txtSupplierNameValue_ISS);
        Reset(txtBilledToValue_ISS);
        Reset(txtInvNumValue_ISS);
        Reset(txtABNValue_ISS);
        Reset(txtAttentionValue_ISS);
        Reset(txtDescriptionValue_ISS);
        Reset(txtTotalAmountValue_ISS);
        Reset(txtTaxAmountValue_ISS);
        Reset(txtCurrencyValue_ISS);
        Set(gHasInvoiceResult, false);
        Set(gInvoiceResult, Blank());
        Set(gParsingInvoice, false);
        Set(locInvoiceVerified, Blank());
        Set(locOfficialInvoiceURL_ISS, "");
        Set(gPendingInvName_ISS, "");
        Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        ClearCollect(
            colRequirementFiles,
            ForAll(
                Filter(Split(Coalesce(gSelectedRequest.RequirementFiles, ""), "|"), Len(Value) > 0) As f,
                {
                    FileName: f.Value,
                    FileURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(f.Value)
                }
            )
        );
        ClearCollect(colLineItemsDetail, Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)))
    Children:
      - rectHeader_ISS:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_ISS:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Invoice Submission - " & gSelectedRequest.Title
            Width: =654
            X: =20
      - lblUserInfo_ISS:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - conScrollable_ISS:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowRequestInfo_ISS:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: |-
                    =68 + 276 +
                        (92 + CountRows(colLineItemsDetail) * 48) +
                        If(gSelectedRequest.Status.Value <> "Pending Invoice", 32, 0) +
                        If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                        If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: |-
                    =68 + 276 +
                        (92 + CountRows(colLineItemsDetail) * 48) +
                        If(gSelectedRequest.Status.Value <> "Pending Invoice", 32, 0) +
                        If(CountRows(colRequirementFiles) > 0, 28 + CountRows(colRequirementFiles) * 32 + 8, 0) +
                        If(Not(IsBlank(gSelectedRequest.RemittanceURL)), 56, 0)
