                        - lblInvoiceTypeLabel_5:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =20
                              Size: =9
                              Text: ="Invoice Type"
                              Width: =200
                        - lblInvoiceTypeValue_5:
                            Control: Label@2.5.1
