Screens:
  ManagerReviewScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(txtManagerRemarks);
        Reset(rdoApproved);
        Set(gShowRateInfo, false);
        Set(gProjectInfo,
            LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID)
        );
        ClearCollect(colProjectInvoices,
            Filter(Procurement_InvoiceData,
                Not(IsBlank(gSelectedRequest.ProjectID)) &&
                ProjectID = gSelectedRequest.ProjectID
            )
        );
        ClearCollect(colLineItemsDetail, ForAll(Filter('RM Procurement Line Items', RequestIDNum = gSelectedRequest.ID) As li, {ID: li.ID, MaterialID: li.MaterialID, MaterialName: li.MaterialName, Unit: li.Unit, Quantity: li.Quantity, ParentLineItemID: li.ParentLineItemID, RMPKCode: Coalesce(li.MaterialCode, "?")}))
    Children:
      - rectHeader_1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Department Manager Review"
            Width: =719
            X: =20
      - containerScroll_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowBackTitle:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =60
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblRequestTitleValue:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =14
                        Text: =gSelectedRequest.Title
                        Width: =Parent.Width - 160
                  - lblStatusBadge_MR:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =Switch(gSelectedRequest.Status.Value,
                            "Pending Manager", RGBA(146, 84, 14, 1),
                            "Pending Executive", RGBA(175, 74, 20, 1),
                            "Pending Procurement", RGBA(122, 108, 10, 1),
                            "In Delivery", RGBA(83, 74, 183, 1),
                            "Delivered", RGBA(13, 108, 108, 1),
                            "Rejected", RGBA(163, 45, 45, 1),
                            "Goods Receipt", RGBA(37, 92, 178, 1),
                            "Supplier Follow-up", RGBA(11, 105, 132, 1),
                            "Pending Invoice", RGBA(124, 58, 173, 1),
                            "Pending Accounting", RGBA(158, 44, 108, 1),
                            "Completed", RGBA(15, 110, 86, 1),
                            "Cancelled", RGBA(148, 87, 87, 1),
                            RGBA(68, 68, 65, 1)
                          )
                        Fill: |-
                          =Switch(gSelectedRequest.Status.Value,
                            "Pending Manager", RGBA(253, 242, 216, 1),
                            "Pending Executive", RGBA(253, 234, 222, 1),
                            "Pending Procurement", RGBA(247, 245, 210, 1),
                            "In Delivery", RGBA(228, 225, 250, 1),
                            "Delivered", RGBA(219, 243, 243, 1),
                            "Rejected", RGBA(252, 233, 233, 1),
                            "Goods Receipt", RGBA(223, 234, 252, 1),
                            "Supplier Follow-up", RGBA(219, 241, 249, 1),
                            "Pending Invoice", RGBA(240, 228, 252, 1),
                            "Pending Accounting", RGBA(252, 230, 242, 1),
                            "Completed", RGBA(222, 245, 236, 1),
                            "Cancelled", RGBA(243, 235, 235, 1),
                            RGBA(241, 239, 232, 1)
                          )
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =8
                        PaddingRight: =8
                        Size: =10
                        Text: =gSelectedRequest.Status.Value
                        Width: =220
            - rowRequestInfo:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =140
                  LayoutWrap: =true
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - colCost_4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =240
                      Children:
                        - lblCostLabel_5:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =20
                              Size: =9
                              Text: ="Estimated Cost"
                              Width: =240
                        - lblCostValue_5:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: =Text(gSelectedRequest.EstimatedCost, "#,###.00")  & " " & gSelectedRequest.Currency
                              Width: =240
                  - colCostCenter_4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =240
                        X: =40
                        Y: =40
                      Children:
                        - lblCostLabel_6:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =20
                              Size: =9
                              Text: ="Cost Center"
                              Width: =240
                        - lblCostValue_6:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: =gSelectedRequest.CostCenter.Value
                              Width: =240
            - rowRequestInfo_3:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =140
                  LayoutWrap: =true
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                  X: =40
                  Y: =40
                Children:
                  - colProcType_2:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =240
                        X: =40
                        Y: =40
                      Children:
                        - lblProcTypeLabel_2:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =20
                              Size: =9
                              Text: ="Procurement Type"
                              Width: =240
                        - lblProcTypeValue_2:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: =gSelectedRequest.ProcurementType.Value
                              Width: =240
                  - colInvoiceType_5:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =60
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
