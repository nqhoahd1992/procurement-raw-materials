                              Color: =If(gSelectedRequest.InvoiceType.Value = "Official Invoice", RGBA(15, 110, 86, 1), RGBA(133, 79, 11, 1))
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: =gSelectedRequest.InvoiceType.Value
                              Width: =200
                  - colAccordance_5:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =240
                      Children:
                        - lblPurchaseAccordanceLabel_3:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =20
                              Size: =9
                              Text: ="Purchase Accordance"
                              Width: =240
                        - lblPurchaseAccordanceValue_2:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: =gSelectedRequest.PurchaseAccordance.Value
                              Width: =240
            - rowDescription_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblDescriptionLabel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =20
                        Size: =9
                        Text: ="Description"
                        Width: =Parent.Width
                  - lblDescriptionValue:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        Overflow: =Overflow.Scroll
                        Size: =11
                        Text: =gSelectedRequest.ProcurementDescription
                        Width: =Parent.Width - 40
            - rowReqLineItems_PE_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =50 + Max(1, CountRows(colLineItemsDetail)) * 30
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =68 + Max(1, CountRows(colLineItemsDetail)) * 30
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblReqLineItemsTitle_PE_1:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =24
                        Size: =9
                        Text: ="Raw Materials (" & CountRows(colLineItemsDetail) & ")"
                        Width: =Parent.Width - 40
                  - lblReqLineItemsEmpty_PE_1:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        Size: =11
                        Text: ="—"
                        Visible: =CountRows(colLineItemsDetail) = 0
                        Width: =Parent.Width - 40
                  - galReqLineItems_PE_1:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(colLineItemsDetail) * 30
                        Items: =colLineItemsDetail
                        ShowScrollbar: =false
                        TemplateSize: =30
                        Visible: =CountRows(colLineItemsDetail) > 0
                        Width: =Parent.Width - 40
                      Children:
                        - rowReqLineItem_PE_1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =30
                              LayoutDirection: =LayoutDirection.Horizontal
                              Width: =Parent.Width
                            Children:
                              - lblReqLineItemText_PE_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    Size: =11
                                    Text: =ThisItem.RMPKCode & " — " & ThisItem.MaterialName & " (" & Text(ThisItem.Quantity) & " " & ThisItem.Unit & ")"
                                    Tooltip: =ThisItem.RMPKCode & " — " & ThisItem.MaterialName & " (" & Text(ThisItem.Quantity) & " " & ThisItem.Unit & ")"
                                    Width: =Parent.Width
                                    Wrap: =false
            - rowProjectInfo_MR:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(238, 236, 250, 1)
                  Height: =116
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =116
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =Not(IsBlank(gSelectedRequest.ProjectID))
                  Width: =Parent.Width
                Children:
                  - lblProjectInfoTitle_MR:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(83, 74, 183, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        Size: =11
                        Text: ="Project Information"
                        Width: =Parent.Width - 40
                  - rowProjectFields_MR:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =60
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        LayoutMinHeight: =60
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colProjectID_MR:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =260
                            Children:
                              - lblProjectIDLabel_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =20
                                    Size: =9
                                    Text: ="Related Project"
                                    Width: =260
                              - lblProjectIDValue_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    Size: =11
                                    Text: =If(IsBlank(gSelectedRequest.ProjectID), "—", Coalesce(LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID).Title, "—"))
                                    Width: =Parent.Width
                        - colProjectBudget_MR:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =260
                            Children:
                              - lblProjectBudgetLabel_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =20
                                    Size: =9
                                    Text: ="Budget Amount"
                                    Width: =260
                              - lblProjectBudgetValue_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gProjectInfo.BudgetAmount),
                                          "—",
                                          Text(gProjectInfo.BudgetAmount, "#,###.00") & " " & gProjectInfo.Currency
                                      )
                                    Width: =260
                        - colProjectGrandTotal_MR:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =260
                            Children:
                              - lblProjectGrandTotalLabel_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =20
                                    Size: =9
                                    Text: ="Grand Total"
                                    Width: =260
                              - lblProjectGrandTotal_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(83, 74, 183, 1)
                                    FontWeight: =FontWeight.Bold
                                    Height: =30
                                    Size: =11
                                    Text: |-
                                      =Text(
                                          Sum(
                                              AddColumns(
                                                  colProjectInvoices,
                                                  AUDAmount,
                                                  TotalAmount /
                                                  Switch(
                                                      Upper(Currency),
                                                      "AUD", 1,
                                                      "USD", 0.7,
                                                      "GBP", 0.5,
                                                      "RM", 3,
                                                      "MYR", 3,
                                                      "SGD", 0.9,
                                                      "VND", 18000,
                                                      "RMB", 4.7,
                                                      "CNY", 4.7,
                                                      1
                                                  )
                                              ),
                                              AUDAmount
                                          ),
                                          "#,###.00"
                                      ) & " AUD"
                                    Width: =260
                        - colProjectDesc_MR:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =50
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblProjectDescLabel_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =20
                                    Size: =9
                                    Text: ="Project Short Description"
                                    Width: =Parent.Width
                              - lblProjectDescValue_MR:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =30
                                    Overflow: =Overflow.Scroll
                                    Size: =11
                                    Text: =Coalesce(gProjectInfo.ProjectDescription, "—")
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width
            - rowRemarks:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =140
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblRemarksLabel:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =12
                        Text: ="Manager Remarks *"
                        Width: =300
                  - txtManagerRemarks:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =80
                        Mode: ='TextInputCanvas.Mode'.Multiline
                        Width: =Parent.Width
            - rowDecision:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =110
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblDecisionLabel:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =12
                        Text: ="Manager Decision *"
                        Width: =300
                  - rdoApproved:
                      Control: Radio@0.0.25
                      Properties:
                        Height: =80
                        Items: =["Approve", "Reject"]
                        Width: =600
      - conActionBar_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.End
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
                  X: =Parent.Width - 120
                  Y: =40
            - conActionBarBtn_2:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =36
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnCancelReview:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(HomeScreen)
                        Text: ="Cancel"
                        Width: =160
                        X: =40
                        Y: =40
                  - btnSubmitReview:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =If(
                              IsBlank(txtManagerRemarks.Value),
                              Notify("Manager Remarks is required", NotificationType.Error),
                              If(
                                  IsBlank(rdoApproved.Selected.Value),
                                  Notify("Please select a decision", NotificationType.Error),
                                  With(
                                      {wLog: Patch(
                                          'RM Procurement Approval Log',
                                          Defaults('RM Procurement Approval Log'),
                                          {
                                              Title: "Step 2 - " & rdoApproved.Selected.Value & " - " & gSelectedRequest.Title,
                                              RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                              RequestIDNum: gSelectedRequest.ID,
                                              StepNumber: 2,
                                              ApproverID: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                              Decision: {Value: rdoApproved.Selected.Value},
                                              ManagerRemarks: txtManagerRemarks.Value
                                          }
                                      )},
                                      If(
                                          IsBlank(wLog.ID),
                                          Notify("Failed to save approval log. Please try again.", NotificationType.Error),
                                          With(
                                              {wReq: Patch(
                                                  'RM Procurement Requests',
                                                  gSelectedRequest,
                                                  {
                                                      Status: {Value: If(
                                                          rdoApproved.Selected.Value = "Reject",
                                                          "Rejected",
                                                          "Pending Executive"
                                                      )}
                                                  }
                                              )},
                                              If(
                                                  IsBlank(wReq.ID),
                                                  Notify("Failed to update status. Please try again.", NotificationType.Error),
                                                  Notify("Decision submitted successfully", NotificationType.Success);
                                                  Navigate(HomeScreen)
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Submit Decision →"
                        Width: =200
                        X: =40
                        Y: =40
