Screens:
  HomeScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =Set(gShowQuickView, false); Set(gInvoiceFromPFU, false); Set(gShowStatusFilter, false); Set(gParentsOnly, false); Clear(colStatusFilterChecked); Clear(colStatusFilterDraft); ClearCollect(colStatusFilterOptions_HS, ["Pending Manager", "Pending Executive", "Pending Procurement", "In Delivery", "Pending Accounting", "Pending Invoice", "Goods Receipt & Acceptance", "Pending Supplier Follow-up", "Completed", "Closed", "Cancelled", "Rejected"])
    Children:
      - lblNoRole:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(gAppReady, RGBA(163, 45, 45, 1), RGBA(136, 135, 128, 1))
            Fill: =If(gAppReady, RGBA(252, 235, 235, 1), RGBA(255, 255, 255, 1))
            Height: =Parent.Height - 60
            Size: =12
            Text: =If(gAppReady, "⚠ Your account was not found in the system. Please contact your administrator.", "Checking your account...")
            Visible: =Not(gAppReady) || IsBlank(gCurrentEmployee.ID) || IsBlank(gCurrentUser.ID)
            Width: =Parent.Width
            Y: =60
      - rectHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblAppTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement"
            Width: =400
            X: =20
      - lblUserInfo:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - rowToolbar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =80
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =10
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =60
          Children:
            - lblSectionTitle:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  FontWeight: =FontWeight.Bold
                  Size: =14
                  Text: |-
                    =Switch(gCurrentUser.Role.Value,
                        "Manager",     "My Requests",
                        "Admin",       "All Requests",
                        "Executive",   "All Requests",
                        "Procurement", "Procurement Requests",
                        "Accounting",  "Accounting Requests",
                        "My Requests"
                    )
                  Width: =400
            - chkParentsOnly_HS:
                Control: CheckBox@0.0.30
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  Label: ="Requests only"
                  OnCheck: =Set(gParentsOnly, true)
                  OnUncheck: =Set(gParentsOnly, false)
                  Width: =190
            - btnStatusFilterDropdown_HS:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  FontWeight: =""
                  Height: =36
                  Icon: ="ChevronDown"
                  OnSelect: =ClearCollect(colStatusFilterDraft, If(IsEmpty(colStatusFilterChecked), colStatusFilterOptions_HS, colStatusFilterChecked)); Set(gShowStatusFilter, true)
                  PaddingBottom: =5
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =5
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Text: ="Status" & If(IsEmpty(colStatusFilterChecked), "", " (" & CountRows(colStatusFilterChecked) & ")")
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =160
            - btnNewRequest:
                Control: ModernButton@1.0.0
                Properties:
                  Align: =Align.Center
                  FontWeight: =""
                  Height: =36
                  Icon: ="Add"
                  OnSelect: =Navigate(RequestFormScreen)
                  PaddingBottom: =5
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =5
                  RadiusBottomLeft: =4
                  RadiusBottomRight: =4
                  RadiusTopLeft: =4
                  RadiusTopRight: =4
                  Text: ="New Request"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =150
      - rectFilterBarBorder:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(210, 209, 199, 1)
            Height: =1
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =140
      - galRequests:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(210, 209, 199, 1)
            Height: =Parent.Height - 140
            Items: |-
              =SortByColumns(
                  Filter(
                      Switch(gCurrentUser.Role.Value,
                          "Manager", Filter('RM Procurement Requests',
                              (ManagerApproverNum = gCurrentEmployee.ID && RequestType.Value = "Request") ||
                              RequesterEmail = User().Email
                          ),
                          "Procurement", Filter('RM Procurement Requests',
                              Status.Value = "Pending Procurement" ||
                              Status.Value = "In Delivery" ||
                              Status.Value = "Closed" ||
                              Status.Value = "Pending Invoice" ||
                              Status.Value = "Pending Accounting" ||
                              Status.Value = "Goods Receipt & Acceptance" ||
                              Status.Value = "Pending Supplier Follow-up" ||
                              Status.Value = "Completed" ||
                              Status.Value = "Cancelled" ||
                              Status.Value = "Rejected" ||
                              RequesterEmail = User().Email
                          ),
                          "Accounting", Filter('RM Procurement Requests',
                              Status.Value = "Pending Accounting" ||
                              Status.Value = "Goods Receipt & Acceptance" ||
                              Status.Value = "Pending Supplier Follow-up" ||
                              Status.Value = "Completed" ||
                              RequesterEmail = User().Email
                          ),
                          "Executive", 'RM Procurement Requests',
                          "Admin", 'RM Procurement Requests',
                          Filter('RM Procurement Requests',
                              RequesterEmail = User().Email ||
                              GRAssignedToNum = gCurrentEmployee.ID ||
                              SFU1AssignedToNum = gCurrentEmployee.ID
                          )
                      ),
                      (IsEmpty(colStatusFilterChecked) || Status.Value in colStatusFilterChecked) &&
                      (Not(gParentsOnly) || RequestType.Value = "Request")
                  ),
                  "GroupKey", SortOrder.Descending,
                  "DeliveryNumber", SortOrder.Ascending
              )
            OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(RequestDetailScreen)
            TemplateSize: =100
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =140
          Children:
            - rectRowHitArea:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =82
                  HoverFill: =RGBA(245, 245, 250, 1)
                  OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(RequestDetailScreen)
                  Width: =Parent.Width
            - rectDeliveryAccent:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(83, 74, 183, 1)
                  Height: =82
                  Visible: =ThisItem.RequestType.Value = "Delivery"
                  Width: =3
                  X: =28
                  Y: =12
            - rowRequestContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =100
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =3
                  PaddingBottom: =6
                  PaddingLeft: =If(ThisItem.RequestType.Value = "Delivery", 48, 16)
                  PaddingRight: =16
                  PaddingTop: =6
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowTop:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =28
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lblRequestTitle:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Text: |-
                                =If(
                                  ThisItem.RequestType.Value = "Delivery",
                                  "↳ Delivery #" & ThisItem.DeliveryNumber & "  ·  ID: " & ThisItem.ID & "  ·  of Request #" & ThisItem.ParentRequestID,
                                  ThisItem.Title
                                )
                              Width: =Parent.Width - 300
                              Wrap: =false
                        - lblRequestStatus:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: |-
                                =Switch(ThisItem.Status.Value,
                                  "Pending Manager", RGBA(146, 84, 14, 1),
                                  "Pending Executive", RGBA(175, 74, 20, 1),
                                  "Pending Procurement", RGBA(122, 108, 10, 1),
                                  "In Delivery", RGBA(83, 74, 183, 1),
                                  "Closed", RGBA(13, 108, 108, 1),
                                  "Rejected", RGBA(163, 45, 45, 1),
                                  "Goods Receipt & Acceptance", RGBA(37, 92, 178, 1),
                                  "Pending Supplier Follow-up", RGBA(11, 105, 132, 1),
                                  "Pending Invoice", RGBA(124, 58, 173, 1),
                                  "Pending Accounting", RGBA(158, 44, 108, 1),
                                  "Completed", RGBA(15, 110, 86, 1),
                                  "Cancelled", RGBA(148, 87, 87, 1),
                                  RGBA(68, 68, 65, 1)
                                )
                              Fill: |-
                                =Switch(ThisItem.Status.Value,
                                  "Pending Manager", RGBA(253, 242, 216, 1),
                                  "Pending Executive", RGBA(253, 234, 222, 1),
                                  "Pending Procurement", RGBA(247, 245, 210, 1),
                                  "In Delivery", RGBA(228, 225, 250, 1),
                                  "Closed", RGBA(219, 243, 243, 1),
                                  "Rejected", RGBA(252, 233, 233, 1),
                                  "Goods Receipt & Acceptance", RGBA(223, 234, 252, 1),
                                  "Pending Supplier Follow-up", RGBA(219, 241, 249, 1),
                                  "Pending Invoice", RGBA(240, 228, 252, 1),
                                  "Pending Accounting", RGBA(252, 230, 242, 1),
                                  "Completed", RGBA(222, 245, 236, 1),
                                  "Cancelled", RGBA(243, 235, 235, 1),
                                  RGBA(241, 239, 232, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =11
                              Text: |-
                                =If(
                                  ThisItem.Status.Value = "Pending Supplier Follow-up",
                                  If(
                                    ThisItem.LatestReceiptDecision = "Accepted with Adjustment",
                                    If(ThisItem.InvoiceSubmitted, "Procurement Close-out (Credit Note)", "Submit Invoice"),
                                    "Goods Receipt (Round " & (Coalesce(ThisItem.ReceiptRoundCount, 0) + 1) & ")"
                                  ),
                                  If(
                                    ThisItem.Status.Value = "Pending Executive" && ThisItem.isExecutivePayment,
                                    "Pending Payment From Executive",
                                    ThisItem.Status.Value
                                  )
                                )
                              Width: =260
                  - rowMeta:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =22
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lblRequestMeta:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =22
                              Size: =11
                              Text: |-
                                =If(IsBlank(ThisItem.ProjectID), "", "Project: " & Coalesce(LookUp(Project_List, ProjectID = ThisItem.ProjectID).Title, "—")) & If(ThisItem.RequestType.Value = "Delivery", " | Expected Delivery Date: ", " | Required Date: ") & Text(ThisItem.RequiredDeliveryDate, "dd/mm/yyyy") & If(ThisItem.RequestType.Value = "Delivery" || IsBlank(ThisItem.EstimatedCost) || ThisItem.EstimatedCost = 0, "", " | Estimated Cost: " & Text(ThisItem.EstimatedCost, "#,###.00") & " " & ThisItem.Currency)
                              Width: =Parent.Width - 440
                        - lblRequesterName:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =22
                              Size: =11
                              Text: |-
                                =If(
                                  ThisItem.RequestType.Value = "Delivery",
                                  If(
                                    ThisItem.Status.Value = "Goods Receipt & Acceptance" && Not(IsBlank(ThisItem.GRAssignedToID)),
                                    "Receiver: " & ThisItem.GRAssignedToID.Value,
                                    If(
                                      ThisItem.Status.Value = "Pending Supplier Follow-up" && Not(IsBlank(ThisItem.SFU1AssignedToID)) && ThisItem.LatestReceiptDecision = "Requires Supplier Follow-up",
                                      "Receiver: " & ThisItem.SFU1AssignedToID.Value,
                                      ""
                                    )
                                  ),
                                  "Requester: " & ThisItem.RequesterID.Value &
                                  If(
                                    ThisItem.Status.Value = "Goods Receipt & Acceptance" && Not(IsBlank(ThisItem.GRAssignedToID)),
                                    " | Receiver: " & ThisItem.GRAssignedToID.Value,
                                    If(
                                      ThisItem.Status.Value = "Pending Supplier Follow-up" && Not(IsBlank(ThisItem.SFU1AssignedToID)) && ThisItem.LatestReceiptDecision = "Requires Supplier Follow-up",
                                      " | Receiver: " & ThisItem.SFU1AssignedToID.Value,
                                      ""
                                    )
                                  )
                                )
                              Width: =420
                  - rowActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - btnQuickView:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(83, 74, 183, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Icon: ="Info"
                              OnSelect: |-
                                =Set(gQuickViewRequest, ThisItem);
                                ClearCollect(
                                    colQuickViewItems,
                                    Filter('RM Procurement Line Items', RequestIDText = Text(ThisItem.ID))
                                );
                                Set(gShowQuickView, true)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Quick View"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =140
                        - btnFullDetail:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Icon: ="Eye"
                              OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(RequestDetailScreen)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Full Detail"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =130
                        - btnDoWork:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(83, 74, 183, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              OnSelect: |-
                                =Set(gSelectedRequest, ThisItem);
                                Switch(
                                    ThisItem.Status.Value,
                                    "Pending Manager", Navigate(ManagerReviewScreen),
                                    "Pending Executive", If(
                                        ThisItem.isExecutivePayment,
                                        Navigate(ExecutivePaymentScreen),
                                        Navigate(ExecutiveApprovalScreen)
                                    ),
                                    "Pending Procurement", Navigate(ProcurementExecutionScreen),
                                    "Pending Invoice", Navigate(InvoiceSubmissionScreen),
                                    "Goods Receipt & Acceptance", Navigate(GoodsReceiptScreen),
                                    "Pending Supplier Follow-up", If(
                                        ThisItem.LatestReceiptDecision = "Accepted with Adjustment",
                                        Navigate(ProcurementFollowUpScreen),
                                        Navigate(SupplierFollowUpScreen)
                                    ),
                                    "Pending Accounting", Navigate(AccountingScreen)
                                )
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: |-
                                =Switch(
                                    ThisItem.Status.Value,
                                    "Pending Manager", "Review Request →",
                                    "Pending Executive", If(
                                        ThisItem.isExecutivePayment,
                                        "Process Payment →",
                                        "Review Request →"
                                    ),
                                    "Pending Procurement", "Start Procurement →",
                                    "Pending Invoice", "Submit Invoice →",
                                    "Goods Receipt & Acceptance", "Goods Receipt & Acceptance →",
                                    "Pending Supplier Follow-up", If(
                                        ThisItem.LatestReceiptDecision = "Accepted with Adjustment",
                                        "Upload Credit Note →",
                                        "Goods Receipt — Round " & (Coalesce(ThisItem.ReceiptRoundCount, 0) + 1) & " →"
                                    ),
                                    "Pending Accounting", "Start Accounting →",
                                    ""
                                )
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: |-
                                =Switch(
                                    ThisItem.Status.Value,
                                    "Pending Manager",
                                        gCurrentUser.Role.Value = "Admin" ||
                                        (gCurrentUser.Role.Value = "Manager" && ThisItem.ManagerApproverID.Id = gCurrentEmployee.ID),
                                    "Pending Executive",
                                        gCurrentUser.Role.Value = "Executive" || gCurrentUser.Role.Value = "Admin",
                                    "Pending Procurement",
                                        gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin",
                                    "Pending Invoice",
                                        (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin") &&
                                        Not(ThisItem.InvoiceMode.Value = "ViaRequester" || ThisItem.InvoiceMode.Value = "Deferred"),
                                    "Goods Receipt & Acceptance",
                                        ThisItem.RequesterEmail = gCurrentEmployee.Email ||
                                        ThisItem.GRAssignedToID.Id = gCurrentEmployee.ID,
                                    "Pending Supplier Follow-up", If(
                                        ThisItem.LatestReceiptDecision = "Accepted with Adjustment",
                                        ThisItem.InvoiceSubmitted && (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"),
                                        ThisItem.LatestReceiptDecision = "Requires Supplier Follow-up" &&
                                        (ThisItem.RequesterEmail = gCurrentEmployee.Email ||
                                        ThisItem.SFU1AssignedToID.Id = gCurrentEmployee.ID)
                                    ),
                                    "Pending Accounting",
                                        gCurrentUser.Role.Value = "Accounting" ||
                                        gCurrentUser.Role.Value = "Executive" ||
                                        gCurrentUser.Role.Value = "Admin",
                                    false
                                )
                              Width: =260
                        - btnAddDelivery:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(83, 74, 183, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(DeliveryBatchFormScreen)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="+ Add Delivery"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: |-
                                =ThisItem.RequestType.Value = "Request" &&
                                ThisItem.Status.Value = "In Delivery" &&
                                (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin") &&
                                Not(
                                    ThisItem.ProcurementType.Value = "Invoice Supplied" &&
                                    ThisItem.InvoiceType.Value = "Official Invoice" &&
                                    Coalesce(ThisItem.DeliveryCount, 0) >= 1
                                )
                              Width: =160
                        - btnProcessInvoice:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: |-
                                =If(
                                  ThisItem.InvoiceMode.Value = "Deferred" || ThisItem.InvoiceMode.Value = "Direct",
                                  RGBA(83, 74, 183, 1),
                                  If(IsBlank(ThisItem.RequesterInvoiceURL), RGBA(133, 79, 11, 1), RGBA(83, 74, 183, 1))
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(InvoiceSubmissionScreen)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: |-
                                =If(
                                  ThisItem.InvoiceMode.Value = "Deferred" || ThisItem.InvoiceMode.Value = "Direct",
                                  "Submit Invoice",
                                  If(IsBlank(ThisItem.RequesterInvoiceURL), "Remind Requester", "Process Invoice")
                                )
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: |-
                                =(ThisItem.InvoiceMode.Value = "ViaRequester" || ThisItem.InvoiceMode.Value = "Deferred" ||
                                ThisItem.InvoiceMode.Value = "Direct") &&
                                !ThisItem.InvoiceSubmitted &&
                                ThisItem.Status.Value <> "Cancelled" &&
                                (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin")
                              Width: =160
                        - btnSubmitInvoice:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(133, 79, 11, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(RequesterInvoiceScreen)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Submit Invoice"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: |-
                                =ThisItem.InvoiceMode.Value = "ViaRequester" && !ThisItem.InvoiceSubmitted &&
                                ThisItem.Status.Value <> "Cancelled" &&
                                (
                                  gCurrentUser.Role.Value <> "Procurement" && gCurrentUser.Role.Value <> "Admin" ||
                                  ThisItem.RequesterEmail = gCurrentEmployee.Email
                                )
                              Width: =160
                        - btnReceiptAmend_Request:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(83, 74, 183, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              OnSelect: =Set(gSelectedRequest, ThisItem); Navigate(ReceiptAmendmentScreen)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Amend Receipt Data"
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: |-
                                =(gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin") &&
                                ThisItem.Status.Value <> "Rejected" &&
                                ThisItem.Status.Value <> "Cancelled" &&
                                Not(IsEmpty(Filter('RM Procurement Receipt Rounds',
                                    RequestIDText = Text(ThisItem.ID)
                                )))
                              Width: =180
            - rectSeparator:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =1
                  Width: =Parent.Width
                  Y: =99
