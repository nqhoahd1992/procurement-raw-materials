                Children:
                  - btnQVDoWork_HS:
                      Control: ModernButton@1.0.0
                      Properties:
                        Align: =Align.Center
                        BasePaletteColor: =RGBA(83, 74, 183, 1)
                        FontWeight: =FontWeight.Semibold
                        OnSelect: |-
                          =Set(gShowQuickView, false);
                          Set(gSelectedRequest, gQuickViewRequest);
                          Switch(
                              gQuickViewRequest.Status.Value,
                              "Pending Manager", Navigate(ManagerReviewScreen),
                              "Pending Executive", If(
                                  gQuickViewRequest.isExecutivePayment,
                                  Navigate(ExecutivePaymentScreen),
                                  Navigate(ExecutiveApprovalScreen)
                              ),
                              "Pending Procurement", Navigate(ProcurementExecutionScreen),
                              "Pending Invoice", Navigate(InvoiceSubmissionScreen),
                              "Goods Receipt & Acceptance", Navigate(GoodsReceiptScreen),
                              "Pending Supplier Follow-up", If(
                                  gQuickViewRequest.LatestReceiptDecision = "Accepted with Adjustment",
                                  Navigate(ProcurementFollowUpScreen),
                                  Navigate(SupplierFollowUpScreen)
                              ),
                              "Pending Accounting", Navigate(AccountingScreen),
                              "In Delivery", Navigate(DeliveryBatchFormScreen)
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: |-
                          =Switch(
                              gQuickViewRequest.Status.Value,
                              "Pending Manager", "Review Request →",
                              "Pending Executive", If(
                                  gQuickViewRequest.isExecutivePayment,
                                  "Process Payment →",
                                  "Review Request →"
                              ),
                              "Pending Procurement", "Start Procurement →",
                              "Pending Invoice", "Submit Invoice →",
                              "Goods Receipt & Acceptance", "Goods Receipt & Acceptance →",
                              "Pending Supplier Follow-up", If(
                                  gQuickViewRequest.LatestReceiptDecision = "Accepted with Adjustment",
                                  "Upload Credit Note →",
                                  "Goods Receipt — Round " & (Coalesce(gQuickViewRequest.ReceiptRoundCount, 0) + 1) & " →"
                              ),
                              "Pending Accounting", "Start Accounting →",
                              "In Delivery", "+ Add Delivery",
                              ""
                          )
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: |-
                          =Switch(
                              gQuickViewRequest.Status.Value,
                              "Pending Manager",
                                  gCurrentUser.Role.Value = "Admin" ||
                                  (gCurrentUser.Role.Value = "Manager" && gQuickViewRequest.ManagerApproverID.Id = gCurrentEmployee.ID),
                              "Pending Executive",
                                  gCurrentUser.Role.Value = "Executive" || gCurrentUser.Role.Value = "Admin",
                              "Pending Procurement",
                                  gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin",
                              "Pending Invoice",
                                  gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin",
                              "Goods Receipt & Acceptance",
                                  gQuickViewRequest.RequesterEmail = gCurrentEmployee.Email ||
                                  gQuickViewRequest.GRAssignedToID.Id = gCurrentEmployee.ID,
                              "Pending Supplier Follow-up", If(
                                  gQuickViewRequest.LatestReceiptDecision = "Accepted with Adjustment",
                                  gQuickViewRequest.InvoiceSubmitted && (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"),
                                  gQuickViewRequest.LatestReceiptDecision = "Requires Supplier Follow-up" &&
                                  (gQuickViewRequest.RequesterEmail = gCurrentEmployee.Email ||
                                  gQuickViewRequest.SFU1AssignedToID.Id = gCurrentEmployee.ID)
                              ),
                              "Pending Accounting",
                                  gCurrentUser.Role.Value = "Accounting" ||
                                  gCurrentUser.Role.Value = "Executive" ||
                                  gCurrentUser.Role.Value = "Admin",
                              "In Delivery",
                                  gQuickViewRequest.RequestType.Value = "Request" &&
                                  (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin") &&
                                  Not(
                                      gQuickViewRequest.ProcurementType.Value = "Invoice Supplied" &&
                                      gQuickViewRequest.InvoiceType.Value = "Official Invoice" &&
                                      Coalesce(gQuickViewRequest.DeliveryCount, 0) >= 1
                                  ),
                              false
                          )
                        Width: =260
