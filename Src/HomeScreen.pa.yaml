                              Width: =22
                        - lblStatusFilterOptionText_HS:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              Height: =28
                              OnSelect: |-
                                =If(
                                    CountRows(Filter(colStatusFilterDraft, Value = ThisItem.Value)) > 0,
                                    RemoveIf(colStatusFilterDraft, Value = ThisItem.Value),
                                    Collect(colStatusFilterDraft, {Value: ThisItem.Value})
                                )
