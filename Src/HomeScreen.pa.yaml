Screens:
  HomeScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: =Set(gStatusFilter, Blank()); Set(gShowQuickView, false); Set(gInvoiceFromPFU, false)
    Children:
      - lblNoRole:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =If(gAppReady, RGBA(163, 45, 45, 1), RGBA(136, 135, 128, 1))
            Fill: =If(gAppReady, RGBA(252, 235, 235, 1), RGBA(255, 255, 255, 1))
            Height: =Parent.Height - 60
            Size: =12
            Text: =If(gAppReady, "⚠ Your account was not found in the system. Please contact your administrator.", "Checking your account...")
            Visible: =Not(gAppReady) || IsBlank(gCurrentEmployee.ID) || IsBlank(gCurrentUser.ID)
            Width: =Parent.Width
            Y: =60
      - rectHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblAppTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement"
            Width: =400
            X: =20
      - lblUserInfo:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - rowToolbar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =80
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =10
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =60
          Children:
            - lblSectionTitle:
                Control: Label@2.5.1
                Properties:
                  FillPortions: =1
                  FontWeight: =FontWeight.Bold
                  Size: =14
                  Text: |-
                    =Switch(gCurrentUser.Role.Value,
                        "Manager",     "My Requests",
                        "Admin",       "All Requests",
                        "Executive",   "All Requests",
                        "Procurement", "Procurement Requests",
                        "Accounting",  "Accounting Requests",
                        "My Requests"
                    )
                  Width: =400
            - btnNewRequest:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  Icon: ="Add"
                  OnSelect: =Navigate(RequestFormScreen)
                  Text: ="New Request"
                  Width: =150
      - rowFilterBar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutOverflowX: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =140
          Children:
            - lblFilterAll:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(IsBlank(gStatusFilter), RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(IsBlank(gStatusFilter), RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(IsBlank(gStatusFilter), FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, Blank())
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="All"
                  Width: =50
            - divFilter1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterPendingManager:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Pending Manager", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Pending Manager", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Pending Manager", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Pending Manager")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Pending Manager"
                  Width: =140
            - divFilter2:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterPendingExec:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Pending Executive", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Pending Executive", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Pending Executive", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Pending Executive")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Pending Executive"
            - divFilter3:
