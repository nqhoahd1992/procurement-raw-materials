                  Height: =16
                  Width: =1
            - lblFilterPendingAccounting:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Pending Accounting", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Pending Accounting", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Pending Accounting", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Pending Accounting")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Pending Accounting"
                  Width: =160
            - divFilter5:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterPendingInvoice:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Pending Invoice", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Pending Invoice", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Pending Invoice", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Pending Invoice")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Pending Invoice"
                  Width: =130
            - divFilter6:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterGoodsReceipt:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Goods Receipt & Acceptance", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Goods Receipt & Acceptance", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Goods Receipt & Acceptance", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Goods Receipt & Acceptance")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Goods Receipt"
                  Width: =120
            - divFilter7:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterSFU:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Pending Supplier Follow-up", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Pending Supplier Follow-up", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Pending Supplier Follow-up", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Pending Supplier Follow-up")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Supplier Follow-up"
            - divFilter8:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterCompleted:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Completed", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Completed", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Completed", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Completed")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Completed"
                  Width: =120
            - divFilter8b:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterClosed:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Closed", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Closed", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Closed", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Closed")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Closed"
                  Width: =100
            - divFilter8c:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterCancelled:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Cancelled", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Cancelled", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Cancelled", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Cancelled")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Cancelled"
                  Width: =110
            - divFilter9:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(210, 209, 199, 1)
                  Height: =16
                  Width: =1
            - lblFilterRejected:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =If(gStatusFilter = "Rejected", RGBA(83, 74, 183, 1), RGBA(136, 135, 128, 1))
                  Fill: =If(gStatusFilter = "Rejected", RGBA(237, 235, 254, 1), RGBA(0, 0, 0, 0))
                  FontWeight: =If(gStatusFilter = "Rejected", FontWeight.Bold, FontWeight.Semibold)
                  Height: =24
                  HoverColor: =RGBA(83, 74, 183, 1)
                  OnSelect: =Set(gStatusFilter, "Rejected")
                  PaddingLeft: =8
                  PaddingRight: =8
                  Size: =11
                  Text: ="Rejected"
                  Width: =120
      - rectFilterBarBorder:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(210, 209, 199, 1)
            Height: =1
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =188
      - galRequests:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(210, 209, 199, 1)
            Height: =Parent.Height - 188
            Items: |-
              =SortByColumns(
                  Filter(
                      Switch(gCurrentUser.Role.Value,
                          "Manager", Filter('RM Procurement Requests',
                              (ManagerApproverID.Id = gCurrentEmployee.ID && RequestType.Value = "Request") ||
                              RequesterEmail = User().Email
                          ),
                          "Procurement", Filter('RM Procurement Requests',
                              Status.Value = "Pending Procurement" ||
                              Status.Value = "In Delivery" ||
                              Status.Value = "Closed" ||
                              Status.Value = "Pending Invoice" ||
                              Status.Value = "Pending Accounting" ||
                              Status.Value = "Goods Receipt & Acceptance" ||
                              Status.Value = "Pending Supplier Follow-up" ||
                              Status.Value = "Completed" ||
                              Status.Value = "Cancelled" ||
                              Status.Value = "Rejected" ||
                              RequesterEmail = User().Email
                          ),
                          "Accounting", Filter('RM Procurement Requests',
                              Status.Value = "Pending Accounting" ||
                              Status.Value = "Goods Receipt & Acceptance" ||
                              Status.Value = "Pending Supplier Follow-up" ||
                              Status.Value = "Completed" ||
                              RequesterEmail = User().Email
                          ),
                          "Executive", 'RM Procurement Requests',
                          "Admin", 'RM Procurement Requests',
                          Filter('RM Procurement Requests',
                              RequesterEmail = User().Email ||
                              GRAssignedToID.Id = gCurrentEmployee.ID ||
                              SFU1AssignedToID.Id = gCurrentEmployee.ID
                          )
                      ),
                      IsBlank(gStatusFilter) || Status.Value = gStatusFilter
                  ),
                  "GroupKey", SortOrder.Descending,
                  "DeliveryNumber", SortOrder.Ascending
              )
            OnSelect: =Set(gSelectedRequest, ThisItem); If(ThisItem.Status.Value = "Pending Invoice" && (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"), Navigate(InvoiceSubmissionScreen), Navigate(RequestDetailScreen))
            TemplateSize: =114
            Visible: =Not(IsBlank(gCurrentEmployee.ID)) && Not(IsBlank(gCurrentUser.ID))
            Width: =Parent.Width
            Y: =188
          Children:
            - rectRowHitArea:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0)
                  Height: =82
                  HoverFill: =RGBA(245, 245, 250, 1)
                  OnSelect: =Set(gSelectedRequest, ThisItem); If(ThisItem.Status.Value = "Pending Invoice" && (gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"), Navigate(InvoiceSubmissionScreen), Navigate(RequestDetailScreen))
                  Width: =Parent.Width
            - rectDeliveryAccent:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(83, 74, 183, 1)
                  Height: =82
                  Visible: =ThisItem.RequestType.Value = "Delivery"
                  Width: =3
                  X: =28
                  Y: =12
            - rowRequestContent:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =114
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =10
                  PaddingLeft: =If(ThisItem.RequestType.Value = "Delivery", 48, 16)
                  PaddingRight: =16
                  PaddingTop: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowTop:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =28
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lblRequestTitle:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Text: |-
                                =If(
                                  ThisItem.RequestType.Value = "Delivery",
                                  "↳ Delivery #" & ThisItem.DeliveryNumber & "  ·  ID: " & ThisItem.ID & "  ·  of Request #" & ThisItem.ParentRequestID,
                                  "ID: " & ThisItem.ID & " - " & ThisItem.Title
                                )
                              Width: =Parent.Width - 300
                              Wrap: =false
                        - lblRequestStatus:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: |-
                                =Switch(ThisItem.Status.Value,
                                  "Completed", RGBA(15, 110, 86, 1),
                                  "Closed", RGBA(15, 110, 86, 1),
                                  "Rejected", RGBA(163, 45, 45, 1),
                                  "Cancelled", RGBA(163, 45, 45, 1),
                                  "Goods Receipt & Acceptance", RGBA(83, 74, 183, 1),
                                  "In Delivery", RGBA(83, 74, 183, 1),
                                  "Pending Manager", RGBA(133, 79, 11, 1),
                                  "Pending Executive", RGBA(133, 79, 11, 1),
                                  "Pending Procurement", RGBA(133, 79, 11, 1),
                                  "Pending Accounting", RGBA(133, 79, 11, 1),
                                  "Pending Invoice", RGBA(133, 79, 11, 1),
                                  RGBA(68, 68, 65, 1)
                                )
                              Fill: |-
                                =Switch(ThisItem.Status.Value,
                                  "Completed", RGBA(225, 245, 238, 1),
                                  "Closed", RGBA(225, 245, 238, 1),
                                  "Rejected", RGBA(252, 235, 235, 1),
                                  "Cancelled", RGBA(245, 240, 240, 1),
                                  "Goods Receipt & Acceptance", RGBA(225, 220, 252, 1),
                                  "In Delivery", RGBA(225, 220, 252, 1),
                                  "Pending Manager", RGBA(250, 238, 218, 1),
                                  "Pending Executive", RGBA(250, 238, 218, 1),
                                  "Pending Procurement", RGBA(250, 238, 218, 1),
                                  "Pending Accounting", RGBA(250, 238, 218, 1),
                                  "Pending Invoice", RGBA(250, 238, 218, 1),
                                  RGBA(241, 239, 232, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              Size: =11
                              Text: |-
                                =If(
                                  ThisItem.Status.Value = "Pending Supplier Follow-up",
                                  If(
                                    ThisItem.LatestReceiptDecision = "Accepted with Adjustment",
                                    "Procurement Close-out (Credit Note)",
                                    "Goods Receipt (Round " & (Coalesce(ThisItem.ReceiptRoundCount, 0) + 1) & ")"
                                  ),
                                  If(
                                    ThisItem.Status.Value = "Pending Executive" && ThisItem.isExecutivePayment,
                                    "Pending Payment From Executive",
                                    ThisItem.Status.Value
                                  )
                                )
                              Width: =260
                  - rowMeta:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =22
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lblRequestMeta:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =22
                              Size: =11
                              Text: |-
                                ="Delivery Date: " & Text(ThisItem.RequiredDeliveryDate, "dd/mm/yyyy") & If(IsBlank(ThisItem.EstimatedCost) || ThisItem.EstimatedCost = 0, "", " | Estimated Cost: " & Text(ThisItem.EstimatedCost, "#,###")) & " " & ThisItem.Currency & If(IsBlank(ThisItem.ProjectID), "", " | ProjectID: " & ThisItem.ProjectID)
                              Width: =Parent.Width - 440
                        - lblRequesterName:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =22
                              Size: =11
                              Text: |-
                                ="Requester: " & ThisItem.RequesterID.Value &
                                If(
                                  ThisItem.Status.Value = "Goods Receipt & Acceptance" && Not(IsBlank(ThisItem.GRAssignedToID)),
                                  " | Receiver: " & ThisItem.GRAssignedToID.Value,
                                  If(
                                    ThisItem.Status.Value = "Pending Supplier Follow-up" && Not(IsBlank(ThisItem.SFU1AssignedToID)) && ThisItem.LatestReceiptDecision = "Requires Supplier Follow-up",
                                    " | Receiver: " & ThisItem.SFU1AssignedToID.Value,
                                    ""
                                  )
                                )
                              Width: =420
                  - rowActions:
