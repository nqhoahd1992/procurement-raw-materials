Screens:
  ExecutivePaymentScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ResetForm(formExecutivePayment);
        Set(gPendingNewAttName, "");
        Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        ClearCollect(colLineItemsDetail, ForAll(Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)) As li, {ID: li.ID, MaterialID: li.MaterialID, MaterialName: li.MaterialName, Unit: li.Unit, Quantity: li.Quantity, ParentLineItemID: li.ParentLineItemID, RMPKCode: Coalesce(li.MaterialCode, "?")}))
    Children:
      - rectHeader_EPS:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_EPS:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Executive Payment"
            Width: =654
            X: =20
      - lblUserInfo_EPS:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - conScrollable_EPS:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowInfoBlock_EPS:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 250, 1)
                  FillPortions: =0
                  Height: =300
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =320
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - rowInfoLine1_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =34
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =24
                        PaddingRight: =1
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblInfoTitle_EPS:
                            Control: Label@2.5.1
                            Properties:
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Height: =24
                              PaddingLeft: =0
                              PaddingRight: =0
                              Size: =14
                              Text: =gSelectedRequest.Title
                              Width: =600
                        - lblStatusBadge_EPS:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: |-
                                =Switch(gSelectedRequest.Status.Value,
                                  "Pending Manager", RGBA(146, 84, 14, 1),
                                  "Pending Executive", RGBA(175, 74, 20, 1),
                                  "Pending Procurement", RGBA(122, 108, 10, 1),
                                  "In Delivery", RGBA(83, 74, 183, 1),
                                  "Closed", RGBA(13, 108, 108, 1),
                                  "Rejected", RGBA(163, 45, 45, 1),
                                  "Goods Receipt & Acceptance", RGBA(37, 92, 178, 1),
                                  "Pending Supplier Follow-up", RGBA(11, 105, 132, 1),
                                  "Pending Invoice", RGBA(124, 58, 173, 1),
                                  "Pending Accounting", RGBA(158, 44, 108, 1),
                                  "Completed", RGBA(15, 110, 86, 1),
                                  "Cancelled", RGBA(148, 87, 87, 1),
                                  RGBA(68, 68, 65, 1)
                                )
                              Fill: |-
                                =Switch(gSelectedRequest.Status.Value,
                                  "Pending Manager", RGBA(253, 242, 216, 1),
                                  "Pending Executive", RGBA(253, 234, 222, 1),
                                  "Pending Procurement", RGBA(247, 245, 210, 1),
                                  "In Delivery", RGBA(228, 225, 250, 1),
                                  "Closed", RGBA(219, 243, 243, 1),
                                  "Rejected", RGBA(252, 233, 233, 1),
                                  "Goods Receipt & Acceptance", RGBA(223, 234, 252, 1),
                                  "Pending Supplier Follow-up", RGBA(219, 241, 249, 1),
                                  "Pending Invoice", RGBA(240, 228, 252, 1),
                                  "Pending Accounting", RGBA(252, 230, 242, 1),
                                  "Completed", RGBA(222, 245, 236, 1),
                                  "Cancelled", RGBA(243, 235, 235, 1),
                                  RGBA(241, 239, 232, 1)
                                )
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =10
                              Text: ="Pending Payment From Executive"
                              Width: =260
                  - rowInfoLine4_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colProcurementType_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =300
                            Children:
                              - lblInfoProcTypeLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Procurement Type"
                                    Width: =300
                              - lblInfoProcTypeValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =gSelectedRequest.ProcurementType.Value &
                                          If(
                                              IsBlank(gSelectedRequest.InvoiceType.Value),
                                              "",
                                              " · " & gSelectedRequest.InvoiceType.Value
                                          )
                                    Width: =300
                                    Wrap: =false
                        - colInvoiceDoc_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =gSelectedRequest.ProcurementType.Value = "Invoice Supplied"
                              Width: =300
                            Children:
                              - lblInfoInvoiceLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Invoice (Requester)"
                                    Width: =300
                              - lblInfoInvoiceValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(IsBlank(gSelectedRequest.RequesterInvoiceURL), RGBA(136, 135, 128, 1), RGBA(56, 96, 178, 1))
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), Launch(gSelectedRequest.RequesterInvoiceURL, {}, LaunchTarget.New))
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =If(IsBlank(gSelectedRequest.RequesterInvoiceURL), "Not uploaded", "Open invoice ↗")
                                    Tooltip: =gSelectedRequest.RequesterInvoiceURL
                                    Underline: =Not(IsBlank(gSelectedRequest.RequesterInvoiceURL))
                                    Width: =300
                                    Wrap: =false
                        - colOfficialInvoiceDoc_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =Not(IsBlank(gSelectedRequest.OfficialInvoiceLink))
                              Width: =300
                            Children:
                              - lblInfoOfficialInvoiceLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Official Invoice (Procurement)"
                                    Width: =300
                              - lblInfoOfficialInvoiceValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(56, 96, 178, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    OnSelect: =If(Not(IsBlank(gSelectedRequest.OfficialInvoiceLink)), Launch(gSelectedRequest.OfficialInvoiceLink, {}, LaunchTarget.New))
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Open official invoice ↗"
                                    Tooltip: =gSelectedRequest.OfficialInvoiceLink
                                    Underline: =true
                                    Width: =300
                                    Wrap: =false
                  - rowInfoIdent_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colIdentProject_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =260
                            Children:
                              - lblIdentProjectLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Related Project"
                                    Width: =Parent.Width
                              - lblIdentProjectValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gSelectedRequest.ProjectID),
                                          "—",
                                          Coalesce(LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID).Title, "—")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colIdentReqDate_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =170
                            Children:
                              - lblIdentReqDateLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Required Delivery Date"
                                    Width: =Parent.Width
                              - lblIdentReqDateValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gSelectedRequest.RequiredDeliveryDate),
                                          "—",
                                          Text(gSelectedRequest.RequiredDeliveryDate, "dd/mm/yyyy")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colIdentRequester_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =200
                            Children:
                              - lblIdentRequesterLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Requested by"
                                    Width: =Parent.Width
                              - lblIdentRequesterValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =Coalesce(gSelectedRequest.RequesterID.Value, gSelectedRequest.RequesterEmail, "—")
                                    Width: =Parent.Width
                                    Wrap: =false
                  - rowInfoLine3_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =80
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colConditions_EPS:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =60
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =600
                            Children:
                              - lblInfoConditionsLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Executive Remark"
                                    Width: =Parent.Width
                              - lblInfoConditionsValue_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =60
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: |-
                                      =With(
                                          {wRemark: LookUp('RM Procurement Approval Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 3).ApprovalConditions},
                                          If(IsBlank(wRemark), "—", wRemark)
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width
                  - rowInfoMaterials_EPS:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =40
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblInfoMaterialsLabel_EPS:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Raw Materials (" & CountRows(colLineItemsDetail) & ")"
                              Width: =Parent.Width
                        - lblInfoMaterialsValue_EPS:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: |-
                                =If(
                                    CountRows(colLineItemsDetail) = 0,
                                    "—",
                                    Concat(
                                        colLineItemsDetail,
                                        RMPKCode & " — " & MaterialName & " (" & Text(Quantity) & " " & Unit & ")",
                                        "  ·  "
                                    )
                                )
                              Tooltip: |-
                                =Concat(
                                    colLineItemsDetail,
                                    RMPKCode & " — " & MaterialName & " (" & Text(Quantity) & " " & Unit & ")",
                                    Char(10)
                                )
                              Width: =Parent.Width
                              Wrap: =false
            - rowUploadSection_EPS:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblUploadHeader_EPS:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Upload Remittance Advice Document *"
                        Width: =Parent.Width - 40
                  - lblUploadHint_EPS:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Size: =10
                        Text: ="Upload proof that this request has been paid (remittance advice / payment confirmation). Once submitted, this request will move to Pending Procurement."
                        Width: =Parent.Width - 40
                  - formExecutivePayment:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='RM Procurement Requests'
                        Height: =120
                        Item: =gSelectedRequest
                        LayoutMinWidth: =100
                        NumberOfColumns: =1
                        OnFailure: =Notify("Upload failed. Please try again.", NotificationType.Error)
                        OnSuccess: |-
                          =With(
                              {wURL: gSharePointAttachmentBase & Text(gSelectedRequest.ID) & "/" & EncodeUrl(gPendingNewAttName)},
                              With(
                                  {wReq: Patch(
                                      'RM Procurement Requests',
                                      LookUp('RM Procurement Requests', ID = gSelectedRequest.ID),
                                      {
                                          Status: {Value: "Pending Procurement"},
                                          RemittanceURL: wURL
                                      }
                                  )},
                                  If(
                                      IsBlank(wReq.ID),
                                      Notify("Failed to save. Please try again.", NotificationType.Error),
                                      Notify("Remittance submitted. Request sent to Procurement.", NotificationType.Success);
                                      ProcurementNotify.Run(
                                          "procurement@maxbiocare.com",
                                          "Procurement Team",
                                          wReq.Title,
                                          wReq.ID,
                                          "RMProcurementExecution",
                                          Text(wReq.RequiredDeliveryDate, "dd/mm/yyyy"),
                                          "",
                                          "Max Biocare · Raw Materials Procurement",
                                          Coalesce(wReq.DisplayID, Text(wReq.ID))
                                      );
                                      Navigate(HomeScreen)
                                  )
                              )
                          )
                        Width: =Parent.Width - 40
                      Children:
                        - dcExecutivePayment:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicAttachmentsEdit
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =Blank()
                              DisplayMode: =DisplayMode.Edit
                              DisplayName: =""
                              Height: =100
                              Required: =false
                              Update: =attExecutivePayment.Attachments
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblAttachLabel_EPS:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Remittance Advice Document *"
                                    Width: =Parent.Width
                              - attExecutivePayment:
                                  Control: Attachments@2.3.0
                                  Properties:
                                    Height: =100
                                    Items: =Parent.Default
                                    MaxAttachments: =100
                                    Width: =Parent.Width
      - conActionBar_EPS:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_EPS:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
            - btnSubmit_EPS:
                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =RGBA(5, 102, 178, 1)
                  Height: =36
                  OnSelect: |-
                    =If(
                        CountRows(attExecutivePayment.Attachments) = 0,
                        Notify("Please attach the remittance advice document before submitting.", NotificationType.Error),
                        Set(gPendingNewAttName, Last(attExecutivePayment.Attachments).Name);
                        SubmitForm(formExecutivePayment)
                    )
                  Text: ="Submit Payment →"
                  Width: =200
