Screens:
  DeliveryBatchFormScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        Set(gDeliveryNumber, Coalesce(gSelectedRequest.DeliveryCount, 0) + 1);
        Reset(dpBatchDeliveryDate);
        Reset(rdoBatchInvoiceMode);
        Reset(txtBatchNotes);
        NewForm(formDirectInvoice_DBF);
        Set(gHasInvoiceResult, false);
        Set(gInvoiceResult, Blank());
        Set(gParsingInvoice, false);
        Set(gPendingDeliveryBatch, Blank());
        Set(gPendingNewAttName, "");
        ClearCollect(colParentLineItems, Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(colParentReceived, Filter('RM Procurement Receipt Rounds', ParentRequestID = gSelectedRequest.ID));
        ClearCollect(colSiblingBatches, Filter('RM Procurement Requests', ParentRequestID = gSelectedRequest.ID));
        ClearCollect(
            colBatchEntry,
            ForAll(
                colParentLineItems As li,
                With(
                    {wDelivered: Sum(Filter(colParentReceived, ParentLineItemID = li.ID), ReceivedQty)},
                    {
                        ParentLineItemID: li.ID,
                        MaterialID: li.MaterialID.Id,
                        MaterialName: li.MaterialName,
                        Unit: li.Unit,
                        OrderedQty: li.Quantity,
                        DeliveredQty: wDelivered,
                        RemainingQty: li.Quantity - wDelivered,
                        BatchQty: Max(li.Quantity - wDelivered, 0)
                    }
                )
            )
        )
    Children:
      - rectHeader_DBF:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblUserInfo_DBF:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - lblScreenTitle_DBF:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: |-
              ="New Delivery #" & gDeliveryNumber & " - Request ID: " & gSelectedRequest.ID & " - " & gSelectedRequest.Title
            Width: =900
            X: =20
      - conScrollable_DBF:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowParentInfo_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =128
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =128
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblParentInfoTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =11
                        Text: ="Parent Request"
                        Width: =Parent.Width - 40
                  - rowParentInfoFields_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colParentRequester_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentRequesterLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Requester"
                                    Width: =Parent.Width
                              - lblParentRequesterVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: =gSelectedRequest.RequesterID.Value
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colParentProject_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentProjectLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Related Project"
                                    Width: =Parent.Width
                              - lblParentProjectVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gSelectedRequest.ProjectID),
                                          "—",
                                          Coalesce(LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID).Title, "—")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colParentDeliveries_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentDeliveriesLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Deliveries Created So Far"
                                    Width: =Parent.Width
                              - lblParentDeliveriesVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: =Text(CountRows(colSiblingBatches))
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colParentCurrency_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentCurrencyLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Request Estimate (all deliveries)"
                                    Width: =Parent.Width
                              - lblParentCurrencyVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: =Text(gSelectedRequest.EstimatedCost, "#,###.00") & " " & gSelectedRequest.Currency
                                    Width: =Parent.Width
                                    Wrap: =false
            - rowLineItems_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =148 + CountRows(colBatchEntry) * 56
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =148 + CountRows(colBatchEntry) * 56
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblLineItemsTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Size: =12
                        Text: ="Raw Materials In This Delivery *"
                        Width: =Parent.Width - 40
                  - lblLineItemsHint_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =36
                        Size: =10
                        Text: ="Enter the quantity expected in THIS delivery for each material. Leave a quantity at 0 to leave that material out — it stays outstanding on the request and can go in a later delivery. Defaults to whatever is still outstanding."
                        Width: =Parent.Width - 40
                  - rowColHeader_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblColName_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Trade Name"
                              Width: =Parent.Width * 0.3
                        - lblColUnit_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Unit"
                              Width: =Parent.Width * 0.07
                        - lblColOrdered_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Ordered"
                              Width: =Parent.Width * 0.1
                        - lblColDelivered_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Received So Far"
                              Width: =Parent.Width * 0.12
                        - lblColRemaining_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Remaining"
                              Width: =Parent.Width * 0.1
                        - lblColBatchQty_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Qty This Delivery *"
                              Width: =Parent.Width * 0.14
                  - galBatchEntry_DBF:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =CountRows(colBatchEntry) * 56 + 12
                        Items: =colBatchEntry
                        ShowScrollbar: =false
                        TemplateSize: =56
                        Width: =Parent.Width - 40
                      Children:
                        - rowBatchItem_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =55
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - colItemName_DBF:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =55
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width * 0.3
                                  Children:
                                    - lblItemName_DBF:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =20
                                          Size: =11
                                          Text: =ThisItem.MaterialName
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lblItemSubtitle_DBF:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(136, 135, 128, 1)
                                          Height: =16
                                          Size: =8
                                          Text: |-
                                            =With({wMat: LookUp('Raw Materials', ID = ThisItem.MaterialID)}, If(IsBlank(wMat), "", wMat.Code & " · " & wMat.Category & " · " & wMat.Supplier))
                                          Width: =Parent.Width
                                          Wrap: =false
                              - lblItemUnit_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Size: =11
                                    Text: =ThisItem.Unit
                                    Width: =Parent.Width * 0.07
                                    Wrap: =false
                              - lblItemOrdered_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Size: =11
                                    Text: =Text(ThisItem.OrderedQty)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - lblItemDelivered_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(136, 135, 128, 1)
                                    Size: =11
                                    Text: =Text(ThisItem.DeliveredQty)
                                    Width: =Parent.Width * 0.12
                                    Wrap: =false
                              - lblItemRemaining_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.RemainingQty <= 0, RGBA(15, 110, 86, 1), RGBA(133, 79, 11, 1))
                                    FontWeight: =FontWeight.Semibold
                                    Size: =11
                                    Text: =Text(ThisItem.RemainingQty)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - txtBatchQty_DBF:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    Align: =Align.Center
                                    Height: =40
                                    OnChange: |-
                                      =UpdateIf(colBatchEntry, ParentLineItemID = ThisItem.ParentLineItemID, {BatchQty: Value(Self.Value)})
                                    Placeholder: ="0"
                                    Value: =If(IsBlank(ThisItem.BatchQty) || ThisItem.BatchQty = 0, "", Text(ThisItem.BatchQty))
                                    Width: =Parent.Width * 0.14
            - rowDeliveryDate_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =90
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutMinHeight: =110
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - colDeliveryDate_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =70
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblDeliveryDateLbl_DBF:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: ="Expected Delivery Date *"
                              Width: =Parent.Width
                        - dpBatchDeliveryDate:
                            Control: ModernDatePicker@1.0.1
                            Properties:
                              DefaultDate: =gSelectedRequest.RequiredDeliveryDate
                              Format: ="dd/mm/yyyy"
                              Height: =40
                              Placeholder: ="Choose a date"
                              Width: =Parent.Width
                  - colInvoiceMode_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =70
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblInvoiceModeLbl_DBF:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: ="Invoice Handling For This Delivery *"
                              Width: =Parent.Width
                        - rdoBatchInvoiceMode:
                            Control: Radio@0.0.25
                            Properties:
                              Height: =40
                              Items: |-
                                =If(
                                    Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)) && IsEmpty(Filter(colSiblingBatches, InvoiceMode.Value = "ViaRequester")),
                                    ["Direct", "Deferred", "ViaRequester"],
                                    ["Direct", "Deferred"]
                                )
                              Layout: ='RadioGroupCanvas.Layout'.Horizontal
                              Width: =Parent.Width
            - rowDirectInvoice_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =230
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =160
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =rdoBatchInvoiceMode.Selected.Value = "Direct"
                  Width: =Parent.Width
                Children:
                  - lblDirectInvoiceTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="Official Invoice *"
                        Width: =Parent.Width - 40
                  - formDirectInvoice_DBF:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='RM Procurement Requests'
                        Height: =100
                        Item: =gPendingDeliveryBatch
                        NumberOfColumns: =1
                        OnFailure: |-
                          =Patch('RM Procurement Requests', {ID: gPendingDeliveryBatch.ID}, {InvoiceMode: {Value: "Deferred"}});
                          Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                          Notify("Delivery #" & gDeliveryNumber & " created, but the invoice file failed to upload. Complete its invoice from Invoice Submission once it reaches Pending Invoice.", NotificationType.Warning);
                          Navigate(RequestDetailScreen)
                        OnSuccess: |-
                          =With(
                              {wURL: gSharePointAttachmentBase & Text(gPendingDeliveryBatch.ID) & "/" & EncodeUrl(gPendingNewAttName)},
                              Set(gParsingInvoice, true);
                              Set(gHasInvoiceResult, false);
                              Set(gInvoiceResult, IfError(Parse_Invoice.Run(wURL, gPendingDeliveryBatch.ID), Blank()));
                              Set(gHasInvoiceResult, true);
                              Set(gParsingInvoice, false);
                              If(
                                  IsBlank(gInvoiceResult.invoiceNumber) ||
                                  IsBlank(gInvoiceResult.invoiceDate) ||
                                  IsBlank(gInvoiceResult.supplierName) ||
                                  IsBlank(gInvoiceResult.billedTo) ||
                                  IsBlank(gInvoiceResult.totalAmount) ||
                                  IsBlank(gInvoiceResult.currency),
                                  Patch('RM Procurement Requests', {ID: gPendingDeliveryBatch.ID}, {InvoiceMode: {Value: "Deferred"}});
                                  Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                                  Notify("Delivery #" & gDeliveryNumber & " created and invoice attached, but some details could not be extracted automatically. Complete its invoice from Invoice Submission once it reaches Pending Invoice.", NotificationType.Warning);
                                  Navigate(RequestDetailScreen),
                                  With(
                                      {
                                          wDescription: "Delivery #" & gPendingDeliveryBatch.DeliveryNumber & " of " & gSelectedRequest.Title,
                                          wNameRaw: Substitute(gInvoiceResult.invoiceDate, "-", "") &
                                              " - " & gInvoiceResult.supplierName &
                                              " - " & gInvoiceResult.billedTo &
                                              " - " & gInvoiceResult.invoiceNumber
                                      },
                                      With(
                                          {wNameClean: Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(wNameRaw, "\", ""), "/", ""), ":", ""), "*", ""), "?", ""), """", ""), "<", ""), ">", ""), "#", ""), "%", "")},
                                          Patch('RM Procurement Requests', {ID: gPendingDeliveryBatch.ID}, {InvoiceSubmitted: true, OfficialInvoiceLink: wURL});
                                          Patch(
                                              'RM Procurement Execution Log',
                                              Defaults('RM Procurement Execution Log'),
                                              {
                                                  Title: "Step 6 - Invoice Submission - " & gPendingDeliveryBatch.Title,
                                                  RequestID: {Id: gPendingDeliveryBatch.ID, Value: gPendingDeliveryBatch.Title},
                                                  RequestIDText: Text(gPendingDeliveryBatch.ID),
                                                  StepNumber: 6,
                                                  StepName: {Value: "Invoice Submission"},
                                                  ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                  ExecutedAt: Now()
                                              }
                                          );
                                          Set(gSubmitInvoiceResult,
                                              Submit_Invoice.Run(
                                                  wURL,
                                                  gPendingDeliveryBatch.ID,
                                                  wNameClean,
                                                  gInvoiceResult.invoiceDate,
                                                  gInvoiceResult.supplierName,
                                                  gInvoiceResult.billedTo,
                                                  gInvoiceResult.invoiceNumber,
                                                  gInvoiceResult.totalAmount,
                                                  Coalesce(gInvoiceResult.taxAmount, 0),
                                                  gInvoiceResult.currency,
                                                  gInvoiceResult.jobId,
                                                  gInvoiceResult.confidenceScore,
                                                  gInvoiceResult.attention,
                                                  wDescription,
                                                  gPendingDeliveryBatch.InvoiceRegion.Value,
                                                  gInvoiceResult.supplierABN,
                                                  "Raw Materials Procurement App"
                                              )
                                          );
                                          Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                                          If(
                                              IsError(gSubmitInvoiceResult),
                                              Notify("Delivery #" & gDeliveryNumber & " created and invoice attached, but automatic filing failed. Please contact IT with reference: " & gPendingDeliveryBatch.Title, NotificationType.Warning),
                                              Notify("Delivery #" & gDeliveryNumber & " created and invoice submitted automatically.", NotificationType.Success)
                                          );
                                          Navigate(RequestDetailScreen)
                                      )
                                  )
                              )
                          )
                        Width: =Parent.Width - 40
                      Children:
                        - dcDirectInvoice_DBF:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicAttachmentsEdit
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =Blank()
                              DisplayMode: =DisplayMode.Edit
                              DisplayName: =""
                              Height: =100
                              Required: =false
                              Update: =attDirectInvoice_DBF.Attachments
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblDirectInvoiceFileLabel_DC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Invoice File *"
                                    Width: =Parent.Width
                              - attDirectInvoice_DBF:
                                  Control: Attachments@2.3.0
                                  Properties:
                                    Height: =100
                                    Items: =Parent.Default
                                    MaxAttachments: =1
                                    Width: =Parent.Width
                  - lblDirectInvoiceStatus_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(83, 74, 183, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =10
                        Text: ="⏳ Attaching, extracting and filing the invoice — please wait..."
                        Visible: =gParsingInvoice
                        Width: =Parent.Width - 40
            - rowBatchNotes_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =130
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblBatchNotesLbl_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="Notes (optional)"
                        Width: =Parent.Width - 40
                  - txtBatchNotes:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =64
                        Mode: =TextMode.MultiLine
                        Placeholder: ="Anything the receiver or Accounting should know about this delivery"
                        Width: =Parent.Width - 40
      - conActionBar_DBF:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_DBF:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Navigate(RequestDetailScreen)
                  Text: ="← Back"
                  Width: =100
            - conActionBarBtn_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =400
                Children:
                  - lblBatchSummary_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =36
                        Size: =10
                        Text: =CountRows(Filter(colBatchEntry, BatchQty > 0)) & " of " & CountRows(colBatchEntry) & " materials selected"
                        Width: =220
                        Wrap: =false
                  - btnCreateBatch_DBF:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =If(
                              IsEmpty(Filter(colBatchEntry, BatchQty > 0)),
                              Notify("Please enter a quantity for at least one material in this delivery", NotificationType.Error),
                              If(
                                  Not(IsEmpty(Filter(colBatchEntry, BatchQty > RemainingQty))),
                                  Notify("A quantity exceeds what is still outstanding on the request. Reduce it, or set it to 0 to leave that material out.", NotificationType.Error),
                                  If(
                                      IsBlank(dpBatchDeliveryDate.SelectedDate),
                                      Notify("Please pick the expected delivery date", NotificationType.Error),
                                      If(
                                          IsBlank(rdoBatchInvoiceMode.Selected.Value),
                                          Notify("Please choose how the invoice for this delivery is handled", NotificationType.Error),
                                          If(
                                              rdoBatchInvoiceMode.Selected.Value = "Direct" && CountRows(attDirectInvoice_DBF.Attachments) = 0,
                                              Notify("Please attach the invoice file — Direct mode submits it as part of creating this delivery", NotificationType.Error),
                                                  With(
                                                      {wLatest: LookUp('RM Procurement Requests', ID = gSelectedRequest.ID)},
                                                      If(
                                                          wLatest.Status.Value <> "In Delivery",
                                                          Notify("This request is no longer open for new deliveries. Your entry has been cancelled.", NotificationType.Warning);
                                                          Navigate(HomeScreen),
                                                          If(
                                                              Coalesce(wLatest.DeliveryCount, 0) + 1 <> gDeliveryNumber,
                                                              Notify("Another delivery has just been created for this request. Please reopen this screen and try again.", NotificationType.Warning);
                                                              Navigate(RequestDetailScreen),
                                                              With(
                                                                  {wBatch: Patch(
                                                                      'RM Procurement Requests',
                                                                      Defaults('RM Procurement Requests'),
                                                                      {
                                                                          Title: gSelectedRequest.Title & " - #" & gDeliveryNumber,
                                                                          RequestType: {Value: "Delivery"},
                                                                          ParentRequestID: gSelectedRequest.ID,
                                                                          GroupKey: gSelectedRequest.ID,
                                                                          DeliveryNumber: gDeliveryNumber,
                                                                          DeliveryCount: 0,
                                                                          Status: {Value: "Goods Receipt & Acceptance"},
                                                                          RequesterID: {Id: gSelectedRequest.RequesterID.Id, Value: gSelectedRequest.RequesterID.Value},
                                                                          RequesterEmail: gSelectedRequest.RequesterEmail,
                                                                          ManagerApproverID: {Id: gSelectedRequest.ManagerApproverID.Id, Value: gSelectedRequest.ManagerApproverID.Value},
                                                                          ProjectID: gSelectedRequest.ProjectID,
                                                                          ProcurementType: {Value: gSelectedRequest.ProcurementType.Value},
                                                                          InvoiceType: If(IsBlank(gSelectedRequest.InvoiceType.Value), Blank(), {Value: gSelectedRequest.InvoiceType.Value}),
                                                                          ProcurementDescription: "Delivery batch #" & gDeliveryNumber & " of request #" & gSelectedRequest.ID & If(IsBlank(txtBatchNotes.Value), "", Char(10) & txtBatchNotes.Value),
                                                                          PurchaseAccordance: {Value: gSelectedRequest.PurchaseAccordance.Value},
                                                                          EstimatedCost: 0,
                                                                          Currency: gSelectedRequest.Currency,
                                                                          RequiredDeliveryDate: dpBatchDeliveryDate.SelectedDate,
                                                                          DeliveryLocation: {Value: "Port Melbourne Warehouse"},
                                                                          CostCenter: {Value: "Port Melbourne Warehouse"},
                                                                          InvoiceRegion: {Value: gSelectedRequest.InvoiceRegion.Value},
                                                                          InvoiceMode: {Value: rdoBatchInvoiceMode.Selected.Value},
                                                                          InvoiceSubmitted: false,
                                                                          RequesterInvoiceURL: If(rdoBatchInvoiceMode.Selected.Value = "ViaRequester", gSelectedRequest.RequesterInvoiceURL, ""),
                                                                          ReceiptRoundCount: 0,
                                                                          SkippedManagerReview: false,
                                                                          ProcurementExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                                          ProcurementExecutedAt: Now()
                                                                      }
                                                                  )},
                                                                  If(
                                                                      IsBlank(wBatch.ID),
                                                                      Notify("Failed to create the delivery. Please try again.", NotificationType.Error),
                                                                      ForAll(
                                                                          Filter(colBatchEntry, BatchQty > 0) As be,
                                                                          Patch(
                                                                              'RM Procurement Line Items',
                                                                              Defaults('RM Procurement Line Items'),
                                                                              {
                                                                                  RequestID: {Id: wBatch.ID, Value: wBatch.Title},
                                                                                  RequestIDText: Text(wBatch.ID),
                                                                                  ParentLineItemID: be.ParentLineItemID,
                                                                                  MaterialID: {Id: be.MaterialID, Value: be.MaterialName},
                                                                                  MaterialName: be.MaterialName,
                                                                                  Unit: be.Unit,
                                                                                  Quantity: be.BatchQty
                                                                              }
                                                                          )
                                                                      );
                                                                      Patch('RM Procurement Requests', {ID: gSelectedRequest.ID}, {DeliveryCount: gDeliveryNumber});
                                                                      Patch(
                                                                          'RM Procurement Execution Log',
                                                                          Defaults('RM Procurement Execution Log'),
                                                                          {
                                                                              Title: "Step 7 - Delivery Batch #" & gDeliveryNumber & " Created - " & gSelectedRequest.Title,
                                                                              RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                                              RequestIDText: Text(gSelectedRequest.ID),
                                                                              StepNumber: 7,
                                                                              StepName: {Value: "Delivery Batch Created"},
                                                                              RoundNumber: gDeliveryNumber,
                                                                              ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                                              ExecutedAt: Now(),
                                                                              Notes: txtBatchNotes.Value
                                                                          }
                                                                      );
                                                                      If(
                                                                          rdoBatchInvoiceMode.Selected.Value = "Direct",
                                                                          Set(gPendingDeliveryBatch, wBatch);
                                                                          Set(gPendingNewAttName, Last(attDirectInvoice_DBF.Attachments).Name);
                                                                          EditForm(formDirectInvoice_DBF);
                                                                          SubmitForm(formDirectInvoice_DBF),
                                                                          Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                                                                          Notify("Delivery #" & gDeliveryNumber & " created with " & CountRows(Filter(colBatchEntry, BatchQty > 0)) & " material(s).", NotificationType.Success);
                                                                          Navigate(RequestDetailScreen)
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  )
                              )
                        Text: ="Create Delivery →"
                        Width: =180
