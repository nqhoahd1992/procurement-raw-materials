                                                                              ManagerApproverNum: If(IsBlank(gSelectedRequest.ManagerApproverID), Blank(), gSelectedRequest.ManagerApproverID.Id),
                                                                              ProjectID: gSelectedRequest.ProjectID,
                                                                              ProcurementType: {Value: gSelectedRequest.ProcurementType.Value},
                                                                              InvoiceType: If(IsBlank(gSelectedRequest.InvoiceType.Value), Blank(), {Value: gSelectedRequest.InvoiceType.Value}),
                                                                              ProcurementDescription: "Delivery batch #" & gDeliveryNumber & " of request #" & gSelectedRequest.ID & If(IsBlank(txtBatchNotes.Value), "", Char(10) & txtBatchNotes.Value),
                                                                              PurchaseAccordance: Blank(),
                                                                              EstimatedCost: Blank(),
                                                                              Currency: gSelectedRequest.Currency,
                                                                              RequiredDeliveryDate: dpBatchDeliveryDate.SelectedDate,
                                                                              DeliveryLocation: Blank(),
                                                                              CostCenter: Blank(),
                                                                              InvoiceRegion: {Value: gSelectedRequest.InvoiceRegion.Value},
                                                                              InvoiceMode: {Value: If(gIsViaRequesterBatch, "ViaRequester", rdoBatchInvoiceMode.Selected.Value)},
                                                                              InvoiceSubmitted: false,
                                                                              RequesterInvoiceURL: If(gIsViaRequesterBatch, gSelectedRequest.RequesterInvoiceURL, ""),
                                                                              ReceiptRoundCount: 0,
                                                                              ProcurementExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                                              ProcurementExecutedAt: Now()
                                                                          }
                                                                      )},
                                                                      If(
                                                                          IsBlank(wBatch.ID),
                                                                          Notify("Failed to create the delivery. Please try again.", NotificationType.Error),
                                                                          ForAll(
                                                                              Filter(colBatchEntry, BatchQty > 0) As be,
                                                                              Patch(
                                                                                  'RM Procurement Line Items',
                                                                                  Defaults('RM Procurement Line Items'),
                                                                                  {
                                                                                      RequestID: {Id: wBatch.ID, Value: wBatch.Title},
                                                                                      RequestIDText: Text(wBatch.ID),
                                                                                      ParentLineItemID: be.ParentLineItemID,
                                                                                      MaterialID: {Id: be.MaterialID, Value: be.MaterialName},
                                                                                      MaterialName: be.MaterialName,
                                                                                      Unit: be.Unit,
                                                                                      Quantity: be.BatchQty
                                                                                  }
                                                                              )
                                                                          );
                                                                          Patch('RM Procurement Requests', {ID: gSelectedRequest.ID}, {DeliveryCount: gDeliveryNumber});
                                                                          Patch(
                                                                              'RM Procurement Execution Log',
                                                                              Defaults('RM Procurement Execution Log'),
                                                                              {
                                                                                  Title: "Step 7 - Delivery Batch #" & gDeliveryNumber & " Created - " & gSelectedRequest.Title,
                                                                                  RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                                                  RequestIDText: Text(gSelectedRequest.ID),
                                                                                  StepNumber: 7,
                                                                                  StepName: {Value: "Delivery Batch Created"},
                                                                                  RoundNumber: gDeliveryNumber,
                                                                                  ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                                                  ExecutedAt: Now(),
                                                                                  Notes: txtBatchNotes.Value
                                                                              }
                                                                          );
                                                                          Switch(
                                                                              If(gIsViaRequesterBatch, "ViaRequester", rdoBatchInvoiceMode.Selected.Value),
                                                                              "Direct",
                                                                                  Set(gPendingDeliveryBatch, wBatch);
                                                                                  Set(gPendingNewAttName, Last(attDirectInvoice_DBF.Attachments).Name);
                                                                                  Set(gPendingDirectAttachments, attDirectInvoice_DBF.Attachments);
                                                                                  Set(gInvoiceFileURL, gSharePointAttachmentBase & Text(wBatch.ID) & "/" & EncodeUrl(Last(attDirectInvoice_DBF.Attachments).Name));
                                                                                  EditForm(formDirectInvoice_DBF);
                                                                                  SubmitForm(formDirectInvoice_DBF),
                                                                              "ViaRequester",
                                                                                  If(
                                                                                      rdoViaReqInvoiceOK_DBF.Selected.Value = "Yes",
                                                                                      Set(gPendingDeliveryBatch, wBatch);
                                                                                      Set(gPendingNewAttName, "");
                                                                                      Set(gPendingDirectAttachments, Blank());
                                                                                      Set(gInvoiceFileURL, gSelectedRequest.RequesterInvoiceURL);
                                                                                      EditForm(formDirectInvoice_DBF);
                                                                                      SubmitForm(formDirectInvoice_DBF),
                                                                                      Patch('RM Procurement Requests', {ID: wBatch.ID}, {RequesterInvoiceURL: ""});
                                                                                      Procurement_Notify_Remind_Invoice.Run(
                                                                                          wBatch.RequesterEmail,
                                                                                          wBatch.RequesterID.Value,
                                                                                          wBatch.Title,
                                                                                          Text(wBatch.ID),
                                                                                          gCurrentEmployee.Title
