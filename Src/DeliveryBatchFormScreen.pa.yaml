                        Size: =9
                        Text: |-
                          =If(gHasInvoiceResult,
                              With(
                                  {
                                      wName: If(IsBlank(txtFldInvDate_DBF.Value), "", Substitute(txtFldInvDate_DBF.Value, "-", "")) &
                                          If(IsBlank(txtFldSupplierName_DBF.Value), "", " - " & txtFldSupplierName_DBF.Value) &
                                          If(IsBlank(txtFldBilledTo_DBF.Value), "", " - " & txtFldBilledTo_DBF.Value) &
                                          If(IsBlank(txtFldInvNumber_DBF.Value), "", " - " & txtFldInvNumber_DBF.Value) &
                                          If(IsBlank(txtFldAttention_DBF.Value), "", " - " & txtFldAttention_DBF.Value) &
