Screens:
  DeliveryBatchFormScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        Set(gDeliveryNumber, Coalesce(gSelectedRequest.DeliveryCount, 0) + 1);
        Reset(dpBatchDeliveryDate);
        Set(gIsViaRequesterBatch,
            gSelectedRequest.ProcurementType.Value = "Invoice Supplied" &&
            gSelectedRequest.InvoiceType.Value = "Official Invoice" &&
            Not(IsBlank(gSelectedRequest.RequesterInvoiceURL))
        );
        Reset(rdoBatchInvoiceMode);
        Reset(rdoViaReqInvoiceOK_DBF);
        Reset(txtBatchNotes);
        Set(gInvoiceFileURL, "");
        NewForm(formDirectInvoice_DBF);
        Set(gHasInvoiceResult, false);
        Set(gInvoiceResult, Blank());
        Set(gParsingInvoice, false);
        Set(gPendingDeliveryBatch, Blank());
        Set(gPendingNewAttName, "");
        Set(gPendingDirectAttachments, Blank());
        ClearCollect(colParentLineItems, Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(colParentReceived, Filter('RM Procurement Receipt Rounds', ParentRequestID = gSelectedRequest.ID));
        ClearCollect(colSiblingBatches, Filter('RM Procurement Requests', ParentRequestID = gSelectedRequest.ID));
        ClearCollect(
            colBatchEntry,
            ForAll(
                colParentLineItems As li,
                With(
                    {wDelivered: Coalesce(Sum(Filter(colParentReceived, ParentLineItemID = li.ID), ReceivedQty), 0)},
                    {
                        ParentLineItemID: li.ID,
                        MaterialID: li.MaterialID.Id,
                        MaterialName: li.MaterialName,
                        Unit: li.Unit,
                        OrderedQty: li.Quantity,
                        DeliveredQty: wDelivered,
                        RemainingQty: li.Quantity - wDelivered,
                        BatchQty: Max(li.Quantity - wDelivered, 0)
                    }
                )
            )
        )
    Children:
      - rectHeader_DBF:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblUserInfo_DBF:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - lblScreenTitle_DBF:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: |-
              ="New Delivery #" & gDeliveryNumber & " - " & gSelectedRequest.Title
            Width: =900
            X: =20
      - conScrollable_DBF:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowParentInfo_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =128
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =128
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblParentInfoTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        Size: =11
                        Text: ="Parent Request"
                        Width: =Parent.Width - 40
                  - rowParentInfoFields_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - colParentProject_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentProjectLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Related Project"
                                    Width: =Parent.Width
                              - lblParentProjectVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: |-
                                      =If(
                                          IsBlank(gSelectedRequest.ProjectID),
                                          "—",
                                          Coalesce(LookUp(Project_List, ProjectID = gSelectedRequest.ProjectID).Title, "—")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colParentDeliveries_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentDeliveriesLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Deliveries Created So Far"
                                    Width: =Parent.Width
                              - lblParentDeliveriesVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: =Text(CountRows(colSiblingBatches))
                                    Width: =Parent.Width
                                    Wrap: =false
                        - colParentCurrency_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =56
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - lblParentCurrencyLbl_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(107, 105, 98, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    Size: =9
                                    Text: ="Request Estimate (all deliveries)"
                                    Width: =Parent.Width
                              - lblParentCurrencyVal_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =11
                                    Text: =Text(gSelectedRequest.EstimatedCost, "#,###.00") & " " & gSelectedRequest.Currency
                                    Width: =Parent.Width
                                    Wrap: =false
            - rowLineItems_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =148 + CountRows(colBatchEntry) * 56
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =148 + CountRows(colBatchEntry) * 56
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblLineItemsTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Size: =12
                        Text: ="Raw Materials In This Delivery *"
                        Width: =Parent.Width - 40
                  - lblLineItemsHint_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =36
                        Size: =10
                        Text: ="Enter the quantity expected in THIS delivery for each material. Leave a quantity at 0 to leave that material out — it stays outstanding on the request and can go in a later delivery. Defaults to whatever is still outstanding."
                        Width: =Parent.Width - 40
                  - rowColHeader_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblColName_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Trade Name"
                              Width: =Parent.Width * 0.3
                        - lblColUnit_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Unit"
                              Width: =Parent.Width * 0.07
                        - lblColOrdered_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Ordered"
                              Width: =Parent.Width * 0.1
                        - lblColDelivered_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Received So Far"
                              Width: =Parent.Width * 0.12
                        - lblColRemaining_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Remaining"
                              Width: =Parent.Width * 0.1
                        - lblColBatchQty_DBF:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              Size: =9
                              Text: ="Qty This Delivery *"
                              Width: =Parent.Width * 0.14
                  - galBatchEntry_DBF:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        BorderColor: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =CountRows(colBatchEntry) * 56 + 12
                        Items: =colBatchEntry
                        ShowScrollbar: =false
                        TemplateSize: =56
                        Width: =Parent.Width - 40
                      Children:
                        - rowBatchItem_DBF:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =55
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - colItemName_DBF:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =55
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width * 0.3
                                  Children:
                                    - lblItemName_DBF:
                                        Control: Label@2.5.1
                                        Properties:
                                          Height: =20
                                          Size: =11
                                          Text: =ThisItem.MaterialName
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lblItemSubtitle_DBF:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(136, 135, 128, 1)
                                          Height: =16
                                          Size: =8
                                          Text: |-
                                            =With({wMat: LookUp('Raw Materials', ID = ThisItem.MaterialID)}, If(IsBlank(wMat), "", wMat.Code & " · " & wMat.Category.Value & " · " & wMat.Supplier.Value))
                                          Width: =Parent.Width
                                          Wrap: =false
                              - lblItemUnit_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Size: =11
                                    Text: =ThisItem.Unit
                                    Width: =Parent.Width * 0.07
                                    Wrap: =false
                              - lblItemOrdered_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Size: =11
                                    Text: =Text(ThisItem.OrderedQty)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - lblItemDelivered_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(136, 135, 128, 1)
                                    Size: =11
                                    Text: =Text(ThisItem.DeliveredQty)
                                    Width: =Parent.Width * 0.12
                                    Wrap: =false
                              - lblItemRemaining_DBF:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.RemainingQty <= 0, RGBA(15, 110, 86, 1), RGBA(133, 79, 11, 1))
                                    FontWeight: =FontWeight.Semibold
                                    Size: =11
                                    Text: =Text(ThisItem.RemainingQty)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - txtBatchQty_DBF:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    Align: =Align.Center
                                    Height: =40
                                    OnChange: |-
                                      =UpdateIf(colBatchEntry, ParentLineItemID = ThisItem.ParentLineItemID, {BatchQty: Value(Self.Value)})
                                    Placeholder: ="0"
                                    Value: =If(IsBlank(ThisItem.BatchQty) || ThisItem.BatchQty = 0, "", Text(ThisItem.BatchQty))
                                    Width: =Parent.Width * 0.14
            - rowDeliveryDate_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =90
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =20
                  LayoutMinHeight: =110
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - colDeliveryDate_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =70
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblDeliveryDateLbl_DBF:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: ="Expected Delivery Date *"
                              Width: =Parent.Width
                        - dpBatchDeliveryDate:
                            Control: ModernDatePicker@1.0.1
                            Properties:
                              DefaultDate: =gSelectedRequest.RequiredDeliveryDate
                              Format: ="dd/mm/yyyy"
                              Height: =40
                              Placeholder: ="Choose a date"
                              Width: =Parent.Width
                  - colInvoiceMode_DBF:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =70
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =Not(gIsViaRequesterBatch)
                      Children:
                        - lblInvoiceModeLbl_DBF:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              Size: =11
                              Text: ="Invoice Handling For This Delivery *"
                              Width: =Parent.Width
                        - rdoBatchInvoiceMode:
                            Control: Radio@0.0.25
                            Properties:
                              DefaultSelectedItems: =["Direct"]
                              Height: =40
                              Items: =["Direct", "Deferred"]
                              Layout: ='RadioGroupCanvas.Layout'.Horizontal
                              Width: =Parent.Width
            - rowProformaInvoice_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =124
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =124
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =Not(gIsViaRequesterBatch) && Not(IsBlank(gSelectedRequest.RequesterInvoiceURL))
                  Width: =Parent.Width
                Children:
                  - lblProformaTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: =Coalesce(gSelectedRequest.InvoiceType.Value, "Invoice") & " from Requester — reference only"
                        Width: =Parent.Width - 40
                  - lblProformaNote_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =36
                        Size: =9
                        Text: ="This is not the official invoice, so it is not filed. Procurement still has to obtain and submit the real invoice for this delivery — pick Direct to do it now, or Deferred to do it later."
                        Width: =Parent.Width - 40
                  - lblProformaURL_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(56, 96, 178, 1)
                        Height: =24
                        OnSelect: =If(Not(IsBlank(gSelectedRequest.RequesterInvoiceURL)), Launch(gSelectedRequest.RequesterInvoiceURL, {}, LaunchTarget.New))
                        Size: =10
                        Text: ="Open invoice ↗"
                        Tooltip: =gSelectedRequest.RequesterInvoiceURL
                        Underline: =true
                        Width: =Parent.Width - 40
                        Wrap: =false
            - rowBatchNotes_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =130
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =130
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblBatchNotesLbl_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="Notes (optional)"
                        Width: =Parent.Width - 40
                  - txtBatchNotes:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =64
                        Mode: =TextMode.MultiLine
                        Placeholder: ="Anything the receiver or Accounting should know about this delivery"
                        Width: =Parent.Width - 40
            - rowDirectInvoice_DBF:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =230
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =Not(gIsViaRequesterBatch) && rdoBatchInvoiceMode.Selected.Value = "Direct"
                  Width: =Parent.Width
                Children:
                  - lblDirectInvoiceTitle_DBF:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingRight: =0
                        Size: =11
                        Text: ="Official Invoice *"
                        Width: =Parent.Width - 40
                  - lblDirectInvoiceNote_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(133, 79, 11, 1)
                        Height: =36
                        Size: =9
                        Text: |-
                          ="Attach the file, then press Extract Invoice. That press already creates delivery #" & gDeliveryNumber &
                          " and saves the file onto it — the invoice details below are read from the file, and you can correct any of them before submitting."
                        Width: =Parent.Width - 40
                  - formDirectInvoice_DBF:
                      Control: Form@2.4.4
                      Variant: Classic
                      Layout: Vertical
                      Properties:
                        DataSource: ='RM Procurement Requests'
                        FillPortions: =0
                        Height: =100
                        Item: =gPendingDeliveryBatch
                        LayoutMinHeight: =100
                        NumberOfColumns: =1
                        OnFailure: |-
                          =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                          Notify("Delivery #" & gDeliveryNumber & " was created, but the invoice file could not be attached. Attach it again and press Extract Invoice.", NotificationType.Error)
                        OnSuccess: |-
                          =Set(gParsingInvoice, true);
                          Set(gHasInvoiceResult, false);
                          Set(gInvoiceResult, IfError(Parse_Invoice.Run(gInvoiceFileURL, gPendingDeliveryBatch.ID), Blank()));
                          Set(gHasInvoiceResult, true);
                          Set(gParsingInvoice, false);
                          Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                          If(
                              IsBlank(gInvoiceResult.invoiceNumber) && IsBlank(gInvoiceResult.supplierName) && IsBlank(gInvoiceResult.totalAmount),
                              Notify("Delivery #" & gDeliveryNumber & " was created, but nothing could be read from the invoice file. Type the invoice details in below, then submit.", NotificationType.Warning),
                              Notify("Delivery #" & gDeliveryNumber & " was created. Check the extracted invoice details below, correct anything wrong, then submit.", NotificationType.Success)
                          )
                        Width: =Parent.Width - 40
                      Children:
                        - dcDirectInvoice_DBF:
                            Control: TypedDataCard@1.0.7
                            Variant: ClassicAttachmentsEdit
                            Properties:
                              DataField: ="{Attachments}"
                              Default: =Blank()
                              DisplayMode: =DisplayMode.Edit
                              DisplayName: =""
                              Height: =100
                              Required: =false
                              Update: =attDirectInvoice_DBF.Attachments
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                            Children:
                              - lblDirectInvoiceFileLabel_DC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Bold
                                    Height: =28
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: ="Invoice File *"
                                    Width: =Parent.Width
                              - attDirectInvoice_DBF:
                                  Control: Attachments@2.3.0
                                  Properties:
                                    Height: =100
                                    Items: =If(IsBlank(Parent.Default), gPendingDirectAttachments, Parent.Default)
                                    MaxAttachments: =1
                                    Width: =Parent.Width
                  - lblDirectInvoiceStatus_DBF:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(83, 74, 183, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =10
                        Text: ="⏳ Attaching, extracting and filing the invoice — please wait..."
                        Visible: =gParsingInvoice
                        Width: =Parent.Width - 40
