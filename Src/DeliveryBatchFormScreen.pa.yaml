                        Width: =320
                  - btnCreateBatch_DBF:
                      Control: Button@0.0.45
                      Properties:
                        BasePaletteColor: =RGBA(5, 102, 178, 1)
                        Height: =36
                        OnSelect: |-
                          =If(
                              Not(IsBlank(gPendingDeliveryBatch.ID)) && gHasInvoiceResult,
                              If(
                                  IsBlank(txtFldInvNumber_DBF.Value) || IsBlank(txtFldInvDate_DBF.Value) ||
                                  IsBlank(txtFldSupplierName_DBF.Value) || IsBlank(txtFldBilledTo_DBF.Value) ||
                                  IsBlank(txtFldTotalAmount_DBF.Value) || IsBlank(txtFldCurrency_DBF.Value) ||
                                  IsBlank(txtFldInvDescription_DBF.Value),
                                  Notify("Please fill in Invoice Date, Supplier Name, Billed To, Invoice Number, Total Amount, Currency and Description", NotificationType.Error),
                                  With(
                                      {
                                          wDescription: txtFldInvDescription_DBF.Value
                                      },
                                          Patch('RM Procurement Requests', {ID: gPendingDeliveryBatch.ID}, {InvoiceSubmitted: true, OfficialInvoiceLink: gInvoiceFileURL});
                                          Patch(
                                              'RM Procurement Execution Log',
                                              Defaults('RM Procurement Execution Log'),
                                              {
                                                  Title: "Step 6 - Invoice Submission - " & gPendingDeliveryBatch.Title,
                                                  RequestID: {Id: gPendingDeliveryBatch.ID, Value: gPendingDeliveryBatch.Title},
                                                  RequestIDText: Text(gPendingDeliveryBatch.ID),
                                                  StepNumber: 6,
                                                  StepName: {Value: "Invoice Submission"},
                                                  ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                  ExecutedAt: Now()
                                              }
                                          );
                                          Set(gSubmitInvoiceResult,
                                              Submit_Invoice.Run(
                                                  gInvoiceFileURL,
                                                  gPendingDeliveryBatch.ID,
                                                  Left(lblSuggestedFilename_DBF.Text, Len(lblSuggestedFilename_DBF.Text) - Len("." & Last(Split(lblSuggestedFilename_DBF.Text, ".")).Value)),
                                                  txtFldInvDate_DBF.Value,
                                                  txtFldSupplierName_DBF.Value,
                                                  txtFldBilledTo_DBF.Value,
                                                  txtFldInvNumber_DBF.Value,
                                                  Value(txtFldTotalAmount_DBF.Value),
                                                  Coalesce(Value(txtFldTaxAmount_DBF.Value), 0),
                                                  txtFldCurrency_DBF.Value,
                                                  Coalesce(gInvoiceResult.jobId, ""),
                                                  Coalesce(gInvoiceResult.confidenceScore, 0),
                                                  txtFldAttention_DBF.Value,
                                                  wDescription,
                                                  gPendingDeliveryBatch.InvoiceRegion.Value,
                                                  txtFldSupplierABN_DBF.Value,
                                                  "Raw Materials Procurement App"
                                              )
                                          );
                                          Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
                                          If(
                                              IsError(gSubmitInvoiceResult),
                                              Notify("Invoice filing failed for delivery #" & gDeliveryNumber & ". The delivery exists — retry from its Submit Invoice button on Home.", NotificationType.Error),
                                              Notify("Delivery #" & gDeliveryNumber & " completed — invoice submitted.", NotificationType.Success);
                                              Navigate(RequestDetailScreen)
                                          )
                                  )
                              ),
                              If(
                                  IsEmpty(Filter(colBatchEntry, BatchQty > 0)),
                                  Notify("Please enter a quantity for at least one material in this delivery", NotificationType.Error),
                                  If(
                                      Not(IsEmpty(Filter(colBatchEntry, BatchQty > RemainingQty))),
                                      Notify("A quantity exceeds what is still outstanding on the request. Reduce it, or set it to 0 to leave that material out.", NotificationType.Error),
                                      If(
                                          IsBlank(dpBatchDeliveryDate.SelectedDate),
                                          Notify("Please pick the expected delivery date", NotificationType.Error),
                                          If(
                                              Not(gIsViaRequesterBatch) && IsBlank(rdoBatchInvoiceMode.Selected.Value),
                                              Notify("Please choose how the invoice for this delivery is handled", NotificationType.Error),
                                              If(
                                                  Not(gIsViaRequesterBatch) && rdoBatchInvoiceMode.Selected.Value = "Direct" && CountRows(attDirectInvoice_DBF.Attachments) = 0,
                                                  Notify("Please attach the invoice file — Direct mode submits it as part of creating this delivery", NotificationType.Error),
                                              If(
                                                  gIsViaRequesterBatch && IsBlank(rdoViaReqInvoiceOK_DBF.Selected.Value),
                                                  Notify("Please say whether the requester's invoice is correct", NotificationType.Error),
                                                      With(
                                                          {wLatest: LookUp('RM Procurement Requests', ID = gSelectedRequest.ID)},
                                                          If(
                                                              wLatest.Status.Value <> "In Delivery",
                                                              Notify("This request is no longer open for new deliveries. Your entry has been cancelled.", NotificationType.Warning);
                                                              Navigate(HomeScreen),
                                                          If(
                                                              wLatest.ProcurementType.Value = "Invoice Supplied" &&
                                                              wLatest.InvoiceType.Value = "Official Invoice" &&
                                                              Coalesce(wLatest.DeliveryCount, 0) >= 1,
                                                              Notify("This request's official invoice covers a single delivery, which already exists. A further shipment under that same invoice is a receipt round, not a new delivery.", NotificationType.Error);
                                                              Navigate(RequestDetailScreen),
                                                              If(
                                                                  Coalesce(wLatest.DeliveryCount, 0) + 1 <> gDeliveryNumber,
                                                                  Notify("Another delivery has just been created for this request. Please reopen this screen and try again.", NotificationType.Warning);
                                                                  Navigate(RequestDetailScreen),
                                                                  With(
                                                                      {wBatch: Patch(
                                                                          'RM Procurement Requests',
