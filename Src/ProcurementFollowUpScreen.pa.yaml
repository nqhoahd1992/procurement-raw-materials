Screens:
  ProcurementFollowUpScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        Reset(txtFollowUpNotes_PFU);
        ResetForm(formCreditNote_PFU);
        Set(gRoundsDone, Coalesce(gSelectedRequest.ReceiptRoundCount, 0));
        Set(gLatestDecision, gSelectedRequest.LatestReceiptDecision);
        Set(gPFUPending, gSelectedRequest.Status.Value = "Pending Supplier Follow-up" && gLatestDecision = "Accepted with Adjustment");
        Set(gPFUInvoiceMissing,
            gPFUPending &&
            (Not(gSelectedRequest.InvoiceSubmitted) || IsBlank(gSelectedRequest.OfficialInvoiceLink))
        );
        Set(gInvoiceFromPFU, false);
        ClearCollect(colLineItemsDetail, Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(colReceiptRounds, Filter('RM Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(
            colRoundHistory,
            ForAll(
                Sort(
                    Filter('RM Procurement Execution Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber >= 3 && StepNumber <= 5),
                    ID,
                    SortOrder.Ascending
                ) As lg,
                {
                    ID: lg.ID,
                    StepNumber: lg.StepNumber,
                    StepLabel: If(lg.StepNumber = 5, "Procurement close-out", "Goods receipt"),
                    RoundNumber: lg.RoundNumber,
                    ActorName: Coalesce(lg.ReceivedBy, lg.ExecutedBy.Value),
                    ActionDate: Coalesce(lg.ReceiptDate, lg.ExecutedAt),
                    ReceiptStatus: lg.ReceiptStatus,
                    AcceptanceDecision: lg.AcceptanceDecision,
                    Notes: lg.Notes
                }
            )
        );
        Set(locCreditNoteURL_PFU, "");
        Set(gPendingCreditNoteName_PFU, "");
        Set(gShowReceiptPhotos, false);
        Set(gShowRoundDetails, false)
    Children:
      - rectHeader_PFU:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_PFU:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Procurement Close-out (Round " & gRoundsDone & ")"
            Width: =700
            X: =20
      - lblUserInfo_PFU:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
      - lblNotAuthorized_PFU:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(163, 45, 45, 1)
            Fill: =RGBA(252, 235, 235, 1)
            Height: =Parent.Height - 60
            Size: =12
            Text: ="You do not have access to this page."
            Visible: =gCurrentUser.Role.Value <> "Procurement" && gCurrentUser.Role.Value <> "Admin"
            Width: =Parent.Width
            Y: =60
      - rowInfoBlock_PFU:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 250, 1)
            Height: =120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"
            Width: =Parent.Width
            Y: =60
          Children:
            - rowInfoLine1_PFU:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =34
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =24
                  PaddingRight: =1
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                Children:
                  - lblInfoTitle_PFU:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =14
                        Text: |-
                          ="ID: " & gSelectedRequest.ID & " - " & gSelectedRequest.Title
                        Width: =600
                  - lblStatusBadge_PFU:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(246, 88, 16, 1)
                        BorderThickness: =1
                        Color: =RGBA(246, 88, 16, 1)
                        Fill: =RGBA(255, 243, 224, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =8
                        PaddingRight: =8
                        Size: =10
                        Text: =gSelectedRequest.Status.Value
                        Width: =220
            - rowInfoLine2_PFU:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =24
                  LayoutMinHeight: =44
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                Children:
                  - colRequester_PFU:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =240
                      Children:
                        - lblInfoRequesterLabel_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Requester"
                              Width: =240
                        - lblInfoRequesterValue_PFU:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: =gSelectedRequest.RequesterID.Value
                              Width: =240
                  - colRound_PFU:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =200
                      Children:
                        - lblInfoRoundLabel_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Following up on Round"
                              Width: =200
                        - lblInfoRoundValue_PFU:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: =Text(gRoundsDone)
                              Width: =200
                  - colDecision_PFU:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =320
                      Children:
                        - lblInfoDecisionLabel_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Receiver's Acceptance Decision"
                              Width: =320
                        - lblInfoDecisionValue_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =If(gLatestDecision = "Requires Supplier Follow-up", RGBA(133, 79, 11, 1), RGBA(15, 110, 86, 1))
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: =If(IsBlank(gLatestDecision), "—", gLatestDecision)
                              Width: =320
      - conScrollable_PFU:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 240
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"
            Width: =Parent.Width
            Y: =180
          Children:
            - rowNotPending_PFU:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(225, 245, 238, 1)
                  FillPortions: =0
                  Height: =70
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =70
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =Not(gPFUPending)
                  Width: =Parent.Width
                Children:
                  - lblNotPending_PFU:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(15, 110, 86, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        Size: =11
                        Text: ="✅ There is no supplier follow-up pending for this request."
                        Width: =Parent.Width - 40
            - rowRoundDetailHeader_PFU:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(241, 239, 232, 1)
                  FillPortions: =0
                  Height: =60 + 32 + CountRows(Filter(colReceiptRounds, RoundNumber = gRoundsDone)) * 40 + 16
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CountRows(Filter(colReceiptRounds, RoundNumber = gRoundsDone)) > 0
                  Width: =Parent.Width
                Children:
                  - lblRoundDetailHeader_PFU:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="What was received in Round " & gRoundsDone
                        Width: =Parent.Width
                  - rowRoundDetailColHeader_PFU:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(225, 223, 214, 1)
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lblRDColName_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Trade Name"
                              Width: =Parent.Width * 0.24
                        - lblRDColUnit_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Unit"
                              Width: =Parent.Width * 0.06
                        - lblRDColQty_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Received"
                              Width: =Parent.Width * 0.1
                        - lblRDColBatch_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Batch No"
                              Width: =Parent.Width * 0.1
                        - lblRDColExp_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Expiry Date"
                              Width: =Parent.Width * 0.12
                        - lblRDColQC_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="QC Number"
                              Width: =Parent.Width * 0.1
                        - lblRDColRMPK_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="RM Code"
                              Width: =Parent.Width * 0.1
                        - lblRDColCOA_PFU:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(68, 68, 65, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Link to COA"
                              Width: =Parent.Width * 0.16
                  - galRoundDetail_PFU:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(Filter(colReceiptRounds, RoundNumber = gRoundsDone)) * 40 + 8
                        Items: =Filter(colReceiptRounds, RoundNumber = gRoundsDone)
                        ShowScrollbar: =false
                        TemplateSize: =40
                        Width: =Parent.Width
                      Children:
                        - rowRDItem_PFU:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =If(Mod(ThisItem.LineItemID, 2) = 0, RGBA(248, 247, 243, 1), RGBA(255, 255, 255, 1))
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - lblRDName_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Height: =32
                                    Size: =11
                                    Text: =ThisItem.MaterialName
                                    Width: =Parent.Width * 0.24
                                    Wrap: =false
                              - lblRDUnit_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =32
                                    Size: =10
                                    Text: =ThisItem.Unit
                                    Width: =Parent.Width * 0.06
                              - lblRDQty_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =11
                                    Text: =Text(ThisItem.ReceivedQty)
                                    Width: =Parent.Width * 0.1
                              - lblRDBatch_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(68, 68, 65, 1)
                                    Height: =32
                                    Size: =10
                                    Text: =If(IsBlank(ThisItem.BatchNumber), "—", ThisItem.BatchNumber)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - lblRDExp_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(68, 68, 65, 1)
                                    Height: =32
                                    Size: =10
                                    Text: =If(IsBlank(ThisItem.ExpiryDate), "—", Text(ThisItem.ExpiryDate, "dd/mm/yyyy"))
                                    Width: =Parent.Width * 0.12
                              - lblRDQC_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(68, 68, 65, 1)
                                    Height: =32
                                    Size: =10
                                    Text: =If(IsBlank(ThisItem.QCNumber), "—", ThisItem.QCNumber)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - lblRDRMPK_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(68, 68, 65, 1)
                                    Height: =32
                                    Size: =10
                                    Text: =If(IsBlank(ThisItem.RMPKCode), "—", ThisItem.RMPKCode)
                                    Width: =Parent.Width * 0.1
                                    Wrap: =false
                              - lblRDCOA_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(IsBlank(ThisItem.COALink), RGBA(163, 45, 45, 1), RGBA(56, 96, 178, 1))
                                    Height: =32
                                    OnSelect: =If(Not(IsBlank(ThisItem.COALink)), Launch(ThisItem.COALink, {}, LaunchTarget.New))
                                    Size: =10
                                    Text: =If(IsBlank(ThisItem.COALink), "Missing", ThisItem.COALink)
                                    Underline: =Not(IsBlank(ThisItem.COALink))
                                    Width: =Parent.Width * 0.16
                                    Wrap: =false
            - rowHistoryHeader_PFU:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40 + CountRows(colRoundHistory) * 84 + 16
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CountRows(colRoundHistory) > 0
                  Width: =Parent.Width
                Children:
                  - lblHistoryHeader_PFU:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Receipt & Follow-up History"
                        Width: =Parent.Width
                  - galRoundHistory_PFU:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(colRoundHistory) * 88 + 8
                        Items: =colRoundHistory
                        ShowScrollbar: =false
                        TemplateSize: =88
                        Width: =Parent.Width
                      Children:
                        - rowHistItem_PFU:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =If(Mod(ThisItem.RoundNumber, 2) = 0, RGBA(248, 247, 243, 1), RGBA(255, 255, 255, 1))
                              Height: =88
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =4
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - lblHistTop_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =24
                                    Size: =10
                                    Text: |-
                                      ="R" & ThisItem.RoundNumber & " · " & ThisItem.StepLabel &
                                      " · " & If(IsBlank(ThisItem.ActorName), "—", ThisItem.ActorName) &
                                      " · " & If(IsBlank(ThisItem.ActionDate), "—", Text(ThisItem.ActionDate, "dd/mm/yyyy")) &
                                      If(IsBlank(ThisItem.AcceptanceDecision), "", " · " & ThisItem.AcceptanceDecision)
                                    Width: =Parent.Width
                                    Wrap: =false
                              - lblHistNotes_PFU:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =24
                                    Size: =9
                                    Text: |-
                                      =If(IsBlank(ThisItem.Notes), "", "Notes: " & ThisItem.Notes)
                                    Width: =Parent.Width
                                    Wrap: =false
                              - rowHistAttachments_PFU:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =24
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =ThisItem.StepNumber <> 5
                                    Width: =Parent.Width
                                  Children:
                                    - btnViewRoundPhotos_PFU:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          BasePaletteColor: =RGBA(83, 74, 183, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          OnSelect: |-
                                            =ClearCollect(colReceiptPhotos, LookUp('RM Procurement Execution Log', ID = ThisItem.ID).Attachments);
                                            Set(gPhotoRoundLabel, "Round " & ThisItem.RoundNumber & " · " & ThisItem.StepLabel);
                                            Set(gShowReceiptPhotos, true)
                                          PaddingBottom: =2
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =2
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =9
                                          Text: ="View attachments"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =140
                                    - btnViewRoundDetails_PFU:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          BasePaletteColor: =RGBA(56, 96, 178, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          OnSelect: |-
                                            =ClearCollect(
                                                colRoundDetails,
                                                ForAll(
                                                    Filter(colReceiptRounds, RoundNumber = ThisItem.RoundNumber) As rr,
                                                    {
                                                        LineItemID: rr.LineItemID,
                                                        MaterialName: rr.MaterialName,
                                                        Unit: rr.Unit,
                                                        OrderedQty: LookUp(colLineItemsDetail, ID = rr.LineItemID).Quantity,
                                                        ReceivedQty: rr.ReceivedQty,
                                                        BatchNumber: rr.BatchNumber,
                                                        ExpiryDate: rr.ExpiryDate,
                                                        QCNumber: rr.QCNumber,
                                                        RMPKCode: rr.RMPKCode,
                                                        COALink: rr.COALink
                                                    }
                                                )
                                            );
                                            Set(gDetailRoundLabel, "Round " & ThisItem.RoundNumber);
                                            Set(gShowRoundDetails, true)
                                          PaddingBottom: =2
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =2
                                          RadiusBottomLeft: =4
                                          RadiusBottomRight: =4
                                          RadiusTopLeft: =4
                                          RadiusTopRight: =4
                                          Size: =9
                                          Text: ="View receipt details"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =150
            - rowInvoiceRequired_PFU:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(250, 238, 218, 1)
                  FillPortions: =0
                  Height: =152
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =152
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =gPFUInvoiceMissing
                  Width: =Parent.Width
                Children:
                  - lblInvoiceRequiredHeader_PFU:
                      Control: Label@2.5.1
