      - conActionBar_AC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_AC:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
                  X: =Parent.Width - 120
                  Y: =40
            - conActionBarBtn_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =36
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnCancel_AC:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(HomeScreen)
                        Text: ="Cancel"
                        Width: =120
                        X: =40
                        Y: =40
                  - btnSubmit_AC:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =If(
                              Not(chk1_AC.Checked && chk2_AC.Checked && chk3_AC.Checked &&
                                  chk4_AC.Checked && chk5_AC.Checked),
                              Notify("Please complete all checklist items", NotificationType.Error),
                              If(
                                  IsBlank(txtNotes_AC.Value),
                                  Notify("Accounting Notes is required", NotificationType.Error),
                                  With(
                                      {wPatched: Patch(
                                          'RM Procurement Requests',
                                          gSelectedRequest,
                                          {
                                              Status: {Value: "Completed"},
                                              AccountingHandlerID: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                              AccountingCompletedAt: Now()
                                          }
                                      )},
                                      If(
                                          IsBlank(wPatched.ID),
                                          Notify("Failed to update status. Please try again.", NotificationType.Error),
                                          With(
                                              {wLog: Patch(
                                                  'RM Procurement Execution Log',
                                                  Defaults('RM Procurement Execution Log'),
                                                  {
                                                      Title: "Step 2 - Accounting Handover - " & gSelectedRequest.Title,
                                                      RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                      RequestIDText: Text(gSelectedRequest.ID),
                                                      StepNumber: 2,
                                                      StepName: {Value: "Accounting Handover"},
                                                      ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                      ExecutedAt: Now(),
                                                      Notes: txtNotes_AC.Value
                                                  }
                                              )},
                                              If(
                                                  IsBlank(wLog.ID),
                                                  Notify("Failed to save execution log. Please try again.", NotificationType.Error),
                                                  With(
                                                      {wParentID: Coalesce(gSelectedRequest.ParentRequestID, 0)},
                                                      With(
                                                          {wParent: If(wParentID > 0, LookUp('RM Procurement Requests', ID = wParentID), Blank())},
                                                          If(
                                                              Not(IsBlank(wParent)) && wParent.Status.Value = "Delivered"
                                                                  && IsEmpty(Filter('RM Procurement Requests', ParentRequestID = wParentID && (Status.Value = "Goods Receipt" || Status.Value = "Supplier Follow-up" || Status.Value = "Pending Invoice" || Status.Value = "Pending Accounting")))
                                                                  && Not(IsEmpty(Filter('RM Procurement Requests', ParentRequestID = wParentID && Status.Value = "Completed"))),
                                                              Patch('RM Procurement Requests', wParent, {Status: {Value: "Completed"}});
                                                              Patch(
                                                                  'RM Procurement Execution Log',
                                                                  Defaults('RM Procurement Execution Log'),
                                                                  {
                                                                      Title: "Step 9 - Request Completed - " & wParent.Title,
                                                                      RequestID: {Id: wParent.ID, Value: wParent.Title},
                                                                      RequestIDText: Text(wParent.ID),
                                                                      StepNumber: 9,
                                                                      StepName: {Value: "Request Completed"},
                                                                      ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                                      ExecutedAt: Now(),
                                                                      Notes: "All deliveries completed after the request was closed."
                                                                  }
                                                              )
                                                          )
                                                      )
                                                  );
                                                  Notify("Accounting handover completed. Request is now Completed.", NotificationType.Success);
                                                  Navigate(HomeScreen)
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Submit →"
                        Width: =120
                        X: =40
                        Y: =40
