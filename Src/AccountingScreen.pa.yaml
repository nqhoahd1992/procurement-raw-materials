Screens:
  AccountingScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(chk1_AC);
        Reset(chk2_AC);
        Reset(chk3_AC);
        Reset(chk4_AC);
        Reset(chk5_AC);
        Reset(txtNotes_AC);
        Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID))
    Children:
      - rectHeader_AC:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_AC:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Accounting Handover"
            Width: =698
            X: =20
      - rowInfoBlock_AC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 250, 1)
            Height: =120
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =60
          Children:
            - rowInfoLine1_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =34
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =24
                  PaddingRight: =1
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                Children:
                  - lblInfoTitle_AC:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        Size: =14
                        Text: =gSelectedRequest.Title
                        Width: =600
                  - lblStatusBadge_AC:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =Switch(gSelectedRequest.Status.Value,
                            "Pending Manager", RGBA(146, 84, 14, 1),
                            "Pending Executive", RGBA(175, 74, 20, 1),
                            "Pending Procurement", RGBA(122, 108, 10, 1),
                            "In Delivery", RGBA(83, 74, 183, 1),
                            "Closed", RGBA(13, 108, 108, 1),
                            "Rejected", RGBA(163, 45, 45, 1),
                            "Goods Receipt & Acceptance", RGBA(37, 92, 178, 1),
                            "Pending Supplier Follow-up", RGBA(11, 105, 132, 1),
                            "Pending Invoice", RGBA(124, 58, 173, 1),
                            "Pending Accounting", RGBA(158, 44, 108, 1),
                            "Completed", RGBA(15, 110, 86, 1),
                            "Cancelled", RGBA(148, 87, 87, 1),
                            RGBA(68, 68, 65, 1)
                          )
                        Fill: |-
                          =Switch(gSelectedRequest.Status.Value,
                            "Pending Manager", RGBA(253, 242, 216, 1),
                            "Pending Executive", RGBA(253, 234, 222, 1),
                            "Pending Procurement", RGBA(247, 245, 210, 1),
                            "In Delivery", RGBA(228, 225, 250, 1),
                            "Closed", RGBA(219, 243, 243, 1),
                            "Rejected", RGBA(252, 233, 233, 1),
                            "Goods Receipt & Acceptance", RGBA(223, 234, 252, 1),
                            "Pending Supplier Follow-up", RGBA(219, 241, 249, 1),
                            "Pending Invoice", RGBA(240, 228, 252, 1),
                            "Pending Accounting", RGBA(252, 230, 242, 1),
                            "Completed", RGBA(222, 245, 236, 1),
                            "Cancelled", RGBA(243, 235, 235, 1),
                            RGBA(241, 239, 232, 1)
                          )
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =8
                        PaddingRight: =10
                        Size: =10
                        Text: =gSelectedRequest.Status.Value
                        Width: =220
            - rowInfoLine3_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =24
                  LayoutMinHeight: =44
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                  X: =40
                  Y: =40
                Children:
                  - colProcurementType_AC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =300
                      Children:
                        - lblInfoProcTypeLabel_EPS_1:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Procurement Type"
                              Width: =300
                        - lblInfoProcTypeValue_EPS_1:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: |-
                                =gSelectedRequest.ProcurementType.Value &
                                    If(
                                        IsBlank(gSelectedRequest.InvoiceType.Value),
                                        "",
                                        " · " & gSelectedRequest.InvoiceType.Value
                                    )
                              Width: =300
                              Wrap: =false
                  - colCostCenter_AC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =240
                      Children:
                        - lblInfoCostCenterLabel_AC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Cost Center"
                              Width: =240
                        - lblInfoCostCenterValue_AC:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: =If(IsBlank(gSelectedRequest.CostCenter.Value), "—", gSelectedRequest.CostCenter.Value)
                              Width: =240
                  - colCost_AC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =300
                      Children:
                        - lblInfoCostLabel_AC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Estimated Cost"
                              Width: =300
                        - lblInfoCostValue_AC:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: =Text(gSelectedRequest.EstimatedCost, "#,###.00")  & " " & gSelectedRequest.Currency
                              Width: =300
      - conScrollable_AC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - 280
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =180
          Children:
            - rowOfficialInvoiceRef_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(219, 234, 254, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =200
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblOfficialInvoiceRefTitle_AC:
                      Control: Label@2.5.1
                      Properties:
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Official Invoice Reference"
                        Width: =Parent.Width - 40
                  - lblOfficialInvoiceRefValue_AC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(37, 99, 235, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =50
                        PaddingLeft: =0
                        Size: =11
                        Text: =If(IsBlank(gSelectedRequest.OfficialInvoiceLink), "—", "Open official invoice ↗")
                        Tooltip: =gSelectedRequest.OfficialInvoiceLink
                        Underline: =true
                        Width: =Parent.Width - 40
                        Wrap: =false
                  - lblSupplierSummaryRefTitle_AC:
                      Control: Label@2.5.1
                      Properties:
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =4
                        Size: =11
                        Text: ="SO/PO/INV"
                        Width: =Parent.Width - 40
                  - lblSupplierSummaryRefValue_AC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(37, 99, 235, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: |-
                          =With(
                              {wSummary: LookUp('RM Procurement Execution Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber = 1).SupplierSummary},
                              If(IsBlank(wSummary), "—", wSummary)
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 40
            - rowCreditNoteRef_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(225, 245, 238, 1)
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =90
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =Not(IsBlank(gSelectedRequest.CreditNote))
                  Width: =Parent.Width
                Children:
                  - lblCreditNoteRefTitle_AC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(15, 110, 86, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Credit Note"
                        Width: =Parent.Width - 40
                  - lblCreditNoteRefValue_AC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(15, 110, 86, 1)
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =If(Not(IsBlank(gSelectedRequest.CreditNote)), Launch(gSelectedRequest.CreditNote, {}, LaunchTarget.New))
                        Overflow: =Overflow.Scroll
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: =If(IsBlank(gSelectedRequest.CreditNote), "—", "Open credit note ↗")
                        Tooltip: =gSelectedRequest.CreditNote
                        Underline: =Not(IsBlank(gSelectedRequest.CreditNote))
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 40
            - rowChecklistHeader_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =70
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblChecklistHeader_AC:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =12
                        Text: ="Accounting Checklist *"
                        Width: =Parent.Width - 40
                  - lblChecklistNote_AC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(133, 79, 11, 1)
                        Height: =20
                        Size: =10
                        Text: ="All items must be checked before submitting"
                        Width: =Parent.Width - 40
            - rowCheck1_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - chk1_AC:
                      Control: CheckBox@0.0.30
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Label: =
                        Width: =32
                  - lblChk1_AC:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Invoice amount matches approved procurement request"
                        Width: =Parent.Width - 60
            - rowCheck2_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - chk2_AC:
                      Control: CheckBox@0.0.30
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Label: =
                        Width: =32
                  - lblChk2_AC:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="VAT and tax compliance verified"
                        Width: =Parent.Width - 60
            - rowCheck3_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - chk3_AC:
                      Control: CheckBox@0.0.30
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Label: =
                        Width: =32
                  - lblChk3_AC:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Payment terms and due date confirmed"
                        Width: =Parent.Width - 60
            - rowCheck4_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - chk4_AC:
                      Control: CheckBox@0.0.30
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Label: =
                        Width: =32
                  - lblChk4_AC:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Invoice recorded in accounting system"
                        Width: =Parent.Width - 60
            - rowCheck5_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =40
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingBottom: =4
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =4
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - chk5_AC:
                      Control: CheckBox@0.0.30
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Label: =
                        Width: =32
                  - lblChk5_AC:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Height: =24
                        PaddingLeft: =0
                        PaddingRight: =0
                        Size: =11
                        Text: ="Supporting documents complete and filed"
                        Width: =Parent.Width - 60
            - rowNotes_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =140
                  PaddingBottom: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - lblNotesLabel_AC:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        Size: =11
                        Text: ="Accounting Notes *"
                        Width: =Parent.Width - 40
                  - txtNotes_AC:
                      Control: TextInput@0.0.54
                      Properties:
                        Height: =80
                        Mode: ='TextInputCanvas.Mode'.Multiline
                        Placeholder: ="Enter accounting notes, payment details, or remarks..."
                        Width: =Parent.Width - 40
      - conActionBar_AC:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_AC:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Back()
                  Text: ="← Back"
                  Width: =100
                  X: =Parent.Width - 120
                  Y: =40
            - conActionBarBtn_AC:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =36
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnCancel_AC:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Navigate(HomeScreen)
                        Text: ="Cancel"
                        Width: =120
                        X: =40
                        Y: =40
                  - btnSubmit_AC:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =If(
                              Not(chk1_AC.Checked && chk2_AC.Checked && chk3_AC.Checked &&
                                  chk4_AC.Checked && chk5_AC.Checked),
                              Notify("Please complete all checklist items", NotificationType.Error),
                              If(
                                  IsBlank(txtNotes_AC.Value),
                                  Notify("Accounting Notes is required", NotificationType.Error),
                                  With(
                                      {wPatched: Patch(
                                          'RM Procurement Requests',
                                          gSelectedRequest,
                                          {
                                              Status: {Value: "Completed"},
                                              AccountingHandlerID: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                              AccountingCompletedAt: Now()
                                          }
                                      )},
                                      If(
                                          IsBlank(wPatched.ID),
                                          Notify("Failed to update status. Please try again.", NotificationType.Error),
                                          With(
                                              {wLog: Patch(
                                                  'RM Procurement Execution Log',
                                                  Defaults('RM Procurement Execution Log'),
                                                  {
                                                      Title: "Step 2 - Accounting Handover - " & gSelectedRequest.Title,
                                                      RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                      RequestIDText: Text(gSelectedRequest.ID),
                                                      StepNumber: 2,
                                                      StepName: {Value: "Accounting Handover"},
                                                      ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                      ExecutedAt: Now(),
                                                      Notes: txtNotes_AC.Value
                                                  }
                                              )},
                                              If(
                                                  IsBlank(wLog.ID),
                                                  Notify("Failed to save execution log. Please try again.", NotificationType.Error),
                                                  Notify("Accounting handover completed. Request is now Completed.", NotificationType.Success);
                                                  Navigate(HomeScreen)
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Submit →"
                        Width: =120
                        X: =40
                        Y: =40
      - lblUserInfo_SFU_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =12
            Text: |-
              =If(
                  IsBlank(gCurrentUser.Role.Value),
                  gCurrentEmployee.Title,
                  gCurrentEmployee.Title & " | " & gCurrentUser.Role.Value
              )
            Width: =280
            X: =Parent.Width - 300
