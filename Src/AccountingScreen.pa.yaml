                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =200
                            Children:
                              - lblIdentRequesterLabel_AC:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Requested by"
                                    Width: =Parent.Width
                              - lblIdentRequesterValue_AC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =Coalesce(gSelectedRequest.RequesterID.Value, gSelectedRequest.RequesterEmail, "—")
                                    Width: =Parent.Width
                                    Wrap: =false
                  - rowInfoMaterials_AC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =18 + 2 + Max(1, CountRows(colLineItemsDetail)) * 30
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =2
                        LayoutMinHeight: =18 + 2 + Max(1, CountRows(colLineItemsDetail)) * 30
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblInfoMaterialsLabel_AC:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(136, 135, 128, 1)
                              Height: =18
                              PaddingLeft: =0
                              Size: =9
                              Text: ="Raw Materials (" & CountRows(colLineItemsDetail) & ")"
                              Width: =Parent.Width
                        - lblInfoMaterialsEmpty_AC:
                            Control: Label@2.5.1
                            Properties:
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              PaddingLeft: =0
                              Size: =11
                              Text: ="—"
                              Visible: =CountRows(colLineItemsDetail) = 0
                              Width: =Parent.Width
                        - galInfoMaterials_AC:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              FillPortions: =0
                              Height: =CountRows(colLineItemsDetail) * 30
                              Items: =colLineItemsDetail
                              ShowScrollbar: =false
                              TemplateSize: =30
                              Visible: =CountRows(colLineItemsDetail) > 0
                              Width: =Parent.Width
                            Children:
                              - rowInfoMaterialItem_AC:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =30
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    Width: =Parent.Width
                                  Children:
                                    - lblInfoMaterialItemText_AC:
                                        Control: Label@2.5.1
                                        Properties:
                                          FontWeight: =FontWeight.Semibold
                                          Height: =30
                                          PaddingLeft: =0
                                          Size: =11
                                          Text: =ThisItem.RMPKCode & " — " & ThisItem.MaterialName & " (" & Text(ThisItem.Quantity) & " " & ThisItem.Unit & ")"
                                          Tooltip: =ThisItem.RMPKCode & " — " & ThisItem.MaterialName & " (" & Text(ThisItem.Quantity) & " " & ThisItem.Unit & ")"
                                          Width: =Parent.Width
                                          Wrap: =false
            - rowACReceived:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =84 + 32 + CountRows(colPFUSummary) * 40 + 16
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  PaddingBottom: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =CountRows(colPFUSummary) > 0
                  Width: =Parent.Width
                Children:
                  - lblACReceivedTitle:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        Size: =11
                        Text: ="Goods Actually Received On This Delivery"
                        Width: =Parent.Width - 40
                  - lblACReceivedNote:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =20
                        Size: =9
                        Text: |-
                          =With(
                              {wShort: CountRows(Filter(colPFUSummary, OutstandingQty > 0))},
                              If(
                                  wShort = 0,
                                  "Every material on this delivery was received in full.",
                                  Text(wShort) & " of " & CountRows(colPFUSummary) & " material(s) were short-delivered — check this against the invoice amount."
                              )
                          )
                        Width: =Parent.Width - 40
                  - rowACReceivedHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(232, 230, 221, 1)
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width - 40
                      Children:
                        - lblACRcvColName:
