                                    Wrap: =false
                              - lblACRcvUnit:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =32
                                    Size: =11
                                    Text: =ThisItem.Unit
                                    Width: =Parent.Width * 0.08
                                    Wrap: =false
                              - lblACRcvOrd:
                                  Control: Label@2.5.1
