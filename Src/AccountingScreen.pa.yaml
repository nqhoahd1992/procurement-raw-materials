                                    Height: =32
                                    Size: =11
                                    Text: =Text(ThisItem.OrderedQty)
                                    Width: =Parent.Width * 0.12
                                    Wrap: =false
                              - lblACRcvRec:
                                  Control: Label@2.5.1
                                  Properties:
                                    Height: =32
                                    Size: =11
                                    Text: =Text(ThisItem.TotalReceivedQty)
                                    Width: =Parent.Width * 0.12
                                    Wrap: =false
                              - lblACRcvOut:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.OutstandingQty <= 0, RGBA(15, 110, 86, 1), RGBA(163, 45, 45, 1))
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =11
                                    Text: =If(ThisItem.OutstandingQty <= 0, "Complete", Text(ThisItem.OutstandingQty))
                                    Width: =Parent.Width * 0.15
                                    Wrap: =false
                              - lblACRcvRnd:
                                  Control: Label@2.5.1
