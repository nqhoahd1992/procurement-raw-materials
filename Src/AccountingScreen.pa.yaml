                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =300
                            Children:
                              - lblInfoCostLabel_AC:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Estimated Cost"
                                    Width: =300
                              - lblInfoCostValue_AC:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    PaddingLeft: =0
                                    Size: =11
                                    Text: =Text(gSelectedRequest.EstimatedCost, "#,###.00")  & " " & gSelectedRequest.Currency
                                    Width: =300
                  - rowInfoIdent_AC:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =24
                        LayoutMinHeight: =44
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
