                            Children:
                              - lblInfoCostCenterLabel_AC:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(136, 135, 128, 1)
                                    Height: =18
                                    PaddingLeft: =0
                                    Size: =9
                                    Text: ="Cost Center"
                                    Width: =240
                              - lblInfoCostCenterValue_AC:
                                  Control: Label@2.5.1
