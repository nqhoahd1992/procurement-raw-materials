                        Width: =Parent.Width - 40
                        Wrap: =false
                  - lblSupplierSummaryRefTitle_AC:
                      Control: Label@2.5.1
                      Properties:
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =20
                        Size: =11
                        Text: ="SO/PO/INV"
