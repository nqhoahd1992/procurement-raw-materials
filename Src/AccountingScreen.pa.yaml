                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FillPortions: =1
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Trade Name"
                              Width: =Parent.Width * 0.24
                        - lblACRcvColCode:
