                              Height: =32
                              Size: =9
                              Text: ="RM Code"
                              Width: =Parent.Width * 0.13
                        - lblACRcvColUnit:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Unit"
                              Width: =Parent.Width * 0.08
                        - lblACRcvColOrd:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Ordered"
                              Width: =Parent.Width * 0.12
                        - lblACRcvColRec:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Received"
                              Width: =Parent.Width * 0.12
                        - lblACRcvColOut:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Outstanding"
                              Width: =Parent.Width * 0.15
                        - lblACRcvColRnd:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(107, 105, 98, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              Size: =9
                              Text: ="Rounds"
                              Width: =Parent.Width * 0.09
                  - galACReceived:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        FillPortions: =0
                        Height: =CountRows(colPFUSummary) * 40 + 8
                        Items: =colPFUSummary
                        ShowScrollbar: =false
                        TemplateSize: =40
                        Width: =Parent.Width - 40
                      Children:
                        - rowACReceivedItem:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - lblACRcvName:
                                  Control: Label@2.5.1
                                  Properties:
                                    FillPortions: =1
                                    Height: =32
                                    Size: =11
                                    Text: =ThisItem.MaterialName
                                    Width: =Parent.Width * 0.24
                                    Wrap: =false
                              - lblACRcvCode:
                                  Control: Label@2.5.1
                                  Properties:
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    Size: =11
                                    Text: =If(IsBlank(ThisItem.RMPKCode), "—", ThisItem.RMPKCode)
