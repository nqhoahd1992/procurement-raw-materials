                Properties:
                  Color: =RGBA(107, 105, 98, 1)
                  Height: =64
                  PaddingLeft: =0
                  Size: =10
                  Text: ="Closing this request stops any further deliveries being created against it. Do this once the supplier has finished delivering — including when they delivered less than ordered and the shortfall is being written off."
                  Width: =Parent.Width - 40
            - lblCloseDlgOutstanding_RD:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(
                        IsEmpty(Filter(colLineItemsSummary, TotalReceivedQty < Quantity)),
                        RGBA(15, 110, 86, 1),
                        RGBA(133, 79, 11, 1)
                    )
                  FontWeight: =FontWeight.Semibold
                  Height: =48
                  PaddingLeft: =0
                  Size: =10
                  Text: |-
                    =If(
                        IsEmpty(Filter(colLineItemsSummary, TotalReceivedQty < Quantity)),
                        "✓ Every material has been fully received across all deliveries.",
                        "⚠ " & CountRows(Filter(colLineItemsSummary, TotalReceivedQty < Quantity)) & " of " & CountRows(colLineItemsSummary) & " material(s) are still short of the ordered quantity. You can still close — please say why below."
                    )
                  Width: =Parent.Width - 40
            - lblCloseDlgRemarksLbl_RD:
                Control: Label@2.5.1
                Properties:
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  PaddingLeft: =0
                  Size: =11
                  Text: ="Closing Remarks *"
                  Width: =Parent.Width - 40
            - txtCloseRemarks_RD:
                Control: TextInput@0.0.54
                Properties:
                  Height: =88
                  Mode: =TextMode.MultiLine
                  Placeholder: ="Why is this request being closed now?"
                  Width: =Parent.Width - 40
            - rowCloseDlgFooter_RD:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                Children:
                  - btnCloseDlgCancel_RD:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: =Set(gShowCloseRequest, false)
                        Text: ="Cancel"
                        Width: =110
                  - btnCloseDlgConfirm_RD:
                      Control: Button@0.0.45
                      Properties:
                        Height: =36
                        OnSelect: |-
                          =If(
                              IsBlank(txtCloseRemarks_RD.Value),
                              Notify("Please enter the closing remarks", NotificationType.Error),
                              If(
                                  Not(IsEmpty(Filter(colDeliveryBatches, Status.Value <> "Completed" && Status.Value <> "Cancelled"))),
                                  Notify("Some deliveries are still open. Finish or cancel them before closing the request.", NotificationType.Warning),
                                  With(
                                      {wLatest: LookUp('RM Procurement Requests', ID = gSelectedRequest.ID)},
                                      If(
                                          wLatest.Status.Value <> "In Delivery",
                                          Notify("This request is no longer open. Nothing was changed.", NotificationType.Warning);
                                          Set(gShowCloseRequest, false),
                                          With(
                                              {wClosed: Patch(
                                                  'RM Procurement Requests',
                                                  gSelectedRequest,
                                                  {
                                                      Status: {Value: "Closed"},
                                                      ClosedByID: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                      ClosedAt: Now(),
                                                      CloseRemarks: txtCloseRemarks_RD.Value
                                                  }
                                              )},
                                              If(
                                                  IsBlank(wClosed.ID),
                                                  Notify("Failed to close the request. Please try again.", NotificationType.Error),
                                                  Patch(
                                                      'RM Procurement Execution Log',
                                                      Defaults('RM Procurement Execution Log'),
                                                      {
                                                          Title: "Step 8 - Request Closed - " & gSelectedRequest.Title,
                                                          RequestID: {Id: gSelectedRequest.ID, Value: gSelectedRequest.Title},
                                                          RequestIDText: Text(gSelectedRequest.ID),
                                                          StepNumber: 8,
                                                          StepName: {Value: "Request Closed"},
                                                          ExecutedBy: {Id: gCurrentEmployee.ID, Value: gCurrentEmployee.Title},
                                                          ExecutedAt: Now(),
                                                          Notes: txtCloseRemarks_RD.Value
                                                      }
                                                  );
                                                  Set(gShowCloseRequest, false);
                                                  Notify("Request closed. No further deliveries can be created against it.", NotificationType.Success);
                                                  Navigate(HomeScreen)
                                              )
                                          )
                                      )
                                  )
                              )
                          )
                        Text: ="Confirm Close"
                        Width: =160
