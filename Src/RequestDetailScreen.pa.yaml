Screens:
  RequestDetailScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        Set(gIsDelivery, gSelectedRequest.RequestType.Value = "Delivery");
        Set(gShowCloseRequest, false);
        Set(gRootRequestID, If(gIsDelivery, gSelectedRequest.ParentRequestID, gSelectedRequest.ID));
        Set(gParentRequest, If(gIsDelivery, LookUp('RM Procurement Requests', ID = gSelectedRequest.ParentRequestID), Blank()));
        ClearCollect(colDeliveryBatches, SortByColumns(Filter('RM Procurement Requests', ParentRequestID = gSelectedRequest.ID), "DeliveryNumber", SortOrder.Ascending));
        ClearCollect(
            colRequirementFiles,
            ForAll(
                Filter(Split(Coalesce(If(gIsDelivery, gParentRequest.RequirementFiles, gSelectedRequest.RequirementFiles), ""), "|"), Len(Value) > 0) As f,
                {
                    FileName: f.Value,
                    FileURL: gSharePointAttachmentBase & Text(gRootRequestID) & "/" & EncodeUrl(f.Value)
                }
            )
        );
        ClearCollect(colLineItemsDetail, Filter('RM Procurement Line Items', RequestIDText = Text(gSelectedRequest.ID)));
        ClearCollect(colExecutionLog, Sort(Filter('RM Procurement Execution Log', RequestIDText = Text(gSelectedRequest.ID)), ID, SortOrder.Ascending));
        ClearCollect(colApprovalLog, Sort(Filter('RM Procurement Approval Log', RequestIDText = Text(gRootRequestID)), ID, SortOrder.Ascending));
        If(
            gIsDelivery,
            ClearCollect(colReceiptRounds, Filter('RM Procurement Receipt Rounds', RequestIDText = Text(gSelectedRequest.ID))),
            ClearCollect(colReceiptRounds, Filter('RM Procurement Receipt Rounds', ParentRequestID = gSelectedRequest.ID))
        );
        ClearCollect(
            colLineItemsSummary,
            ForAll(
                colLineItemsDetail As li,
                {
                    ID: li.ID,
                    MaterialID: li.MaterialID.Id,
                    MaterialName: li.MaterialName,
                    Unit: li.Unit,
                    Quantity: li.Quantity,
                    TotalReceivedQty: If(
                        gIsDelivery,
                        Sum(Filter(colReceiptRounds, LineItemID = li.ID), ReceivedQty),
                        Sum(Filter(colReceiptRounds, ParentLineItemID = li.ID), ReceivedQty)
                    )
                }
            )
        );
        ClearCollect(
            colRoundHistory,
            ForAll(
                Sort(
                    Filter('RM Procurement Execution Log', RequestIDText = Text(gSelectedRequest.ID) && StepNumber >= 3 && StepNumber <= 5),
                    ID,
                    SortOrder.Ascending
                ) As lg,
                {
                    ID: lg.ID,
                    StepNumber: lg.StepNumber,
                    StepLabel: If(lg.StepNumber = 5, "Procurement close-out", "Goods receipt"),
                    RoundNumber: lg.RoundNumber,
                    ActorName: Coalesce(lg.ReceivedBy, lg.ExecutedBy.Value),
                    ActionDate: Coalesce(lg.ReceiptDate, lg.ExecutedAt),
                    ReceiptStatus: lg.ReceiptStatus,
                    AcceptanceDecision: lg.AcceptanceDecision,
                    Notes: lg.Notes
                }
            )
        );
        Set(gRoundsDone, Coalesce(gSelectedRequest.ReceiptRoundCount, 0));
        Set(gShowReceiptPhotos, false);
        Set(gShowRoundDetails, false);
        Set(gShowLogDetail, false)
