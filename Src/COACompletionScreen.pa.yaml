Screens:
  COACompletionScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(gSelectedRequest, LookUp('RM Procurement Requests', ID = gSelectedRequest.ID));
        ClearCollect(
            colCOAOutstanding,
            ForAll(
                Filter(
                    'RM Procurement Receipt Rounds',
                    RequestIDText = Text(gSelectedRequest.ID) && COAMissing
                ),
                {ID: ID, MaterialName: MaterialName, COARound: RoundNumber, ReceivedQty: ReceivedQty, BatchNumber: BatchNumber, ExpiryDate: ExpiryDate, QCNumber: QCNumber, RMPKCode: RMPKCode, NewCOALink: ""}
            )
        )
    Children:
      - rectHeader_COA:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(83, 74, 183, 1)
            Height: =60
            Width: =Parent.Width
      - lblScreenTitle_COA:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =60
            Size: =14
            Text: ="Raw Material Procurement - Link to COA Completion"
            Width: =700
            X: =20
      - lblNotAuthorized_COA:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(163, 45, 45, 1)
            Fill: =RGBA(252, 235, 235, 1)
            Height: =Parent.Height - 60
            Size: =12
            Text: ="You do not have access to this page."
            Visible: =gCurrentUser.Role.Value <> "Procurement" && gCurrentUser.Role.Value <> "Admin"
            Width: =Parent.Width
            Y: =60
      - rowInfoBlock_COA:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 245, 250, 1)
            Height: =90
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =4
            PaddingBottom: =12
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =12
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"
            Width: =Parent.Width
            Y: =60
          Children:
            - rowInfoLine1_COA:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =34
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width - 40
                Children:
                  - lblInfoTitle_COA:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        Height: =24
                        Size: =14
                        Text: =gSelectedRequest.Title
                        Width: =600
                  - lblStatusBadge_COA:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(133, 79, 11, 1)
                        BorderThickness: =1
                        Color: =RGBA(133, 79, 11, 1)
                        Fill: =RGBA(250, 238, 218, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        PaddingLeft: =8
                        PaddingRight: =8
                        Size: =10
                        Text: =gSelectedRequest.Status.Value
                        Width: =220
            - lblOutstandingCount_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(136, 135, 128, 1)
                  Height: =20
                  Size: =11
                  Text: =CountRows(colCOAOutstanding) & " material line item(s) awaiting Link to COA on this request"
                  Width: =Parent.Width - 40
      - rowTableHeader_COA:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(241, 239, 232, 1)
            Height: =36
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            PaddingLeft: =20
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"
            Width: =Parent.Width
            Y: =150
          Children:
            - lblColMaterial_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="Material"
                  Width: =Parent.Width * 0.16
            - lblColRound_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="Round"
                  Width: =Parent.Width * 0.06
            - lblColQty_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="Received Qty"
                  Width: =Parent.Width * 0.08
            - lblColBatch_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="Batch No"
                  Width: =Parent.Width * 0.1
            - lblColExpiry_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="Expiry Date"
                  Width: =Parent.Width * 0.1
            - lblColQC_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="QC Number"
                  Width: =Parent.Width * 0.1
            - lblColRMPK_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="RM/PK Code"
                  Width: =Parent.Width * 0.1
            - lblColCOAInput_COA:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(68, 68, 65, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  Size: =9
                  Text: ="Link to COA (URL)"
                  Width: =Parent.Width * 0.28
      - galCOAOutstanding:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Height: =Parent.Height - 246
            Items: =colCOAOutstanding
            TemplateSize: =56
            Visible: =gCurrentUser.Role.Value = "Procurement" || gCurrentUser.Role.Value = "Admin"
            Width: =Parent.Width
            Y: =186
          Children:
            - rowCOAItem:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(Mod(ThisItem.ID, 2) = 0, RGBA(248, 247, 243, 1), RGBA(255, 255, 255, 1))
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  PaddingLeft: =20
                  PaddingRight: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =1358
                Children:
                  - lblCOAItemMaterial:
                      Control: Label@2.5.1
                      Properties:
                        Height: =32
                        Size: =11
                        Text: =ThisItem.MaterialName
                        Width: =Parent.Width * 0.16
                        Wrap: =false
                  - lblCOAItemRound:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(136, 135, 128, 1)
                        Height: =32
                        Size: =10
                        Text: ="Round " & ThisItem.COARound
                        Width: =Parent.Width * 0.06
                  - lblCOAItemQty:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(68, 68, 65, 1)
                        Height: =32
                        Size: =10
                        Text: =Text(ThisItem.ReceivedQty)
                        Width: =Parent.Width * 0.08
                  - lblCOAItemBatch:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(68, 68, 65, 1)
                        Height: =32
                        Size: =10
                        Text: =ThisItem.BatchNumber
                        Width: =Parent.Width * 0.1
                        Wrap: =false
                  - lblCOAItemExpiry:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(68, 68, 65, 1)
                        Height: =32
                        Size: =10
                        Text: =If(IsBlank(ThisItem.ExpiryDate), "", Text(ThisItem.ExpiryDate, "dd/mm/yyyy"))
                        Width: =Parent.Width * 0.1
                  - lblCOAItemQC:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(68, 68, 65, 1)
                        Height: =32
                        Size: =10
                        Text: =ThisItem.QCNumber
                        Width: =Parent.Width * 0.1
                        Wrap: =false
                  - lblCOAItemRMPK:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(68, 68, 65, 1)
                        Height: =32
                        Size: =10
                        Text: =ThisItem.RMPKCode
                        Width: =Parent.Width * 0.1
                        Wrap: =false
                  - txtCOALinkInput:
                      Control: TextInput@0.0.54
                      Properties:
                        FillPortions: =1
                        Height: =36
                        OnChange: |-
                          =UpdateIf(colCOAOutstanding, ID = ThisItem.ID, {NewCOALink: Self.Value})
                        Placeholder: ="Link to COA (URL)"
                        Value: =ThisItem.NewCOALink
                        Width: =Parent.Width * 0.28
      - rowFooter_COA:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingLeft: =20
            PaddingRight: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - 60
          Children:
            - btnBack_COA:
                Control: Button@0.0.45
                Properties:
                  Height: =36
                  OnSelect: =Navigate(RequestDetailScreen)
                  Text: ="Back"
                  Width: =120
            - btnSaveCOA_COA:
                Control: Button@0.0.45
                Properties:
                  Height: =40
                  OnSelect: |-
                    =If(
                        CountRows(Filter(colCOAOutstanding, Not(IsBlank(NewCOALink)))) = 0,
                        Notify("Please enter at least one Link to COA before saving.", NotificationType.Warning),
                        ForAll(
                            Filter(colCOAOutstanding, Not(IsBlank(NewCOALink))) As co,
                            Patch('RM Procurement Receipt Rounds', {ID: co.ID}, {COALink: co.NewCOALink, COAMissing: false})
                        );
                        Notify("Link to COA saved.", NotificationType.Success);
                        ClearCollect(
                            colCOAOutstanding,
                            ForAll(
                                Filter(
                                    'RM Procurement Receipt Rounds',
                                    RequestIDText = Text(gSelectedRequest.ID) && COAMissing
                                ),
                                {ID: ID, MaterialName: MaterialName, COARound: RoundNumber, ReceivedQty: ReceivedQty, BatchNumber: BatchNumber, ExpiryDate: ExpiryDate, QCNumber: QCNumber, RMPKCode: RMPKCode, NewCOALink: ""}
                            )
                        )
                    )
                  Text: ="Save Link to COA"
                  Width: =180
